---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: labgroupaccesspolicies.laboratory.cybericebox.com
spec:
  group: laboratory.cybericebox.com
  names:
    kind: LabGroupAccessPolicy
    listKind: LabGroupAccessPolicyList
    plural: labgroupaccesspolicies
    shortNames:
    - lgap
    singular: labgroupaccesspolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LabGroupAccessPolicy is the namespaced firewall policy of one LabGroup. The
          agent owns a fixed object in the LabGroup namespace and replaces its Spec in
          one Kubernetes update, while the VPN process watches this resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LabGroupAccessPolicySpec is a complete replacement desired policy. Empty is
              intentional and means no VPN client can reach a laboratory.
            properties:
              expectedGroupUID:
                type: string
              operationId:
                description: Empty identity retains the legacy policy replacement
                  contract.
                type: string
              revision:
                format: int64
                minimum: 1
                type: integer
              rules:
                items:
                  description: |-
                    LabGroupAccessRule targets selected clients and VPN gateways (connectors) of selected laboratories in one group. A VPN gateway is a flat
                    segment: its own /24 and nothing behind it. Access is per client and per connector, never per whole laboratory: an allow rule names the
                    laboratories AND the gateways, and may narrow what of the gateway's /24 is reachable with Include.

                    An empty ClientNames list means every LabGroupClient in this namespace. An allow rule needs LabNames; it reaches over VPN only the gateways in GatewayNames (empty GatewayNames: no VPN reach, only the browser access
                    of the laboratory, which the proxy decides per laboratory); a deny rule with an
                    empty LabNames or GatewayNames list means every laboratory or every VPN gateway. Deny always wins over allow.
                  properties:
                    action:
                      description: |-
                        LabGroupAccessAction is applied to every matching client/lab pair. Deny
                        rules always take precedence over allow rules; a pair matching no allow rule
                        is denied by default.
                      enum:
                      - allow
                      - deny
                      type: string
                    clientNames:
                      items:
                        type: string
                      maxItems: 256
                      type: array
                    gatewayNames:
                      description: GatewayNames are the VPN gateways (connectors)
                        of those laboratories the rule is about, by the name in the
                        lab's spec.gateways.
                      items:
                        type: string
                      maxItems: 16
                      type: array
                    include:
                      description: |-
                        Include narrows the access to these subnets of each named gateway's /24 (the union of the entries). Empty means the whole /24. There are
                        no ranges and no excludes. An entry is relative to the gateway, because its /24 is allocated by the operator: it always lies inside it.
                      items:
                        description: |-
                          AccessInclude is a subnet of a gateway's /24: <the /24>.Host/Prefix. Prefix is 24 (the whole /24, Host 0) to 32 (one address), and Host is
                          the first address of the subnet inside the /24, so it is a multiple of the subnet size (a /26 starts at 0, 64, 128 or 192).
                        properties:
                          host:
                            format: int32
                            maximum: 255
                            minimum: 0
                            type: integer
                          prefix:
                            format: int32
                            maximum: 32
                            minimum: 24
                            type: integer
                        required:
                        - host
                        - prefix
                        type: object
                        x-kubernetes-validations:
                        - message: host is not the first address of a subnet of that
                            size
                          rule: 'self.host % (self.prefix == 32 ? 1 : self.prefix
                            == 31 ? 2 : self.prefix == 30 ? 4 : self.prefix == 29
                            ? 8 : self.prefix == 28 ? 16 : self.prefix == 27 ? 32
                            : self.prefix == 26 ? 64 : self.prefix == 25 ? 128 : 256)
                            == 0'
                      maxItems: 32
                      type: array
                    labNames:
                      items:
                        type: string
                      maxItems: 256
                      type: array
                  required:
                  - action
                  type: object
                  x-kubernetes-validations:
                  - message: an allow rule names the laboratories
                    rule: self.action != 'allow' || (has(self.labNames) && size(self.labNames)
                      > 0)
                  - message: include needs an allow rule that names gateways
                    rule: '!has(self.include) || size(self.include) == 0 || (self.action
                      == ''allow'' && has(self.gatewayNames) && size(self.gatewayNames)
                      > 0)'
                type: array
            type: object
          status:
            description: |-
              LabGroupAccessPolicyStatus is written only by the in-namespace VPN
              reconciler after it has applied the matching policy generation.
            properties:
              appliedAt:
                format: date-time
                type: string
              appliedRevision:
                description: The current VPN boot acknowledges the exact policy operation/revision.
                format: int64
                type: integer
              lastError:
                type: string
              observedGeneration:
                format: int64
                type: integer
              operationId:
                type: string
              rules:
                items:
                  description: |-
                    LabGroupAccessPolicyRuleStatus is one effective client-to-lab firewall
                    relation. Counters are cumulative kernel counters; CounterReset marks a
                    replacement/restart so downstream summaries never infer negative traffic.
                  properties:
                    action:
                      description: |-
                        LabGroupAccessAction is applied to every matching client/lab pair. Deny
                        rules always take precedence over allow rules; a pair matching no allow rule
                        is denied by default.
                      enum:
                      - allow
                      - deny
                      type: string
                    bytes:
                      format: int64
                      type: integer
                    clientName:
                      type: string
                    counterReset:
                      type: boolean
                    gatewayNames:
                      description: |-
                        GatewayNames are the connectors of the laboratory the relation covers (the counters are those of the client in the laboratory, over all of
                        them).
                      items:
                        type: string
                      type: array
                    labName:
                      type: string
                    packets:
                      format: int64
                      type: integer
                  required:
                  - action
                  - clientName
                  - labName
                  type: object
                type: array
              state:
                type: string
              vpnBootId:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
