{{- if .Values.agent.enabled }}
# Cluster-scoped access for the agent: genuinely cluster-wide resources
# (cluster-scoped LabGroups, namespace resolution) plus the capacity/usage reads
# (nodes, pods, pod metrics) that span all namespaces. Bound cluster-wide by
# clusterrolebinding.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-agent-cluster
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroups", "labgroups/status" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
  # Tenants: the caller's tenant by certificate CN, and the status the agent keeps fresh.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "tenants" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "tenants/status" ]
    verbs: [ "get", "update", "patch" ]
  - apiGroups: [ "" ]
    resources: [ "namespaces" ]
    verbs: [ "get", "list", "watch" ]
  # capacity estimation: node allocatable + sum of scheduled pod requests (all namespaces).
  - apiGroups: [ "" ]
    resources: [ "nodes" ]
    verbs: [ "get", "list" ]
  # Pods are also watched: the Monitoring stream reads the pods of devices from an informer cache.
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list", "watch" ]
  # READ-ONLY, cluster-wide, for the Monitoring caches (one informer per kind instead of a list per group namespace on every poll).
  # Writes stay namespaced (laboratory-agent-role below, bound only in the group namespaces). These kinds exist only in group
  # namespaces, where the agent could read them already.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labs", "labgroupclients", "labgroupaccesspolicies", "labtrafficreports", "devices" ]
    verbs: [ "get", "list", "watch" ]
  # live resource usage (optional; requires metrics-server; all namespaces).
  - apiGroups: [ "metrics.k8s.io" ]
    resources: [ "pods" ]
    verbs: [ "get", "list" ]
---
# Namespaced access for the agent: per-lab resources. Granted ONLY inside each
# group namespace, via the RoleBinding the LabGroup reconciler creates — least
# privilege, so the agent cannot touch these resources in non-lab namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-agent-role
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labs", "labs/status", "labgroupclients", "labgroupclients/status", "labgroupaccesspolicies" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labtrafficreports", "devices", "devices/status", "connections", "connections/status", "labvpns", "labvpns/status", "labgateways", "labgateways/status" ]
    verbs: [ "get", "list", "watch" ]
  # ResetDevices and RescueDevices set the state controls in a device's spec.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "devices" ]
    verbs: [ "patch" ]
  # Env secrets are WRITE-ONLY for the agent: it CREATEs/DELETEs per-device env
  # Secrets (overwrite is delete+create) and never reads them — so a device's
  # env values (flags, licenses) are unreadable by the agent. No `get`/`list`:
  # the VPN client config now lives in the CR status, not a Secret.
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "create", "delete" ]
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "get", "list", "watch" ]
{{- end }}
