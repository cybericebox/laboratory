{{- /* Manual fallback only: the normal way is enrollment (see DEPLOY.md). */ -}}
{{- if and .Values.agent.enabled .Values.agent.mtls.enabled .Values.agent.tenantCertificates.enabled }}
{{- /* One client certificate per tenant, CN = the tenant name. */ -}}
{{- range $name, $_ := (include "laboratory.tenants" . | fromYaml) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: laboratory-agent-client-{{ $name }}
  namespace: {{ $.Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" $ | nindent 4 }}
spec:
  secretName: laboratory-agent-client-{{ $name }}-tls
  commonName: {{ $name | quote }}
  usages:
    - client auth
  issuerRef:
    name: laboratory-agent-ca
    kind: Issuer
{{- end }}
{{- end }}
