{{- if and .Values.agent.enabled .Values.registry.cache.enabled .Values.imagePullSecrets }}
{{- /*
PrewarmImages asks the upstream registries for the digest of a tag with the chart-level pull
secrets, like the operator does. The agent may read exactly those Secrets of the release namespace.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laboratory-agent-pull-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ secrets ]
    resourceNames:
      {{- range .Values.imagePullSecrets }}
      - {{ .name | quote }}
      {{- end }}
    verbs: [ get ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: laboratory-agent-pull-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laboratory-agent-pull-secrets
subjects:
  - kind: ServiceAccount
    name: laboratory-agent
    namespace: {{ $.Values.agent.namespace }}
{{- end }}
