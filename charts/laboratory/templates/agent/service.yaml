{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: laboratory-agent
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: laboratory-agent
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: laboratory-agent
  ports:
    - name: grpc
      port: {{ .Values.agent.grpcPort }}
      targetPort: {{ .Values.agent.grpcPort }}
      protocol: TCP
{{- end }}
