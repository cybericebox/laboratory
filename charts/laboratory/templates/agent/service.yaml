{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: laboratory-agent
  namespace: {{ $.Values.agent.namespace }}
  labels:
    app: laboratory-agent
    {{- include "laboratory.labels" . | nindent 4 }}
  {{- with .Values.agent.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # The entry of the platform's backend: the load balancer outside the cluster (infrastructure) sends the agent port to the node port of the
  # nodes that run the agent. mTLS stays (certificate-server.yaml). Local keeps the caller's address.
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: laboratory-agent
  ports:
    - name: grpc
      port: {{ .Values.agent.grpcPort }}
      targetPort: {{ .Values.agent.grpcPort }}
      protocol: TCP
      {{- with .Values.agent.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
