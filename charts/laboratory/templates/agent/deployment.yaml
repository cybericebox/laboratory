{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-agent
  namespace: {{ .Values.agent.namespace }}
  labels:
    app: laboratory-agent
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laboratory-agent
  template:
    metadata:
      labels:
        app: laboratory-agent
        {{- include "laboratory.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: laboratory-agent
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: ["/agent"]
          ports:
            - name: grpc
              containerPort: {{ .Values.agent.grpcPort }}
              protocol: TCP
          env:
            - name: AGENT_GRPC_PORT
              value: {{ .Values.agent.grpcPort | quote }}
            - name: AGENT_TLS_ENABLED
              value: "true"
            - name: AGENT_TLS_CERT
              value: /tls/tls.crt
            - name: AGENT_TLS_KEY
              value: /tls/tls.key
            - name: AGENT_ID
              value: {{ .Values.agent.id | quote }}
            - name: AGENT_TENANT_STATUS_INTERVAL
              value: {{ .Values.agent.tenantStatusInterval | quote }}
          {{- if include "laboratory.registryEnabled" . }}
            # ExportDeviceSnapshot reads the snapshots from the platform registry.
            - name: AGENT_REGISTRY_ADDR
              value: {{ include "laboratory.registryAddr" . | quote }}
          {{- end }}
          {{- if .Values.registry.cache.enabled }}
            # PrewarmImages: the agent makes the image cache fetch images ahead of time.
            - name: AGENT_CACHE_ENABLED
              value: "true"
            - name: AGENT_CACHE_REGISTRY_ADDR
              value: {{ include "laboratory.registryAddr" . | quote }}
            - name: AGENT_CACHE_REGISTRIES
              value: {{ include "laboratory.cacheRegistryNames" . | quote }}
            - name: AGENT_PULL_SECRETS
              value: {{ include "laboratory.pullSecretNames" . | quote }}
            - name: AGENT_PULL_SECRET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AGENT_CACHE_PIN_TTL
              value: {{ .Values.registry.cache.pinTTL | quote }}
            - name: AGENT_PREWARM_CONCURRENCY
              value: {{ .Values.registry.cache.prewarm.concurrency | quote }}
            - name: AGENT_PREWARM_TIMEOUT
              value: {{ .Values.registry.cache.prewarm.timeout | quote }}
          {{- end }}
            # The nodes lab pods run on: a percentage tenant quota is a percentage of their allocatable.
            - name: AGENT_LAB_NODE_SELECTOR
              value: {{ .Values.labWorkloads.nodeSelector | toJson | quote }}
            - name: AGENT_LAB_TOLERATIONS
              value: {{ .Values.labWorkloads.tolerations | toJson | quote }}
            # What a group's VPN and gateway pods request (the operator's values): their sum is the service overhead in GetCapacity.
            - name: VPN_CPU
              value: {{ .Values.vpn.resources.cpu | quote }}
            - name: VPN_MEMORY
              value: {{ .Values.vpn.resources.memory | quote }}
            - name: GATEWAY_CPU
              value: {{ .Values.inetGateway.resources.cpu | quote }}
            - name: GATEWAY_MEMORY
              value: {{ .Values.inetGateway.resources.memory | quote }}
            # A topology that asks for device state persistence is refused unless the platform allows it.
            - name: AGENT_STATE_PERSISTENCE_ENABLED
              value: {{ .Values.devices.statePersistence.enabled | quote }}
            # GetFeatures and Monitoring report these to the backend (the same values the operator gets).
            - name: AGENT_STATE_DEBOUNCE
              value: {{ .Values.devices.statePersistence.debounce | quote }}
            - name: AGENT_STATE_EXCLUDE_PATHS
              value: {{ join "," .Values.devices.statePersistence.excludePaths | quote }}
            - name: AGENT_STATE_WRITE_QUOTA
              value: {{ .Values.devices.statePersistence.writeQuota | quote }}
            - name: AGENT_STATE_MAX_FILE_SIZE
              value: {{ .Values.devices.statePersistence.maxFileSize | quote }}
            - name: AGENT_SCHEDULER_ENABLED
              value: {{ .Values.scheduler.enabled | quote }}
            - name: AGENT_SCHEDULER_MAX_PODS
              value: {{ .Values.scheduler.maxPods | quote }}
            - name: AGENT_LIMIT_DEVICE_MAX_CPU
              value: {{ .Values.limits.device.maxCpu | quote }}
            - name: AGENT_LIMIT_DEVICE_MAX_MEMORY
              value: {{ .Values.limits.device.maxMemory | quote }}
            - name: AGENT_LIMIT_DEVICE_DEFAULT_CPU
              value: {{ .Values.limits.device.defaultCpu | quote }}
            - name: AGENT_LIMIT_DEVICE_DEFAULT_MEMORY
              value: {{ .Values.limits.device.defaultMemory | quote }}
            - name: AGENT_LIMIT_LAB_MAX_DEVICES
              value: {{ .Values.limits.lab.maxDevices | quote }}
            - name: AGENT_LIMIT_GROUP_MAX_LABS
              value: {{ .Values.limits.group.maxLabs | quote }}
            - name: AGENT_LIMIT_GROUP_MAX_CPU
              value: {{ .Values.limits.group.maxCpu | quote }}
            - name: AGENT_LIMIT_GROUP_MAX_MEMORY
              value: {{ .Values.limits.group.maxMemory | quote }}
            - name: AGENT_LIMIT_TENANT_MAX_LABS
              value: {{ .Values.limits.tenant.maxLabs | quote }}
            - name: AGENT_PROXY_ACCESS_TOKEN_MAX_TTL
              value: {{ .Values.proxy.l7.accessTokenMaxTTL | quote }}
            - name: AGENT_PROXY_SESSION_IDLE_TTL
              value: {{ .Values.proxy.l7.sessionIdleTTL | quote }}
            - name: AGENT_PROXY_SESSION_MAX_TTL
              value: {{ .Values.proxy.l7.sessionMaxTTL | quote }}
            - name: AGENT_BASE_DOMAIN
              value: {{ required "operator.baseDomain is required" .Values.operator.baseDomain | quote }}
            - name: AGENT_PUBLIC_VPN_ENDPOINT
              value: {{ required "operator.publicVPNEndpoint is required" .Values.operator.publicVPNEndpoint | quote }}
            - name: AGENT_MONITORING_JOURNAL_SIZE
              value: {{ .Values.agent.monitoring.journalSize | quote }}
            - name: AGENT_MONITORING_JOURNAL_AGE
              value: {{ .Values.agent.monitoring.journalAge | quote }}
            - name: AGENT_MONITORING_POLL_INTERVAL
              value: {{ .Values.agent.monitoring.pollInterval | quote }}
            - name: AGENT_MONITORING_SUBSCRIBER_BUFFER
              value: {{ .Values.agent.monitoring.subscriberBuffer | quote }}
            - name: AGENT_MTLS_ENABLED
              value: {{ .Values.agent.mtls.enabled | quote }}
          {{- if .Values.agent.mtls.enabled }}
            - name: AGENT_MTLS_CLIENT_CA
              value: /ca/tls.crt
            # The agent signs the client certificates of enrolled tenants with this CA (Enroll, RenewCertificate).
            - name: AGENT_MTLS_CLIENT_CA_KEY
              value: /ca/tls.key
            - name: AGENT_CLIENT_CERT_TTL
              value: {{ .Values.agent.enrollment.certificateTTL | quote }}
          {{- end }}
          volumeMounts:
            - name: server-tls
              mountPath: /tls
              readOnly: true
          {{- if .Values.agent.mtls.enabled }}
            - name: client-ca
              mountPath: /ca
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: server-tls
          secret:
            secretName: laboratory-agent-server-tls
      {{- if .Values.agent.mtls.enabled }}
        - name: client-ca
          secret:
            secretName: laboratory-agent-ca
      {{- end }}
{{- end }}
