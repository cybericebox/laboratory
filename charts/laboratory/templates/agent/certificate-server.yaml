{{- if and .Values.agent.enabled .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: laboratory-agent-server
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  secretName: laboratory-agent-server-tls
  dnsNames:
    - {{ .Values.agent.domain | quote }}
  issuerRef:
    name: {{ .Values.certManager.issuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
