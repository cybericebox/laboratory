{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $.Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
    # The pods here are non-root, drop every capability, use the runtime's seccomp profile and a read-only root filesystem: the
    # restricted Pod Security level admits them and refuses anything that is not.
    pod-security.kubernetes.io/enforce: restricted
{{- end }}
