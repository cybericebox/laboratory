{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: laboratory-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  infrastructure:
    annotations:
      # Cilium copies infrastructure.annotations onto the Gateway's generated
      # LoadBalancer Service. lbipam.cilium.io/* is the canonical LB-IPAM
      # annotation domain (io.cilium/ works too as a legacy alias). The
      # load-bearing part is the MUTUAL sharing-cross-namespace pair: the WG
      # Service lives in laboratory-proxy while this Gateway's generated
      # Service lives in the release namespace, and LB-IPAM's isCompatible()
      # refuses cross-namespace IP sharing unless both services explicitly
      # list each other's namespace.
      lbipam.cilium.io/sharing-key: {{ .Values.proxy.sharingKey | quote }}
      lbipam.cilium.io/sharing-cross-namespace: "laboratory-proxy"
  listeners:
    - name: tls-passthrough
      protocol: TLS
      port: 443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
