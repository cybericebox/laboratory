{{- if include "laboratory.nodeState.enabled" . }}
{{- /* Every rule has its reason. node-state is the snapshot engine and the CPU throttle monitor (DEPLOY.md, "node-state"). */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: laboratory-node-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-node-state
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  # The devices: the snapshot engine follows the snapshot-backed ones of its node and publishes their state in the status; the CPU
  # throttle monitor writes status.cpuThrottle. The cached client needs list and watch or its informer never syncs.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ devices ]
    verbs: [ get, list, watch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ devices/status ]
    verbs: [ get, update, patch ]
  # The lab of a device (its lifecycle gates a capture), read directly.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labs ]
    verbs: [ get ]
  # The pods of its node (the informer asks the API server for all pods; RBAC cannot restrict that).
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ get, list, watch ]
  {{- if .Values.operator.admissionPolicy.enabled }}
  # The sibling capture policy confines this to the bound node's Device-owned Pod capture annotation. No patch privilege exists without it.
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ patch ]
  {{- end }}
  {{- if .Values.devices.statePersistence.enabled }}
  # The source reader requests only pull Secrets referenced by a freshly UID/node/container-bound Pod. No Secret list/watch/write is granted.
  - apiGroups: [ "" ]
    resources: [ secrets ]
    verbs: [ get ]
  {{- end }}
  # The annotation of its own node (cybericebox.com/state-persistence); the admission policy laboratory-node-state-annotation limits the
  # patch to that one annotation of its own node.
  - apiGroups: [ "" ]
    resources: [ nodes ]
    verbs: [ patch ]
  - apiGroups: [ "" ]
    resources: [ events ]
    verbs: [ create, patch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: laboratory-node-state
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: laboratory-node-state
subjects:
  - kind: ServiceAccount
    name: laboratory-node-state
    namespace: {{ .Release.Namespace }}
{{- end }}
