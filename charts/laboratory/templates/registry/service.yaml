{{- if include "laboratory.registryEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "laboratory.registrySelector" . | nindent 4 }}
  ports:
    - name: registry
      port: 5000
      targetPort: registry
    {{- if .Values.registry.cache.enabled }}
    # The image cache is served here only (TLS): the pull's credentials are in the requests.
    - name: registry-tls
      port: 5443
      targetPort: registry-tls
    {{- end }}
{{- end }}
