{{- if include "laboratory.registryEnabled" . }}
{{- $r := .Values.registry }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
    {{- include "laboratory.registrySelector" . | nindent 4 }}
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "laboratory.registrySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laboratory.labels" . | nindent 8 }}
        {{- include "laboratory.registrySelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/registry/configmap.yaml") . | sha256sum }}
        {{- if and .Values.bandwidth.enabled .Values.bandwidth.reserves.registryMbit }}
        # What the registry keeps of its node's bandwidth for itself (Mbit/s), taken off that node only.
        cybericebox.com/bandwidth-reserve: {{ .Values.bandwidth.reserves.registryMbit | quote }}
        {{- end }}
    spec:
      priorityClassName: {{ include "laboratory.priorityClass.platform" . }}
      # The gate checks the ServiceAccount tokens of its callers with TokenReview and watches the cluster objects it decides from, so the pod has
      # its own ServiceAccount. The token is NOT mounted for the pod (that would give it to zot too): a projected volume (gate-api-access, below)
      # holds it, the cluster's CA and the namespace, and only the gate container mounts it where a client library looks for them.
      serviceAccountName: laboratory-registry-gate
      automountServiceAccountToken: false
      # zot runs as an unprivileged user; fsGroup makes the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "laboratory.pool" (dict "pool" "labControl" "root" $) | nindent 6 }}
      initContainers:
        # A volume that is not made by a provisioner that honours fsGroup (hostPath, local-path, or a volume that an earlier version
        # filled as root) keeps its owner, and zot, which is not root, could not write to it. This hands the data directory to zot's user
        # and does nothing else: it is the one root container of the pod, with only the capabilities chown needs.
        - name: own-data
          image: {{ include "laboratory.imageRef" (dict "image" .Values.nodeAgent.image "root" $) | quote }}
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" .Values.nodeAgent.image.pullPolicy "tag" (include "laboratory.tag" (dict "image" .Values.nodeAgent.image "root" $))) }}
          command: [ "/bin/sh", "-c", "chown -R 65532:65532 /var/lib/registry" ]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
              add: [ CHOWN, DAC_OVERRIDE, FOWNER ]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            {{- toYaml .Values.nodeAgent.initResources | nindent 12 }}
      containers:
        - name: zot
          image: "{{ $r.image.repository }}:{{ $r.image.tag }}"
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" $r.image.pullPolicy "tag" $r.image.tag) }}
          args: [ "serve", "/etc/zot/config.json" ]
          # zot listens on 127.0.0.1:5001 of the pod only, so the kubelet cannot probe it: the gate's readiness follows zot (it dials 5001),
          # and a pod whose zot is down is not ready, so the Service stops sending it requests.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ ALL ]
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: auth
              mountPath: /etc/zot-auth
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
          {{- with $r.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # The gate: every request to the registry (the nodes' relay, the operator, the agent) reaches this container, and only it reaches zot.
        # It has ONE listener, TLS on 5443 (no plain port: a token must not cross the network in the clear), and decides every request from
        # the caller's token and the cluster's objects (see DEPLOY.md, "The registry gate"). It runs the image of the node
        # (/node registry-gate), as a plain user with no capability and a read-only root file system.
        - name: gate
          image: {{ include "laboratory.imageRef" (dict "image" .Values.nodeAgent.image "root" $) | quote }}
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" .Values.nodeAgent.image.pullPolicy "tag" (include "laboratory.tag" (dict "image" .Values.nodeAgent.image "root" $))) }}
          command: [ "/node", "registry-gate" ]
          env:
            - name: GATE_TLS_LISTEN
              value: ":5443"
            - name: GATE_HEALTH_LISTEN
              value: ":5002"
            - name: GATE_ZOT_ADDR
              value: "127.0.0.1:5001"
            # Every pull goes through the cache: /v2/c/<tenant>/<registry>/<repo>/... is proved against the upstream registry with the tenant's
            # credentials (read from the namespace {{ include "laboratory.upstreamNamespace" . }}, a constant of the gate) and served from zot.
            - name: GATE_CACHE_ENABLED
              value: "true"
            # The host nodes pull cache images from: a reference under any other host in front of /c/ is no cache reference. Mandatory.
            - name: GATE_IMAGE_HOST
              value: {{ include "laboratory.registryNodePrefix" . | quote }}
            # The callers, as <namespace>/<name>: the node-agent (the relay of a node), the operator and the agent. The audience of their tokens
            # is a constant of the gate (laboratory-registry-gate).
            - name: GATE_NODE_ACCOUNT
              value: {{ printf "%s/laboratory-node-agent" .Release.Namespace | quote }}
            - name: GATE_OPERATOR_ACCOUNT
              value: {{ printf "%s/laboratory-controller-manager" .Release.Namespace | quote }}
            - name: GATE_AGENT_ACCOUNT
              value: {{ printf "%s/laboratory-agent" .Values.agent.namespace | quote }}
            - name: GATE_TOKEN_CACHE_TTL
              value: {{ $r.gate.tokenCacheTTL | quote }}
            - name: GATE_BIND_SOURCE
              value: {{ $r.gate.bindSource | quote }}
            - name: GATE_PULL_GRACE
              value: {{ $r.gate.pullGrace | quote }}
            - name: GATE_GRANT_MAX_AGE
              value: {{ $r.gate.grantMaxAge | quote }}
            - name: GATE_API_STALE_MAX
              value: {{ $r.gate.apiStaleMax | quote }}
            - name: GATE_AGENT_MAX_FILLS
              value: {{ $r.gate.agentMaxFills | quote }}
            - name: GATE_MANIFEST_HOLD_BYTES
              value: {{ $r.gate.limits.manifestHoldBytes | int64 | quote }}
            - name: GATE_MANIFEST_MAX_BYTES
              value: {{ $r.gate.limits.manifestMaxBytes | int64 | quote }}
            - name: GATE_GRANTS_PER_NODE
              value: {{ $r.gate.limits.grantsPerNode | int64 | quote }}
            - name: GATE_GRANT_MAX_DIGESTS
              value: {{ $r.gate.limits.grantMaxDigests | int64 | quote }}
            - name: GATE_TOKENREVIEW_CONCURRENCY
              value: {{ $r.gate.limits.tokenReviewConcurrency | int64 | quote }}
            - name: GATE_UPLOADS_PER_DEVICE
              value: {{ $r.gate.limits.uploadsPerDevice | int64 | quote }}
            - name: GATE_UPLOADS_PER_NODE
              value: {{ $r.gate.limits.uploadsPerNode | int64 | quote }}
            # registry.allowedRegistries (plus the platform's own images): a registry that is not on it is refused before any upstream call.
            - name: GATE_ALLOWED_REGISTRIES
              value: {{ include "laboratory.allowedRegistries" . | quote }}
            - name: GATE_REQUIRE_DIGEST
              value: {{ $r.cache.requireDigest | quote }}
            - name: GATE_DECISION_MAX_AGE
              value: {{ $r.cache.decisionMaxAge | quote }}
            - name: GATE_DENIED_FOR
              value: {{ $r.cache.deniedFor | quote }}
            - name: GATE_STALE_IF_ERROR
              value: {{ $r.cache.staleIfError | quote }}
            - name: GATE_DISK_HIGH_WATER
              value: {{ $r.cache.diskHighWater | quote }}
            {{- if $r.cache.anonymousFill }}
            - name: GATE_ANONYMOUS_FILL_FILE
              value: /etc/gate-anonymous-fill/.dockerconfigjson
            {{- end }}
            {{- with .Values.devices.statePersistence }}
            {{- if .enabled }}
            # The push rules of the device snapshots (devices.statePersistence.*): the gate measures what it sees and does not trust the node's word.
            - name: GATE_MIN_PUSH_INTERVAL
              value: {{ .minPushInterval | quote }}
            - name: GATE_EXIT_MAX_BYTES
              value: {{ include "laboratory.bytes" .exitMaxBytes | quote }}
            - name: GATE_EXIT_PUSHES_PER_HOUR
              value: {{ .exitPushesPerHour | quote }}
            - name: GATE_SNAPSHOTS_ENABLED
              value: "true"
            - name: GATE_PUSH_BUDGET_BYTES
              value: {{ include "laboratory.bytes" .pushBudget | quote }}
            - name: GATE_PUSH_BUDGET_WINDOW
              value: {{ .pushBudgetWindow | quote }}
            - name: GATE_TENANT_QUOTA_BYTES
              value: {{ include "laboratory.bytes" .tenantQuota | quote }}
            - name: GATE_REGISTRY_RESERVE
              value: {{ .registryReserve | quote }}
            - name: GATE_SUPERSEDED_GRACE
              value: {{ .supersededGrace | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: gate-health
              containerPort: 5002
            - name: registry-tls
              containerPort: 5443
          readinessProbe:
            httpGet:
              path: /readyz
              port: gate-health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: gate-health
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          volumeMounts:
            # The gate's own token for the API server (TokenReview and the watches), with the CA and the namespace: in this container only.
            - name: gate-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: gate-config
              mountPath: /etc/gate
              readOnly: true
            # Its own account in zot and the key of its credential hash: nothing else of the registry Secret.
            - name: gate-secret
              mountPath: /etc/gate-secret
              readOnly: true
            - name: gate-tls
              mountPath: /etc/gate-tls
              readOnly: true
            # The volume of zot, to measure how full it is (the gate writes nothing there).
            - name: data
              mountPath: /var/lib/registry
              readOnly: true
            {{- if $r.cache.anonymousFill }}
            - name: gate-anonymous-fill
              mountPath: /etc/gate-anonymous-fill
              readOnly: true
            {{- end }}
          {{- with $r.gate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: gate-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: config
          configMap:
            name: laboratory-registry
        - name: auth
          secret:
            secretName: laboratory-registry
            items:
              - key: htpasswd
                path: htpasswd
        - name: data
          persistentVolumeClaim:
            claimName: laboratory-registry
        - name: gate-config
          configMap:
            name: laboratory-registry-gate
        - name: gate-secret
          secret:
            secretName: laboratory-registry
            items:
              - key: gatePassword
                path: password
              - key: gateKey
                path: key
        - name: gate-tls
          secret:
            secretName: laboratory-registry-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if $r.cache.anonymousFill }}
        - name: gate-anonymous-fill
          secret:
            secretName: {{ $r.cache.anonymousFill | quote }}
            items:
              - key: .dockerconfigjson
                path: .dockerconfigjson
        {{- end }}
{{- end }}
