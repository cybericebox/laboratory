{{- if include "laboratory.registryEnabled" . }}
{{- $r := .Values.registry }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
    {{- include "laboratory.registrySelector" . | nindent 4 }}
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "laboratory.registrySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laboratory.labels" . | nindent 8 }}
        {{- include "laboratory.registrySelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/registry/configmap.yaml") . | sha256sum }}
    spec:
      # zot never talks to the Kubernetes API: no ServiceAccount token in the pod.
      automountServiceAccountToken: false
      # zot runs as an unprivileged user; fsGroup makes the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # A volume that is not made by a provisioner that honours fsGroup (hostPath, local-path, or a volume that an earlier version
        # filled as root) keeps its owner, and zot, which is not root, could not write to it. This hands the data directory to zot's user
        # and does nothing else: it is the one root container of the pod, with only the capabilities chown needs.
        - name: own-data
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" .Values.nodeAgent.image.pullPolicy "tag" (.Values.nodeAgent.image.tag | default .Chart.AppVersion)) }}
          command: [ "/bin/sh", "-c", "chown -R 65532:65532 /var/lib/registry" ]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
              add: [ CHOWN, DAC_OVERRIDE, FOWNER ]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            {{- toYaml .Values.nodeAgent.initResources | nindent 12 }}
      containers:
        - name: zot
          image: "{{ $r.image.repository }}:{{ $r.image.tag }}"
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" $r.image.pullPolicy "tag" $r.image.tag) }}
          args: [ "serve", "/etc/zot/config.json" ]
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: registry
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: registry
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ ALL ]
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: auth
              mountPath: /etc/zot-auth
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
            {{- if $r.cache.enabled }}
            - name: sync-credentials
              mountPath: /etc/zot-sync
              readOnly: true
            {{- end }}
          {{- with $r.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: laboratory-registry
        - name: auth
          secret:
            secretName: laboratory-registry
            items:
              - key: htpasswd
                path: htpasswd
        - name: data
          persistentVolumeClaim:
            claimName: laboratory-registry
        {{- if $r.cache.enabled }}
        - name: sync-credentials
          secret:
            secretName: {{ default "laboratory-registry-sync" $r.cache.credentialsSecret }}
            items:
              - key: credentials.json
                path: credentials.json
        {{- end }}
{{- end }}
