{{- if include "laboratory.registryEnabled" . }}
{{- $r := .Values.registry }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
    {{- include "laboratory.registrySelector" . | nindent 4 }}
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "laboratory.registrySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laboratory.labels" . | nindent 8 }}
        {{- include "laboratory.registrySelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/registry/configmap.yaml") . | sha256sum }}
        {{- if and .Values.bandwidth.enabled .Values.bandwidth.reserves.registryMbit }}
        # What the registry keeps of its node's bandwidth for itself (Mbit/s), taken off that node only.
        cybericebox.com/bandwidth-reserve: {{ .Values.bandwidth.reserves.registryMbit | quote }}
        {{- end }}
    spec:
      priorityClassName: {{ include "laboratory.priorityClass.platform" . }}
      # zot never talks to the Kubernetes API: no ServiceAccount token in the pod.
      automountServiceAccountToken: false
      # zot runs as an unprivileged user; fsGroup makes the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "laboratory.placement" (dict "own" $r "root" $) }}
      {{- . | nindent 6 }}
      {{- end }}
      initContainers:
        # A volume that is not made by a provisioner that honours fsGroup (hostPath, local-path, or a volume that an earlier version
        # filled as root) keeps its owner, and zot, which is not root, could not write to it. This hands the data directory to zot's user
        # and does nothing else: it is the one root container of the pod, with only the capabilities chown needs.
        - name: own-data
          image: {{ include "laboratory.imageRef" (dict "image" .Values.nodeAgent.image "root" $) | quote }}
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" .Values.nodeAgent.image.pullPolicy "tag" (include "laboratory.tag" (dict "image" .Values.nodeAgent.image "root" $))) }}
          command: [ "/bin/sh", "-c", "chown -R 65532:65532 /var/lib/registry" ]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
              add: [ CHOWN, DAC_OVERRIDE, FOWNER ]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            {{- toYaml .Values.nodeAgent.initResources | nindent 12 }}
      containers:
        - name: zot
          image: "{{ $r.image.repository }}:{{ $r.image.tag }}"
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" $r.image.pullPolicy "tag" $r.image.tag) }}
          args: [ "serve", "/etc/zot/config.json" ]
          # zot listens on 127.0.0.1:5001 of the pod only, so the kubelet cannot probe it: the gate's readiness follows zot (it dials 5001),
          # and a pod whose zot is down is not ready, so the Service stops sending it requests.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ ALL ]
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: auth
              mountPath: /etc/zot-auth
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
          {{- with $r.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # The gate: every request to the registry (the nodes' relay, the operator, the agent) reaches this container, and only it reaches zot.
        # It runs the image of the node (/node registry-gate), as a plain user with no capability and a read-only root file system.
        - name: gate
          image: {{ include "laboratory.imageRef" (dict "image" .Values.nodeAgent.image "root" $) | quote }}
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" .Values.nodeAgent.image.pullPolicy "tag" (include "laboratory.tag" (dict "image" .Values.nodeAgent.image "root" $))) }}
          command: [ "/node", "registry-gate" ]
          env:
            - name: GATE_LISTEN
              value: ":5000"
            - name: GATE_HEALTH_LISTEN
              value: ":5002"
            - name: GATE_ZOT_ADDR
              value: "127.0.0.1:5001"
            {{- if $r.cache.enabled }}
            # The image cache: on, /v2/c/<registry>/... is proved against the upstream registry with the pull's own credentials and served from zot.
            - name: GATE_CACHE_ENABLED
              value: "true"
            - name: GATE_TLS_LISTEN
              value: ":5443"
            - name: GATE_DECISION_MAX_AGE
              value: {{ $r.cache.decisionMaxAge | quote }}
            - name: GATE_DENIED_FOR
              value: {{ $r.cache.deniedFor | quote }}
            - name: GATE_STALE_IF_ERROR
              value: {{ $r.cache.staleIfError | quote }}
            - name: GATE_DISK_HIGH_WATER
              value: {{ $r.cache.diskHighWater | quote }}
            {{- if $r.cache.anonymousFill }}
            - name: GATE_ANONYMOUS_FILL_FILE
              value: /etc/gate-anonymous-fill/.dockerconfigjson
            {{- end }}
            {{- end }}
          ports:
            - name: registry
              containerPort: 5000
            - name: gate-health
              containerPort: 5002
            {{- if $r.cache.enabled }}
            - name: registry-tls
              containerPort: 5443
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: gate-health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: gate-health
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          {{- if $r.cache.enabled }}
          volumeMounts:
            - name: gate-config
              mountPath: /etc/gate
              readOnly: true
            # Its own account in zot and the key of its credential hash: nothing else of the registry Secret.
            - name: gate-secret
              mountPath: /etc/gate-secret
              readOnly: true
            - name: gate-tls
              mountPath: /etc/gate-tls
              readOnly: true
            # The volume of zot, to measure how full it is (the gate writes nothing there).
            - name: data
              mountPath: /var/lib/registry
              readOnly: true
            {{- if $r.cache.anonymousFill }}
            - name: gate-anonymous-fill
              mountPath: /etc/gate-anonymous-fill
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with $r.gate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: laboratory-registry
        - name: auth
          secret:
            secretName: laboratory-registry
            items:
              - key: htpasswd
                path: htpasswd
        - name: data
          persistentVolumeClaim:
            claimName: laboratory-registry
        {{- if $r.cache.enabled }}
        - name: gate-config
          configMap:
            name: laboratory-registry-gate
        - name: gate-secret
          secret:
            secretName: laboratory-registry
            items:
              - key: gatePassword
                path: password
              - key: gateKey
                path: key
        - name: gate-tls
          secret:
            secretName: laboratory-registry-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if $r.cache.anonymousFill }}
        - name: gate-anonymous-fill
          secret:
            secretName: {{ $r.cache.anonymousFill | quote }}
            items:
              - key: .dockerconfigjson
                path: .dockerconfigjson
        {{- end }}
        {{- end }}
{{- end }}
