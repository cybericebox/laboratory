{{- if and .Values.registry.cache.enabled (not .Values.registry.cache.credentialsSecret) }}
{{- /*
Credentials zot uses against the upstream registries, in its sync credentials format,
built from the chart-level imagePullSecrets (dockerconfigjson Secrets of the release
namespace) with lookup. lookup sees nothing under `helm template` or a GitOps renderer:
there, set registry.cache.credentialsSecret. Docker Hub's entries map to registry-1.docker.io.
*/ -}}
{{- $creds := dict }}
{{- range .Values.imagePullSecrets }}
{{- $s := lookup "v1" "Secret" $.Release.Namespace .name }}
{{- if and $s $s.data (index $s.data ".dockerconfigjson") }}
{{- $cfg := index $s.data ".dockerconfigjson" | b64dec | fromJson }}
{{- range $host, $a := $cfg.auths }}
{{- $h := $host | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" | trimSuffix "/v1" }}
{{- if or (eq $h "index.docker.io") (eq $h "docker.io") }}{{ $h = "registry-1.docker.io" }}{{ end }}
{{- $user := $a.username }}
{{- $pass := $a.password }}
{{- if and (not $user) $a.auth }}
{{- $pair := splitList ":" ($a.auth | b64dec) }}
{{- $user = first $pair }}
{{- $pass = join ":" (rest $pair) }}
{{- end }}
{{- if $user }}{{ $_ := set $creds $h (dict "username" $user "password" $pass) }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: {{ toJson $creds | quote }}
{{- end }}
