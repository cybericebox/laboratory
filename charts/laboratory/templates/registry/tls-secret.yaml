{{- if include "laboratory.registryEnabled" . }}
{{- /*
The TLS port of the registry gate, the only listener. The gate reads tls.crt and tls.key from the Secret (only the registry pod mounts it). The
authority (public data) is published in a ConfigMap, laboratory-registry-ca, that the node-agents, the operator and the management agent mount:
a node can read every Secret a pod bound to it mounts, so the key must never share an object with what a node needs.
*/}}
{{- include "laboratory.registryTLS" . }}
{{- $t := .Values._registryTLS }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ $t.ca | quote }}
  tls.crt: {{ $t.crt | quote }}
  tls.key: {{ $t.key | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: laboratory-registry-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
data:
  ca.crt: {{ $t.ca | quote }}
{{- if .Values.agent.enabled }}
---
# The same authority for the management agent, which runs in its own namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: laboratory-registry-ca
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
data:
  ca.crt: {{ $t.ca | quote }}
{{- end }}
{{- end }}
