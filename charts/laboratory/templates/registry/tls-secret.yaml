{{- if and (include "laboratory.registryEnabled" .) .Values.registry.cache.enabled }}
{{- /*
The TLS port of the registry gate: the image cache is served there only, because the credentials of a pull cross the cluster network
from the relay of a node to the gate. The gate reads tls.crt and tls.key; the node-agents read ca.crt (nothing else of this Secret).
*/}}
{{- include "laboratory.registryTLS" . }}
{{- $t := .Values._registryTLS }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ $t.ca | quote }}
  tls.crt: {{ $t.crt | quote }}
  tls.key: {{ $t.key | quote }}
{{- end }}
