{{- if include "laboratory.registryEnabled" . }}
{{- /*
The Secret of the registry pod, read by the pod only: the one account of zot (gate) and the key of the gate's credential hash. See
"laboratory.registryCreds": generated once and kept across upgrades. No component outside the pod has a registry password: there is no
reader, writer or platform account, and no copy of this Secret in another namespace.
*/ -}}
{{- include "laboratory.registryCreds" . }}
{{- $c := .Values._registryCreds }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  gatePassword: {{ $c.gate | quote }}
  gateKey: {{ $c.gateKey | quote }}
  htpasswd: {{ $c.htpasswd | quote }}
{{- end }}
