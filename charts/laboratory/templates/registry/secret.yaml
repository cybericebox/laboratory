{{- if include "laboratory.registryEnabled" . }}
{{- /*
Credentials of the snapshot registry: the writer (the operator and the node-agents) and the reader (it may read the snapshots of
the labs and the base repository: they are not anonymous; the node-agent forwarder adds the reader to the node runtime's pulls, and
the agent uses it to export a snapshot). See "laboratory.registryCreds": generated once and kept across upgrades.
*/ -}}
{{- include "laboratory.registryCreds" . }}
{{- $c := .Values._registryCreds }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: writer
  password: {{ $c.writer | quote }}
  readerUsername: reader
  readerPassword: {{ $c.reader | quote }}
  {{- if $c.platform }}
  platformPassword: {{ $c.platform | quote }}
  {{- end }}
  htpasswd: {{ $c.htpasswd | quote }}
---
# The reader account for the agent, which runs in its own namespace: the agent exports snapshots from the registry.
{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry-reader
  namespace: {{ $.Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: reader
  password: {{ $c.reader | quote }}
{{- end }}
{{- if and .Values.registry.platform.enabled $c.platform }}
{{- /*
The account of the platform images (platform/**): the Secret for whoever writes them, here and in each namespace named in
registry.platform.writerNamespaces. The host is the in-cluster address of the registry (plain http inside the cluster).
*/ -}}
{{- range $ns := prepend (without (uniq .Values.registry.platform.writerNamespaces) $.Release.Namespace) $.Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry-platform
  namespace: {{ $ns }}
  labels:
    {{- include "laboratory.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: platform-writer
  password: {{ $c.platform | quote }}
  host: {{ printf "laboratory-registry.%s.svc:5000" $.Release.Namespace | quote }}
{{- end }}
{{- end }}
{{- end }}
