{{- if include "laboratory.registryEnabled" . }}
{{- /*
Credentials of the snapshot registry: the writer (the operator and the node-agents) and the reader (it may read the snapshots of
the labs and the base repository: they are not anonymous; the node-agent forwarder adds the reader to the node runtime's pulls, and
the agent uses it to export a snapshot). See "laboratory.registryCreds": generated once and kept across upgrades.
*/ -}}
{{- include "laboratory.registryCreds" . }}
{{- $c := .Values._registryCreds }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: writer
  password: {{ $c.writer | quote }}
  readerUsername: reader
  readerPassword: {{ $c.reader | quote }}
  htpasswd: {{ $c.htpasswd | quote }}
---
# The reader account for the agent, which runs in its own namespace: the agent exports snapshots from the registry.
{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry-reader
  namespace: {{ .Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: reader
  password: {{ $c.reader | quote }}
{{- end }}
{{- end }}
