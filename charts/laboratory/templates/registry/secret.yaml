{{- if include "laboratory.registryEnabled" . }}
{{- /*
Credentials of the snapshot registry's single writer. Generated once and kept across
upgrades (read back with lookup), so the operator and the node-agents, which read them
from this Secret, are not rolled by every helm upgrade. Reading the snapshots needs no
credentials (anonymous read, reachable only from the node-local forwarder and the operator).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "laboratory-registry" }}
{{- $password := randAlphaNum 40 }}
{{- $htpasswd := "" }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- $htpasswd = index $existing.data "htpasswd" | b64dec }}
{{- else }}
{{- $htpasswd = htpasswd "writer" $password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: writer
  password: {{ $password | quote }}
  htpasswd: {{ $htpasswd | quote }}
{{- end }}
