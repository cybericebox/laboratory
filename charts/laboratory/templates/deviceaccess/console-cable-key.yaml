{{- if .Values.consoleCables.enabled }}
{{- /*
The key of the cable stream between the device access pods of two nodes (console cables, DEPLOY.md "Console cables"): every open request of
the stream and its reply carry an HMAC-SHA256 with it. Only the device access DaemonSet mounts it; no other component, no ServiceAccount and no
Role reads it (the service has no Kubernetes API rights). Generated once and kept across upgrades; delete it and upgrade to rotate (the pods
read the file again when it changes).
*/ -}}
{{- include "laboratory.consoleCableKey" . }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-console-cable-key
  namespace: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ .Values._consoleCableKey | quote }}
{{- end }}
