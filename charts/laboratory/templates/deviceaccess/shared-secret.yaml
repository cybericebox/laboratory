{{- if .Values.terminal.enabled }}
{{- /*
The secret the L7 proxy signs its open requests to the device access service with, and the service checks (docs/specs/2026-11-12-device-access-and-checks.md,
section 3; DEPLOY.md, "Device console", has the rotation). The same value goes into one Secret in each of the two namespaces; both are mounted as
files (never an environment variable), and the service pod still has no API token.

It stays the same across upgrades: terminal.sharedSecret.value if set, else the one already in the cluster (found with `lookup`), else a new random
one. `helm template`, a dry run and GitOps tools that render without a cluster cannot see the cluster, so with them a new random secret would be made at
every render: set terminal.sharedSecret.value (from a sealed secret or the like) there. terminal.sharedSecret.accept is a second secret the service
accepts (for a rotation).
*/ -}}
{{- $secret := include "laboratory.deviceAccess.sharedSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-device-access-auth
  namespace: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  current: {{ $secret | quote }}
  {{- with .Values.terminal.sharedSecret.accept }}
  accept: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-proxy-device-access-auth
  namespace: {{ .Values.proxy.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
stringData:
  current: {{ $secret | quote }}
{{- end }}
