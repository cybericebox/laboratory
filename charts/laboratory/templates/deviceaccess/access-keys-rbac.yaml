{{- if include "laboratory.deviceAccess.enabled" . }}
{{- /*
The operator copies the access public keys of the tenants (public data) into the ConfigMap laboratory-access-keys of the device access service's
namespace; the service mounts it. The Role is that one ConfigMap and nothing else of the namespace; with console cables, also the creation of
the cable key Secret (create only: the operator never reads a Secret there).
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laboratory-operator-access-keys-mirror
  namespace: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ configmaps ]
    verbs: [ create ]
  - apiGroups: [ "" ]
    resources: [ configmaps ]
    resourceNames: [ laboratory-access-keys ]
    verbs: [ get, update ]
  {{- if .Values.consoleCables.enabled }}
  # The key of the cable stream (console cables): made once when it is missing; the operator never reads it back or changes it.
  - apiGroups: [ "" ]
    resources: [ secrets ]
    verbs: [ create ]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: laboratory-operator-access-keys-mirror
  namespace: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laboratory-operator-access-keys-mirror
subjects:
  - kind: ServiceAccount
    name: laboratory-controller-manager
    namespace: {{ .Release.Namespace }}
{{- end }}
