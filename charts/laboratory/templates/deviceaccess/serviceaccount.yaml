{{- if .Values.terminal.enabled }}
{{- /*
The service has no Kubernetes API rights: it finds a device container from the labels the runtime shows, so the account has no Role and its
token is not mounted into the pod.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: laboratory-device-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
