{{- if and .Values.terminal.enabled .Values.proxy.enabled }}
{{- /*
The L7 proxy finds the device access service pod on the node of a device from the EndpointSlices of the service's headless Service: an address and
a node name. The Role is in the service's own namespace, which holds nothing else, and covers no pod at all.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laboratory-proxy-device-access
  namespace: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ discovery.k8s.io ]
    resources: [ endpointslices ]
    verbs: [ get, list, watch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: laboratory-proxy-device-access
  namespace: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laboratory-proxy-device-access
subjects:
  - kind: ServiceAccount
    name: laboratory-proxy
    namespace: {{ .Values.proxy.namespace }}
{{- end }}
