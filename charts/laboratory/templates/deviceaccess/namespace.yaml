{{- if .Values.terminal.enabled }}
{{- /*
The device access service has a namespace of its own. The pod mounts the runtime socket and a host directory, which only the privileged Pod
Security level admits, and the L7 proxy reads the EndpointSlices of the service there (one Role): nothing else lives here, so neither is wider
than the service. As for the proxy and the agent, the pull Secrets named in imagePullSecrets must exist here too.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
{{- end }}
