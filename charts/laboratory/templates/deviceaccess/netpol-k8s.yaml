{{- if and .Values.consoleCables.enabled (not .Values.terminal.networkPolicy.enabled) }}
{{- /*
Console cables on a cluster without the Cilium policies (terminal.networkPolicy.enabled off): a plain NetworkPolicy keeps the cable port to
the device access pods. Ingress on consoleCables.port only from the device access pods of this namespace; the console port (with
terminal.enabled) only from the L7 proxy pods; the metrics port stays as open as without a policy. The stream is authenticated and sealed
on its own (DEPLOY.md, "Console cables"); this keeps every other pod off the port where the CNI enforces NetworkPolicy.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laboratory-device-access-cables
  namespace: {{ include "laboratory.deviceAccess.namespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laboratory.deviceAccess.selectorLabels" . | nindent 6 }}
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "laboratory.deviceAccess.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.consoleCables.port }}
          protocol: TCP
    {{- if .Values.terminal.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.proxy.namespace }}
          podSelector:
            matchLabels:
              app: laboratory-proxy-l7
      ports:
        - port: {{ .Values.terminal.port }}
          protocol: TCP
    {{- end }}
    - ports:
        - port: {{ .Values.terminal.metricsPort }}
          protocol: TCP
{{- end }}
