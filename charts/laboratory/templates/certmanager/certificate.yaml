{{- if and .Values.certManager.enabled .Values.proxy.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: proxy-tls
  namespace: laboratory-proxy
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  secretName: proxy-tls
  dnsNames:
  - "*.{{ .Values.operator.baseDomain }}"
  - {{ .Values.operator.baseDomain | quote }}
  issuerRef:
    name: {{ .Values.certManager.issuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
