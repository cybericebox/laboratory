{{- if .Values.proxy.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: laboratory-proxy
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: laboratory-proxy
subjects:
- kind: ServiceAccount
  name: laboratory-proxy
  namespace: {{ .Values.proxy.namespace }}
{{- end }}
