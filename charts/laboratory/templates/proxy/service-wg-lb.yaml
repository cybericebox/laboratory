{{- if and .Values.proxy.enabled .Values.proxy.wg.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: laboratory-proxy-wg
  namespace: {{ .Values.proxy.namespace }}
  {{- $annotations := merge (dict "lbipam.cilium.io/sharing-key" .Values.proxy.sharingKey "lbipam.cilium.io/sharing-cross-namespace" .Release.Namespace) .Values.proxy.service.annotations }}
  annotations:
    # lbipam.cilium.io/* is the canonical Cilium LB-IPAM annotation domain
    # (io.cilium/ works too as a legacy alias). The load-bearing part is the
    # MUTUAL sharing-cross-namespace pair with the Gateway's generated Service
    # (release namespace): LB-IPAM's isCompatible() refuses cross-namespace IP
    # sharing unless both services explicitly list each other's namespace.
    # proxy.service.annotations lets callers add extra annotations; the
    # lbipam pair above always wins on key collision (merge: dst wins).
    {{- toYaml $annotations | nindent 4 }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  # Cluster (not Local): Cilium's LB-IPAM sharing-key mechanism only shares an IP
  # between services with an identical externalTrafficPolicy, and when that policy
  # is Local it additionally requires both services to have the *same* pod selector
  # (see isCompatible() in operator/pkg/lbipam/service_store.go). The Gateway's
  # auto-created Service has no selector at all (Envoy handles routing internally),
  # so Local+Local can never satisfy that check — Cluster is required for this
  # Service to share laboratory-gateway's external IP.
  externalTrafficPolicy: Cluster
  selector:
    app: laboratory-proxy-l7
  ports:
    - name: wg
      protocol: UDP
      port: {{ .Values.operator.vpnServicePort }}
      targetPort: {{ .Values.proxy.wg.listenPort }}
{{- end }}
