{{- if .Values.proxy.enabled }}
{{- /*
The error journal: the L7 proxy publishes its aggregated errors as Events in the release namespace only, through a namespaced Role
(not the ClusterRole above). The demux has its own (wg/role.yaml).
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laboratory-proxy-events
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ events ]
    verbs: [ create, patch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: laboratory-proxy-events
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laboratory-proxy-events
subjects:
  - kind: ServiceAccount
    name: laboratory-proxy
    namespace: laboratory-proxy
{{- end }}
