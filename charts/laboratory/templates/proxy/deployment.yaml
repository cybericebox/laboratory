{{- if and .Values.proxy.enabled .Values.proxy.l7.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-proxy-l7
  namespace: laboratory-proxy
  labels:
    app: laboratory-proxy-l7
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.l7.replicas }}
  selector:
    matchLabels:
      app: laboratory-proxy-l7
  template:
    metadata:
      labels:
        app: laboratory-proxy-l7
    spec:
      serviceAccountName: laboratory-proxy
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: proxy-l7
        image: "{{ .Values.proxy.l7.image.repository }}:{{ .Values.proxy.l7.image.tag }}"
        imagePullPolicy: {{ .Values.proxy.l7.image.pullPolicy }}
        command: ["/proxy-l7"]
        env:
        - name: BASE_DOMAIN
          value: {{ .Values.operator.baseDomain | quote }}
        - name: LISTEN_HTTPS
          value: {{ .Values.proxy.l7.listen | quote }}
        - name: COOKIE_NAME
          value: {{ .Values.proxy.l7.cookieName | quote }}
        - name: TLS_CERT_PATH
          value: /etc/proxy/tls/tls.crt
        - name: TLS_KEY_PATH
          value: /etc/proxy/tls/tls.key
        - name: JWT_PUBLIC_KEY_PATH
          value: /etc/proxy/jwt/publicKey
        {{- if .Values.proxy.kindMode }}
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6443"
        {{- end }}
        volumeMounts:
        - name: tls
          mountPath: /etc/proxy/tls
          readOnly: true
        - name: jwt
          mountPath: /etc/proxy/jwt
          readOnly: true
        resources:
          {{- toYaml .Values.proxy.l7.resources | nindent 10 }}
      volumes:
      - name: tls
        secret:
          secretName: proxy-tls
      - name: jwt
        secret:
          secretName: proxy-credentials
{{- end }}
