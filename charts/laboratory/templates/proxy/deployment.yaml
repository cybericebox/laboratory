{{- if .Values.proxy.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: laboratory-proxy
  namespace: laboratory-proxy
  labels:
    app: laboratory-proxy
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: laboratory-proxy
  template:
    metadata:
      labels:
        app: laboratory-proxy
    spec:
      serviceAccountName: laboratory-proxy
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        {{- toYaml .Values.proxy.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.proxy.tolerations | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: proxy
        image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
        imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
        env:
        - name: BASE_DOMAIN
          value: {{ .Values.operator.baseDomain | quote }}
        - name: VPN_SERVICE_PORT
          value: {{ .Values.operator.vpnServicePort | quote }}
        - name: LISTEN_HTTPS
          value: {{ .Values.proxy.listen | quote }}
        - name: UDP_LISTEN_ADDR
          value: {{ .Values.proxy.udpListen | quote }}
        - name: COOKIE_NAME
          value: {{ .Values.proxy.cookieName | quote }}
        - name: EXTERNAL_INTERFACE
          value: {{ .Values.proxy.externalInterface | quote }}
        - name: TLS_CERT_PATH
          value: /etc/proxy/tls/tls.crt
        - name: TLS_KEY_PATH
          value: /etc/proxy/tls/tls.key
        - name: JWT_PUBLIC_KEY_PATH
          value: /etc/proxy/jwt/publicKey
        {{- if .Values.proxy.kindMode }}
        - name: KUBERNETES_SERVICE_HOST
          value: "127.0.0.1"
        - name: KUBERNETES_SERVICE_PORT
          value: "6443"
        {{- end }}
        volumeMounts:
        - name: tls
          mountPath: /etc/proxy/tls
          readOnly: true
        - name: jwt
          mountPath: /etc/proxy/jwt
          readOnly: true
        resources:
          {{- toYaml .Values.proxy.resources | nindent 10 }}
      volumes:
      - name: tls
        secret:
          secretName: proxy-tls
      - name: jwt
        secret:
          secretName: proxy-credentials
{{- end }}
