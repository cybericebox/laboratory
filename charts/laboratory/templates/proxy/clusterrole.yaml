{{- if .Values.proxy.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-proxy
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroups", "labs" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "services" ]
    verbs: [ "get", "list", "watch" ]
  # The group access policy is the same one the VPN enforces.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroupaccesspolicies" ]
    verbs: [ "get", "list", "watch" ]
  # A token names a LabGroupClient; the proxy checks that it exists.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroupclients" ]
    verbs: [ "get", "list", "watch" ]
  # Its request counters (LabTrafficReports) are written through a RoleBinding the operator makes in each group namespace
  # (ClusterRole laboratory-proxy-reports): the proxy has no such right cluster-wide.
{{- end }}
