{{- if and .Values.proxy.enabled .Values.proxy.l7.enabled }}
# The entry of the L7 proxy: a NodePort Service that keeps the client's address (externalTrafficPolicy Local). The load balancer outside the
# cluster (infrastructure) sends TCP 443 to the node port of the nodes that run a proxy pod; the proxy terminates TLS itself with proxy-tls.
apiVersion: v1
kind: Service
metadata:
  name: laboratory-proxy-l7
  namespace: {{ .Values.proxy.namespace }}
  labels:
    app: laboratory-proxy
    {{- include "laboratory.labels" . | nindent 4 }}
  {{- with .Values.proxy.l7.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: laboratory-proxy-l7
  ports:
    - name: https
      port: 443
      targetPort: {{ include "laboratory.l7Port" . }}
      protocol: TCP
      {{- with .Values.proxy.l7.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
