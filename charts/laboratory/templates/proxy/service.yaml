{{- if and .Values.proxy.enabled .Values.proxy.l7.enabled }}
# ClusterIP: receives TLS passthrough traffic from Cilium Gateway
apiVersion: v1
kind: Service
metadata:
  name: laboratory-proxy-l7
  namespace: {{ .Values.proxy.namespace }}
  labels:
    app: laboratory-proxy
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: laboratory-proxy-l7
  ports:
    - name: https
      port: 443
      targetPort: {{ trimPrefix ":" .Values.proxy.l7.listen | int }}
      protocol: TCP
{{- end }}
