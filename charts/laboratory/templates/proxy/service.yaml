{{- if .Values.proxy.enabled }}
# ClusterIP: receives TLS passthrough traffic from Cilium Gateway
apiVersion: v1
kind: Service
metadata:
  name: laboratory-proxy-l7
  namespace: laboratory-proxy
  labels:
    app: laboratory-proxy
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: laboratory-proxy
  ports:
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
---
# LoadBalancer: WireGuard demux, direct external access with source-IP preserved
apiVersion: v1
kind: Service
metadata:
  name: laboratory-proxy-wg
  namespace: laboratory-proxy
  labels:
    app: laboratory-proxy
    {{- include "laboratory.labels" . | nindent 4 }}
  {{- with .Values.proxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: laboratory-proxy
  ports:
  - name: wireguard
    port: {{ .Values.operator.vpnServicePort }}
    targetPort: {{ .Values.operator.vpnServicePort }}
    protocol: UDP
{{- end }}
