{{- if and .Values.proxy.enabled .Values.proxy.l7.enabled }}
{{- /*
  HMAC key of the proxy's own session cookie. Shared by all l7 replicas, kept
  across upgrades (looked up), and unknown to the platform.
*/}}
{{- $existing := lookup "v1" "Secret" .Values.proxy.namespace "proxy-session" }}
apiVersion: v1
kind: Secret
metadata:
  name: proxy-session
  namespace: {{ .Values.proxy.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
type: Opaque
data:
  sessionSecret: {{ if .Values.proxy.l7.sessionSecret }}{{ .Values.proxy.l7.sessionSecret | b64enc | quote }}{{ else if and $existing $existing.data }}{{ index $existing.data "sessionSecret" | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
{{- end }}
