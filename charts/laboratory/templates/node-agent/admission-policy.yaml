{{- if and .Values.nodeAgent.enabled .Values.operator.admissionPolicy.enabled }}
{{- /*
RBAC cannot limit a patch of nodes to one label of one node, so this policy does. The node-agent's ServiceAccount may patch the Node object of
its own node (the node name is in the bound token of its pod) and change nothing but the label laboratory.cybericebox.com/node-agent-ready,
which may only be "true", the removal of the startup taint cybericebox.com/node-starting (no other taint, no other spec field) and the two
annotations cybericebox.com/state-persistence and cybericebox.com/runtime-observation, the result of its start-up check (ready, disabled or
"unavailable: <CODE>: <detail>"). See DEPLOY.md, "Which nodes run labs".
*/ -}}
{{- $nodeAgent := printf "system:serviceaccount:%s:laboratory-node-agent" .Release.Namespace }}
{{- $key := "laboratory.cybericebox.com/node-agent-ready" }}
{{- $annotationKeys := "['cybericebox.com/state-persistence', 'cybericebox.com/runtime-observation']" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-node-agent-label
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [nodes]
  matchConditions:
    - name: from-the-node-agent
      expression: request.userInfo.username == {{ $nodeAgent | quote }}
  variables:
    - name: ownNode
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name' in request.userInfo.extra ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
    - name: newLabels
      expression: "object.metadata.?labels.orValue({})"
    - name: oldLabels
      expression: "oldObject.metadata.?labels.orValue({})"
    - name: newAnnotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldAnnotations
      expression: "oldObject.metadata.?annotations.orValue({})"
  validations:
    - expression: "variables.ownNode != '' && variables.ownNode == object.metadata.name"
      message: "the node-agent may change only the Node of the node it runs on"
      reason: Forbidden
    - expression: "object.spec.?taints.orValue([]) == oldObject.spec.?taints.orValue([]).filter(t, t.key != 'cybericebox.com/node-starting') || object.spec == oldObject.spec"
      message: "the node-agent may remove the startup taint cybericebox.com/node-starting and no other taint"
      reason: Forbidden
    - expression: "object.spec.?unschedulable == oldObject.spec.?unschedulable && object.spec.?providerID == oldObject.spec.?providerID && object.spec.?podCIDR == oldObject.spec.?podCIDR && object.spec.?podCIDRs == oldObject.spec.?podCIDRs && object.spec.?configSource == oldObject.spec.?configSource"
      message: "the node-agent may not change the spec of a node (unschedulable, ...)"
      reason: Forbidden
    - expression: "object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) && object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([])"
      message: {{ printf "the node-agent may change only the label %s of its node" $key | quote }}
      reason: Forbidden
    - expression: "variables.newAnnotations.all(k, k in {{ $annotationKeys }} || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k])) && variables.oldAnnotations.all(k, k in {{ $annotationKeys }} || k in variables.newAnnotations)"
      message: "the node-agent may change only the annotations cybericebox.com/state-persistence and cybericebox.com/runtime-observation of its node"
      reason: Forbidden
    - expression: "variables.newAnnotations.all(k, !(k in {{ $annotationKeys }}) || variables.newAnnotations[k].matches('^(ready|disabled|unavailable: [A-Z_]+: .{0,500})$'))"
      message: "the check annotations are ready, disabled or unavailable: CODE: detail"
      reason: Forbidden
    - expression: "variables.newLabels.all(k, k == '{{ $key }}' ? variables.newLabels[k] == 'true' : (k in variables.oldLabels && variables.oldLabels[k] == variables.newLabels[k]))"
      message: {{ printf "the node-agent may only set the label %s to true, and change no other label" $key | quote }}
      reason: Forbidden
    - expression: "variables.oldLabels.all(k, k == '{{ $key }}' || k in variables.newLabels)"
      message: {{ printf "the node-agent may not remove a label other than %s" $key | quote }}
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-node-agent-label
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  policyName: laboratory-node-agent-label
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-node-agent-capture
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [pods, pods/status]
  matchConditions:
    - name: from-the-node-agent
      expression: request.userInfo.username == {{ $nodeAgent | quote }}
  variables:
    - name: ownNode
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name' in request.userInfo.extra && size(request.userInfo.extra['authentication.kubernetes.io/node-name']) > 0 ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
    - name: newAnnotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldAnnotations
      expression: "oldObject.metadata.?annotations.orValue({})"
  validations:
    - expression: "variables.ownNode != '' && object.spec.nodeName == variables.ownNode && oldObject.spec.nodeName == variables.ownNode"
      message: "the node-agent may patch only Pods on its bound node"
      reason: Forbidden
    - expression: "'state.cybericebox.com/device' in variables.oldAnnotations && oldObject.metadata.?ownerReferences.orValue([]).exists(o, o.apiVersion == 'laboratory.cybericebox.com/v1alpha1' && o.kind == 'Device' && o.name == variables.oldAnnotations['state.cybericebox.com/device'] && has(o.controller) && o.controller && o.uid != '')"
      message: "the capture guard belongs only to platform Device-owned state Pods"
      reason: Forbidden
    - expression: "object.spec == oldObject.spec && object.?status.orValue({}) == oldObject.?status.orValue({})"
      message: "the node-agent may not change Pod spec or status"
      reason: Forbidden
    - expression: "object.metadata.?generateName == oldObject.metadata.?generateName && object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) && object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) && object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) && object.metadata.?deletionTimestamp == oldObject.metadata.?deletionTimestamp && object.metadata.?deletionGracePeriodSeconds == oldObject.metadata.?deletionGracePeriodSeconds"
      message: "the node-agent may not change Pod labels, ownership, finalizers or deletion state"
      reason: Forbidden
    - expression: "variables.newAnnotations.all(k, k == 'laboratory.cybericebox.com/capture-guard' || (k in variables.oldAnnotations && variables.newAnnotations[k] == variables.oldAnnotations[k])) && variables.oldAnnotations.all(k, k == 'laboratory.cybericebox.com/capture-guard' || k in variables.newAnnotations)"
      message: "the node-agent may change only the Pod capture-guard annotation"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-node-agent-capture
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  policyName: laboratory-node-agent-capture
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-node-agent-group-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [laboratory.cybericebox.com]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [labgroups/status]
  matchConditions:
    - name: from-the-node-agent
      expression: request.userInfo.username == {{ $nodeAgent | quote }}
  variables:
    - name: ownNode
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name' in request.userInfo.extra && size(request.userInfo.extra['authentication.kubernetes.io/node-name']) > 0 ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
  validations:
    - expression: "variables.ownNode != '' && object.spec == oldObject.spec && object.metadata.uid == oldObject.metadata.uid"
      message: "native reports require the bound node and immutable object ownership"
      reason: Forbidden
    - expression: "object.status.?serviceRuntime.orValue([]) == oldObject.status.?serviceRuntime.orValue([])"
      message: "the node-agent cannot mutate controller runtime inventory"
      reason: Forbidden
    - expression: "object.status.?creations == oldObject.status.?creations && object.status.?retirement == oldObject.status.?retirement && object.status.?lifecycle == oldObject.status.?lifecycle && object.status.?resources == oldObject.status.?resources && object.status.?phase == oldObject.status.?phase && object.status.?namespace == oldObject.status.?namespace && object.status.?suspended == oldObject.status.?suspended && object.status.?vpn == oldObject.status.?vpn && object.status.?imageWarning == oldObject.status.?imageWarning && object.status.?scheduling == oldObject.status.?scheduling && object.status.?pods == oldObject.status.?pods"
      message: "native report patches cannot change controller or other status fields"
      reason: Forbidden
    - expression: "object.status.?serviceReports.orValue([]).all(r, r.identity.nodeName == variables.ownNode || oldObject.status.?serviceReports.orValue([]).exists(o, o == r)) && oldObject.status.?serviceReports.orValue([]).all(o, o.identity.nodeName == variables.ownNode || object.status.?serviceReports.orValue([]).exists(r, r == o))"
      message: "the node-agent may replace only its own node's native reports"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-node-agent-group-runtime
spec:
  policyName: laboratory-node-agent-group-runtime
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-node-agent-device-runtime
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [laboratory.cybericebox.com]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [devices/status]
  matchConditions:
    - name: from-the-node-agent
      expression: request.userInfo.username == {{ $nodeAgent | quote }}
    - name: changing-native-reports
      expression: "object.status.?runtimeReports.orValue([]) != oldObject.status.?runtimeReports.orValue([]) || object.status.?runtimeInventory.orValue([]) != oldObject.status.?runtimeInventory.orValue([])"
  variables:
    - name: ownNode
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name' in request.userInfo.extra && size(request.userInfo.extra['authentication.kubernetes.io/node-name']) > 0 ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
  validations:
    - expression: "variables.ownNode != '' && object.spec == oldObject.spec && object.metadata.uid == oldObject.metadata.uid"
      message: "native reports require the bound node and immutable object ownership"
      reason: Forbidden
    - expression: "object.status.?runtimeInventory.orValue([]) == oldObject.status.?runtimeInventory.orValue([])"
      message: "the node-agent cannot mutate controller runtime inventory"
      reason: Forbidden
    - expression: "object.status.?ready == oldObject.status.?ready && object.status.?nodeName == oldObject.status.?nodeName && object.status.?nodeAddress == oldObject.status.?nodeAddress && object.status.?podIP == oldObject.status.?podIP && object.status.?podName == oldObject.status.?podName && object.status.?vniLease == oldObject.status.?vniLease && object.status.?vni == oldObject.status.?vni && object.status.?reason == oldObject.status.?reason && object.status.?state == oldObject.status.?state && object.status.?scheduling == oldObject.status.?scheduling"
      message: "native report patches cannot change controller or other status fields"
      reason: Forbidden
    - expression: "object.status.?runtimeReports.orValue([]).all(r, r.identity.nodeName == variables.ownNode || oldObject.status.?runtimeReports.orValue([]).exists(o, o == r)) && oldObject.status.?runtimeReports.orValue([]).all(o, o.identity.nodeName == variables.ownNode || object.status.?runtimeReports.orValue([]).exists(r, r == o))"
      message: "the node-agent may replace only its own node's native reports"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-node-agent-device-runtime
spec:
  policyName: laboratory-node-agent-device-runtime
  validationActions: [Deny]

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-node-agent-lab-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [laboratory.cybericebox.com]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [labs/status]
  matchConditions:
    - name: from-the-node-agent
      expression: request.userInfo.username == {{ $nodeAgent | quote }}
  variables:
    - name: ownNode
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name' in request.userInfo.extra && size(request.userInfo.extra['authentication.kubernetes.io/node-name']) > 0 ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
  validations:
    - expression: "variables.ownNode != '' && object.spec == oldObject.spec && object.metadata.uid == oldObject.metadata.uid"
      message: "native scope report requires exact object and bound node"
    - expression: "object.status.?scopeInventory == oldObject.status.?scopeInventory && object.status.?retirement == oldObject.status.?retirement && object.status.?lifecycle == oldObject.status.?lifecycle && object.status.?resources == oldObject.status.?resources && object.status.?phase == oldObject.status.?phase && object.status.?vpn == oldObject.status.?vpn && object.status.?internet == oldObject.status.?internet && object.status.?devices == oldObject.status.?devices && object.status.?connections == oldObject.status.?connections && object.status.?access == oldObject.status.?access && object.status.?scheduling == oldObject.status.?scheduling && object.status.?imageCache == oldObject.status.?imageCache && object.status.?imageDigests == oldObject.status.?imageDigests && object.status.?imageWarning == oldObject.status.?imageWarning && object.status.?conditions == oldObject.status.?conditions"
      message: "native scope reporter cannot change controller status"
    - expression: "object.status.?scopeReports.orValue([]).all(r, r.identity.nodeName == variables.ownNode ? (r.identity.ownerUID == string(object.metadata.uid) && oldObject.status.?scopeInventory.orValue([]).exists(i, i.ownerUID == r.identity.ownerUID && i.scopeUID == r.identity.scopeUID && i.nodeName == r.identity.nodeName && i.nodeBootID == r.identity.nodeBootID && i.operationId == r.identity.operationId && i.revision == r.identity.revision && i.generation == r.identity.generation)) : oldObject.status.?scopeReports.orValue([]).exists(o, o == r)) && oldObject.status.?scopeReports.orValue([]).all(o, o.identity.nodeName == variables.ownNode || object.status.?scopeReports.orValue([]).exists(r, r == o))"
      message: "native scope reporter may replace only its declared own-node rows"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-node-agent-lab-scope
spec:
  policyName: laboratory-node-agent-lab-scope
  validationActions: [Deny]
---
# The VNI ledger: the node-agent writes the ConfigMap vni-ledger-<its node> and no other ConfigMap.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-node-agent-ledger
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [configmaps]
  matchConditions:
    - name: from-the-node-agent
      expression: request.userInfo.username == {{ $nodeAgent | quote }}
  variables:
    - name: ownNode
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name' in request.userInfo.extra && size(request.userInfo.extra['authentication.kubernetes.io/node-name']) > 0 ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
  validations:
    - expression: "variables.ownNode != '' && object.metadata.name == 'vni-ledger-' + variables.ownNode"
      message: "the node-agent may write only the VNI ledger ConfigMap of the node it runs on"
      reason: Forbidden
    - expression: "'laboratory.cybericebox.com/vni-ledger' in object.metadata.?labels.orValue({}) && object.metadata.?labels.orValue({})['laboratory.cybericebox.com/vni-ledger'] == 'true' && 'laboratory.cybericebox.com/node' in object.metadata.?annotations.orValue({}) && object.metadata.?annotations.orValue({})['laboratory.cybericebox.com/node'] == variables.ownNode"
      message: "the VNI ledger ConfigMap carries its label and the name of its node"
      reason: Forbidden
    - expression: "!has(object.data) || object.data.all(k, k.matches('^[0-9]{1,8}$') && int(k) <= 16777215)"
      message: "a VNI ledger has only VNI numbers (0 to 16777215) as keys"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-node-agent-ledger
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  policyName: laboratory-node-agent-ledger
  validationActions: [Deny]
---
# Nobody but the node-agent of a node touches that node's VNI ledger ConfigMap: not even a cluster administrator (a ledger that is changed or
# deleted by hand stops holding the VNIs of the flows its node still carries). The one exception is the namespace controller, only while the
# namespace is being deleted. A deliberate removal means removing this policy first.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-vni-ledger-guard
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
  matchConditions:
    - name: a-ledger
      expression: "(request.operation == 'DELETE' ? oldObject : object).metadata.name.startsWith('vni-ledger-') || 'laboratory.cybericebox.com/vni-ledger' in (request.operation == 'DELETE' ? oldObject : object).metadata.?labels.orValue({}) || (request.operation == 'UPDATE' && 'laboratory.cybericebox.com/vni-ledger' in oldObject.metadata.?labels.orValue({}))"
  variables:
    - name: ownNode
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/node-name' in request.userInfo.extra && size(request.userInfo.extra['authentication.kubernetes.io/node-name']) > 0 ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
    - name: name
      expression: "(request.operation == 'DELETE' ? oldObject : object).metadata.name"
  validations:
    - expression: >-
        (request.userInfo.username == {{ $nodeAgent | quote }} && request.operation != 'DELETE' && variables.ownNode != '' && variables.name == 'vni-ledger-' + variables.ownNode)
        || (request.operation == 'DELETE' && request.userInfo.username == 'system:serviceaccount:kube-system:namespace-controller' && namespaceObject.status.phase == 'Terminating')
      message: "a VNI ledger ConfigMap is written only by the node-agent of its node and is never deleted by hand (remove the policy laboratory-vni-ledger-guard first)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-vni-ledger-guard
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  policyName: laboratory-vni-ledger-guard
  validationActions: [Deny]
{{- end }}
