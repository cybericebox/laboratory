  validations:
    - expression: "variables.ownNode != '' && object.spec == oldObject.spec && object.metadata.uid == oldObject.metadata.uid"
      message: "native reports require the bound node and immutable object ownership"
      reason: Forbidden
    - expression: "object.status.?serviceRuntime.orValue([]) == oldObject.status.?serviceRuntime.orValue([])"
      message: "the node-agent cannot mutate controller runtime inventory"
      reason: Forbidden
    - expression: "object.status.?lifecycle == oldObject.status.?lifecycle && object.status.?resources == oldObject.status.?resources && object.status.?phase == oldObject.status.?phase && object.status.?namespace == oldObject.status.?namespace && object.status.?suspended == oldObject.status.?suspended && object.status.?vpn == oldObject.status.?vpn && object.status.?imageWarning == oldObject.status.?imageWarning && object.status.?scheduling == oldObject.status.?scheduling && object.status.?pods == oldObject.status.?pods"
      message: "native report patches cannot change controller or other status fields"
      reason: Forbidden
    - expression: "object.status.?serviceReports.orValue([]).all(r, r.identity.nodeName == variables.ownNode || oldObject.status.?serviceReports.orValue([]).exists(o, o == r)) && oldObject.status.?serviceReports.orValue([]).all(o, o.identity.nodeName == variables.ownNode || object.status.?serviceReports.orValue([]).exists(r, r == o))"
      message: "the node-agent may replace only its own node's native reports"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-node-agent-group-runtime
spec:
  policyName: laboratory-node-agent-group-runtime
  validationActions: [Deny]
{{- end }}
