{{- if .Values.nodeAgent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-node-agent
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroups ]
    verbs: [ get, list, watch ]
  {{- if .Values.operator.admissionPolicy.enabled }}
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroups/status ]
    verbs: [ patch ]
  {{- end }}
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labs, devices, connections ]
    verbs: [ get, list, watch, update, patch ]
  # ConnectionReconciler resolves vpn/internet endpoints by reading the LabVPN/
  # LabGateway CRDs; the cached client needs list+watch or its informer never
  # syncs and Get blocks the reconcile worker forever.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labvpns, labgateways ]
    verbs: [ get, list, watch ]
  # Image prepull requests: it pulls the listed images through the container runtime and
  # writes its own node's entry of the status.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ imagepulls ]
    verbs: [ get, list, watch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ imagepulls/status ]
    verbs: [ get, update, patch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ connections/status, devices/status ]
    verbs: [ get, update, patch ]
  - apiGroups: [ "" ]
    resources: [ nodes ]
    verbs: [ get, list, watch ]
  # Marks its own node ready for lab pods (laboratory.cybericebox.com/node-agent-ready). The patch is limited to that one label of
  # its own node by the admission policy laboratory-node-agent-label.
  - apiGroups: [ "" ]
    resources: [ nodes ]
    verbs: [ patch ]
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ get, list, watch ]
  {{- if .Values.operator.admissionPolicy.enabled }}
  # The sibling capture policy confines this to the bound node's Device-owned
  # Pod capture annotation. No patch privilege exists without that policy.
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ patch ]
  {{- end }}
  - apiGroups: [ "" ]
    resources: [ events ]
    verbs: [ create, patch ]
{{- end }}
