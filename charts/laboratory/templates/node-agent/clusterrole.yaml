{{- include "laboratory.lifecycleProfile" . -}}
{{- if .Values.nodeAgent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-node-agent
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ allocation.cybericebox.com ]
    resources: [ pools ]
    verbs: [ get ]
  - apiGroups: [ apps ]
    resources: [ replicasets, deployments ]
    verbs: [ get ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroups ]
    verbs: [ get, list, watch ]
  {{- if .Values.operator.admissionPolicy.enabled }}
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroups/status, labs/status ]
    verbs: [ patch ]
  {{- end }}
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labs, devices, connections ]
    verbs: [ get, list, watch, update, patch ]
  # ConnectionReconciler resolves vpn/internet endpoints by reading the LabVPN/
  # LabGateway CRDs; the cached client needs list+watch or its informer never
  # syncs and Get blocks the reconcile worker forever.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labvpns, labgateways ]
    verbs: [ get, list, watch ]
  # Image prepull requests: it pulls the listed images through the container runtime and
  # writes its own node's entry of the status.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ imagepulls ]
    verbs: [ get, list, watch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ imagepulls/status ]
    verbs: [ get, update, patch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ connections/status, devices/status ]
    verbs: [ get, update, patch ]
  {{- if .Values.consoleCables.enabled }}
  # Console cables: it reads the cables (and the Devices of their ends, above), drives the lines of its node through the device access
  # service of the node, and writes the status of the cables whose console end runs on its node.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ consolecables ]
    verbs: [ get, list, watch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ consolecables/status ]
    verbs: [ get, update, patch ]
  {{- end }}
  - apiGroups: [ "" ]
    resources: [ nodes ]
    verbs: [ get, list, watch ]
  # Marks its own node ready for lab pods (laboratory.cybericebox.com/node-agent-ready). The patch is limited to that one label of
  # its own node (and the removal of the startup taint cybericebox.com/node-starting) by the admission policy laboratory-node-agent-label.
  {{- if .Values.operator.admissionPolicy.enabled }}
  - apiGroups: [ "" ]
    resources: [ nodes ]
    verbs: [ patch ]
  {{- end }}
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ get, list, watch ]
  - apiGroups: [ "" ]
    resources: [ events ]
    verbs: [ create, patch ]
{{- end }}
