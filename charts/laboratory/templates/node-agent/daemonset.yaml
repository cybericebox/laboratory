{{- if .Values.nodeAgent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: laboratory-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: node-agent
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: node-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: node-agent
        {{- include "laboratory.labels" . | nindent 8 }}
    spec:
      serviceAccountName: laboratory-node-agent
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      {{- if .Values.nodeAgent.excludeControlPlane }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Host prep: kernel modules and sysctls. Nothing is installed on the node.
        - name: host-prep
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              set -eu
              {{- range .Values.nodeAgent.hostPrep.modules }}
              modprobe {{ . | quote }}
              {{- end }}
              {{- range $key, $val := .Values.nodeAgent.hostPrep.sysctls }}
              echo {{ $val | quote }} > /proc/sys/{{ $key | replace "." "/" }}
              {{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          {{- with .Values.nodeAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # Open vSwitch as a native sidecar (restartPolicy: Always): it starts before the
        # next init containers and the node-agent, which wait for its startupProbe.
        - name: ovs
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          restartPolicy: Always
          command: [ "/node-agent/bin/start-ovs.sh" ]
          env:
            - name: OVS_SOCK
              value: {{ .Values.nodeAgent.ovsSocket | quote }}
          securityContext:
            privileged: true
          startupProbe:
            exec:
              command: [ "/bin/sh", "-c", "ovs-vsctl --timeout=2 --no-wait show >/dev/null && ovs-appctl -t ovs-vswitchd version >/dev/null" ]
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [ "/bin/sh", "-c", "ovs-appctl -t ovs-vswitchd version >/dev/null" ]
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: ovs-run
              mountPath: /run/openvswitch
            - name: ovs-db
              mountPath: /etc/openvswitch
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          {{- with .Values.nodeAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: install-cni-bins
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              set -e
              cp /laboratory /opt/cni/bin/cni-gate
              for p in bridge ptp loopback host-local portmap; do
                [ -f /usr/libexec/cni/$p ] && cp /usr/libexec/cni/$p /opt/cni/bin/$p
              done
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
          {{- with .Values.nodeAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: install-cni-conf
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          command: [ "/laboratory", "install-cni" ]
          env:
            - name: GRPC_SOCK
              value: {{ .Values.nodeAgent.grpcSocket | quote }}
            - name: CNI_CONF_DIR
              value: /etc/cni/net.d
            - name: CNI_FALLBACK_TIMEOUT
              value: "60s"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: cni-conf
              mountPath: /etc/cni/net.d
          {{- with .Values.nodeAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: node-agent
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          command: [ "/laboratory", "node-agent" ]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OVS_SOCK
              value: {{ .Values.nodeAgent.ovsSocket | quote }}
            - name: GRPC_SOCK
              value: {{ .Values.nodeAgent.grpcSocket | quote }}
            - name: NODE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CRI_SOCK
              value: {{ .Values.nodeAgent.criSocket | quote }}
          securityContext:
            capabilities:
              add: [ NET_ADMIN, SYS_ADMIN ]
              drop: [ ALL ]
          volumeMounts:
            - name: ovs-run
              mountPath: /run/openvswitch
            - name: grpc-dir
              mountPath: /run/cybericebox
            - name: cri-sock
              mountPath: {{ .Values.nodeAgent.criSocket | quote }}
            - name: host-netns
              mountPath: /run/netns
              # HostToContainer: propagate netns bind-mounts (cni-XXX) created on the
              # host after this container starts. Without it the container sees an empty
              # mountpoint instead of nsfs, and LinkSetNsFd fails with EINVAL.
              mountPropagation: HostToContainer
          {{- with .Values.nodeAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: ovs-run
          hostPath:
            path: {{ .Values.nodeAgent.ovsRunHostPath }}
            type: DirectoryOrCreate
        - name: ovs-db
          hostPath:
            path: {{ .Values.nodeAgent.ovsDBHostPath }}
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: grpc-dir
          hostPath:
            path: /run/cybericebox
            type: DirectoryOrCreate
        - name: cri-sock
          hostPath:
            path: {{ .Values.nodeAgent.criSocket }}
            type: Socket
        - name: host-netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
{{- end }}
