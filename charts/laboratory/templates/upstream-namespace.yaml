{{- /*
The upstream credentials namespace: what the registry gate proves a pull with against the upstream registries (Docker Hub, GHCR, a private
one). Three kinds of Secret, one writer each:
  tenant-<name>   the operator, from the tenant's images.pullSecret;
  lab-<hash>      the management agent, from the registry credentials of a lab's variant call (the operator deletes those of a lab that is gone);
  platform        the operator, from the platform pull secrets of the release (the platform's own images: the VPN, gateway and netconfig images).
Only the registry gate reads this namespace (templates/registry/rbac.yaml). No lab node, no pod of a lab and no component of the lab pool has a
right here, and no pod references these Secrets: a credential never reaches a node.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "laboratory.upstreamNamespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laboratory-operator-upstream
  namespace: {{ include "laboratory.upstreamNamespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "create", "delete", "get", "list", "update", "patch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: laboratory-operator-upstream
  namespace: {{ include "laboratory.upstreamNamespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laboratory-operator-upstream
subjects:
  - kind: ServiceAccount
    name: laboratory-controller-manager
    namespace: {{ .Release.Namespace }}
{{- if .Values.agent.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laboratory-agent-upstream
  namespace: {{ include "laboratory.upstreamNamespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  # The credentials of a lab are written by delete and create (never updated in place) and read back by nobody but the gate.
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "create", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: laboratory-agent-upstream
  namespace: {{ include "laboratory.upstreamNamespace" . }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laboratory-agent-upstream
subjects:
  - kind: ServiceAccount
    name: laboratory-agent
    namespace: {{ $.Values.agent.namespace }}
{{- end }}
