{{- if .Values.devices.statePersistence.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: laboratory-snapshots
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "laboratory.snapshotRegistrySelector" . | nindent 4 }}
  ports:
    - name: registry
      port: 5000
      targetPort: registry
{{- end }}
