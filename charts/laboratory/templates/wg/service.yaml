{{- if and .Values.proxy.enabled .Values.proxy.wg.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: laboratory-proxy-wg
  namespace: {{ include "laboratory.wgNamespace" . }}
  {{- $annotations := merge (dict "lbipam.cilium.io/sharing-key" .Values.proxy.sharingKey "lbipam.cilium.io/sharing-cross-namespace" (join "," (concat (list .Release.Namespace) .Values.proxy.sharedNamespaces))) .Values.proxy.service.annotations }}
  annotations:
    # lbipam.cilium.io/* is the canonical Cilium LB-IPAM annotation domain
    # (io.cilium/ works too as a legacy alias). The load-bearing part is the
    # MUTUAL sharing-cross-namespace pair with the Gateway's generated Service
    # (release namespace): LB-IPAM's isCompatible() refuses cross-namespace IP
    # sharing unless both services explicitly list each other's namespace.
    # proxy.service.annotations lets callers add extra annotations; the
    # lbipam pair above always wins on key collision (merge: dst wins).
    {{- toYaml $annotations | nindent 4 }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  # Empty follows the mode: Cluster for userspace (as before the modes; it shares the Gateway's address), Local for tc and xdp (a packet
  # must reach a node whose kernel holds its session). LB-IPAM shares an IP between services with an identical policy only, and with Local
  # it also wants the same pod selector, which the Gateway's selector-less Service cannot have.
  externalTrafficPolicy: {{ include "laboratory.wgExternalTrafficPolicy" . }}
  selector:
    app: laboratory-proxy-wg
  ports:
    - name: wg
      protocol: UDP
      port: {{ include "laboratory.wgPublicPort" . }}
      targetPort: {{ include "laboratory.wgPort" . }}
      {{- with .Values.proxy.wg.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
