{{- if include "laboratory.wgEnabled" . }}
# The entry of the VPN: a NodePort Service with externalTrafficPolicy Local in every demux mode, so the client's address reaches the demux
# and a packet arrives on a node that runs a demux pod (the demux is a DaemonSet on the lab pool). The load balancer outside the cluster
# (infrastructure) sends UDP {{ include "laboratory.wgPublicPort" . }} to the node port of those nodes and health-checks them.
apiVersion: v1
kind: Service
metadata:
  name: laboratory-proxy-wg
  namespace: {{ include "laboratory.wgNamespace" . }}
  {{- with .Values.proxy.wg.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: laboratory-proxy-wg
  ports:
    - name: wg
      protocol: UDP
      port: {{ include "laboratory.wgPublicPort" . }}
      targetPort: {{ include "laboratory.wgPort" . }}
      {{- with .Values.proxy.wg.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
