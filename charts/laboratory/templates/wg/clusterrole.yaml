{{- if and .Values.proxy.enabled .Values.proxy.wg.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-proxy-wg
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  # The demux table: the keys and addresses of the groups' VPN pods.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroups" ]
    verbs: [ "get", "list", "watch" ]
  # The entry addresses of its own node (the node's InternalIP and ExternalIP).
  - apiGroups: [ "" ]
    resources: [ "nodes" ]
    verbs: [ "get", "list", "watch" ]
{{- end }}
