{{/*
NetworkPolicy + CiliumNetworkPolicy for the laboratory-agent Deployment
(singleton, namespace .Values.agent.namespace, pod label
app: laboratory-agent — see charts/laboratory/templates/agent/deployment.yaml).

Ingress (TCP .Values.agent.grpcPort): the Service is a NodePort with externalTrafficPolicy Local (templates/agent/service.yaml), so the
connection of the platform's backend arrives from outside the cluster with its own address: the `world` entity. The port is the only one open
to it, and mTLS decides who is let in. Whether Cilium classes a Local NodePort client as `world` (and whether `host` or `remote-node` must be
added for the node health check) is proved on the staging cluster (docs/laboratory/specs/pools-release.md, S3). The vanilla NetworkPolicy
below only keeps an ipBlock peer for .Values.operator.proxySourceCIDRs, a fallback for hostNetwork proxy sources on non-Cilium clusters
(e.g. Kind).

Egress is handled entirely by the CiliumNetworkPolicy below (toEntities:
[kube-apiserver] only, mirroring vpnCiliumPolicy/gatewayCiliumPolicy in
internal/controller/laboratory/labgroup_controller.go); the native
NetworkPolicy here only governs ingress.
*/}}
{{- if and .Values.agent.enabled .Values.agent.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laboratory-agent
  namespace: {{ $.Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: laboratory-agent
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.operator.proxySourceCIDRs }}
    - from:
        {{- range splitList "," .Values.operator.proxySourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.agent.grpcPort }}
    {{- end }}
    {{- if .Values.agent.metrics.enabled }}
    - ports:
        - protocol: TCP
          port: {{ .Values.agent.metrics.port }}
    {{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: laboratory-agent
  namespace: {{ $.Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: laboratory-agent
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: {{ .Values.agent.grpcPort | quote }}
              protocol: TCP
  {{- if .Values.agent.metrics.enabled }}
    # The metrics port (agent.metrics): scraped from inside the cluster.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: {{ .Values.agent.metrics.port | quote }}
              protocol: TCP
  {{- end }}
  egress:
    - toEntities:
        - kube-apiserver
{{- if include "laboratory.registryEnabled" . }}
    # The registry gate (TLS port only): snapshot export, and PrewarmImages with the cache.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            {{- include "laboratory.registrySelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
    # DNS: the gate's Service name and the upstream registries of PrewarmImages. The agent is the one component of this entry set that needs it.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
{{- if .Values.registry.cache.enabled }}
    # PrewarmImages: the upstream registries (digest of a tag).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- end }}
