{{/*
NetworkPolicy + CiliumNetworkPolicy for the laboratory-agent Deployment (namespace .Values.agent.namespace, pod label app: laboratory-agent, see
templates/agent/deployment.yaml).

Ingress (cluster-layout 15, 18.4, 18.9). The agent serves one thing, the gRPC API on .Values.agent.grpcPort (mTLS; Enroll without a client
certificate), plus the optional metrics port. Its callers, read from the code and the deployment:
  - the platform's backend (backend internal/delivery/infrastructure/labagent/dial.go): it dials the agent's Service name over the pod network
    (the trusted platform <-> lab-control tunnel). Admitted by pod identity, agent.networkPolicy.ingressFrom.fromEndpoints (default: namespace
    platform, app: backend). Every exposure mode.
  - exposure=open only: callers outside the cluster through the public listener of the lab load balancer (a laptop backend, another platform),
    from the allowlist agent.networkPolicy.ingressFrom.fromCIDR and nothing else; the "world" entity is never admitted.
  - agent.metrics.enabled only: a scraper in the cluster on the metrics port (no scraper exists today).
Not a network caller: the kubelet's probes (tcpSocket on the gRPC port) come from the local host, which Cilium admits by default; kubectl
port-forward enters the pod through the kubelet, not the pod network (test/e2e/reservation_agent_test.go). No other pod of the laboratory dials
the agent. The namespace's default deny (netpol/lab-control.yaml) closes everything else.

The vanilla NetworkPolicy only keeps an ipBlock peer for .Values.operator.proxySourceCIDRs (hostNetwork sources of non-Cilium development
clusters, e.g. Kind). Cilium joins its rules with the CiliumNetworkPolicy's, so it holds no rule without a source: a rule with ports and no
"from" would admit the whole internet.

Egress is handled entirely by the CiliumNetworkPolicy below; the native NetworkPolicy here only governs ingress.
*/}}
{{- if and .Values.agent.enabled .Values.agent.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laboratory-agent
  namespace: {{ $.Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: laboratory-agent
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.operator.proxySourceCIDRs }}
    - from:
        {{- range splitList "," .Values.operator.proxySourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.agent.grpcPort }}
    {{- else }} []
    {{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: laboratory-agent
  namespace: {{ $.Values.agent.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: laboratory-agent
  ingress:
  {{- with .Values.agent.networkPolicy.ingressFrom.fromEndpoints }}
    # The in-cluster callers: the platform's backend.
    - fromEndpoints:
        {{- range . }}
        - matchLabels:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $.Values.agent.grpcPort | quote }}
              protocol: TCP
  {{- end }}
  {{- if eq (include "laboratory.exposure" .) "open" }}
    # exposure=open: the public listener of the lab load balancer, from the allowlist only.
    - fromCIDR:
        {{- range .Values.agent.networkPolicy.ingressFrom.fromCIDR }}
        - {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ .Values.agent.grpcPort | quote }}
              protocol: TCP
  {{- end }}
  {{- if .Values.agent.metrics.enabled }}
    # The metrics port (agent.metrics): scraped from inside the cluster.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: {{ .Values.agent.metrics.port | quote }}
              protocol: TCP
  {{- end }}
  egress:
    - toEntities:
        - kube-apiserver
{{- if include "laboratory.registryEnabled" . }}
    # The registry gate (TLS port only): snapshot export, and PrewarmImages with the cache.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            {{- include "laboratory.registrySelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
    # DNS: the gate's Service name and the upstream registries of PrewarmImages. The agent is the one component of this entry set that needs it.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
{{- if .Values.registry.cache.enabled }}
    # PrewarmImages: the upstream registries (digest of a tag).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- end }}
