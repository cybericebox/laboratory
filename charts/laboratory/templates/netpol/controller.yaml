{{/*
CiliumNetworkPolicy for the laboratory-controller-manager Deployment
(singleton, namespace .Release.Namespace, pod labels
control-plane: controller-manager + laboratory.selectorLabels — see
charts/laboratory/templates/operator/deployment.yaml).

Ingress: the operator serves no API. No webhook is registered (internal/cmds/manager/manager.go: "No webhook is served"), the CRDs have no
conversion webhook, and gateway statistics reach it through the API (LabEgressReport), not by a pull. It listens on the health port 8081 (the
kubelet's probes, from the local host, which Cilium admits by default) and, with operator.metrics.enabled, on the metrics port for a scraper
in the cluster. So: the metrics port from the cluster when it is on, otherwise an explicit default deny (the empty rule).

Egress is locked to kube-apiserver, mirroring the toEntities: [kube-apiserver] shape used by vpnCiliumPolicy/gatewayCiliumPolicy in
internal/controller/laboratory/labgroup_controller.go.
*/}}
{{- if .Values.operator.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: laboratory-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
      {{- include "laboratory.selectorLabels" . | nindent 6 }}
  ingress:
  {{- if .Values.operator.metrics.enabled }}
    # The metrics port (operator.metrics): scraped from inside the cluster.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: {{ .Values.operator.metrics.port | quote }}
              protocol: TCP
  {{- else }}
    # An empty rule makes ingress default-deny.
    - {}
  {{- end }}
  egress:
    - toEntities:
        - kube-apiserver
{{- if include "laboratory.registryEnabled" . }}
    # The registry gate (TLS port only): snapshot reset and retention sweep, with the operator's own token.
    - toEndpoints:
        - matchLabels:
            {{- include "laboratory.registrySelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
{{- end }}
{{- if .Values.registry.cache.enabled }}
    # Image cache: the operator asks the upstream registries for the digest of a tag.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
    # DNS lookups of the registry Service and of the upstream registries.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
