{{/*
CiliumNetworkPolicy for the laboratory-controller-manager Deployment
(singleton, namespace .Release.Namespace, pod labels
control-plane: controller-manager + laboratory.selectorLabels — see
charts/laboratory/templates/operator/deployment.yaml). No ingress: the
controller is only ever a client (to the Kubernetes API server); egress is
locked to kube-apiserver, mirroring the toEntities: [kube-apiserver] shape
used by vpnCiliumPolicy/gatewayCiliumPolicy in
internal/controller/laboratory/labgroup_controller.go.
*/}}
{{- if .Values.operator.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: laboratory-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
      {{- include "laboratory.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
    # Platform registry (snapshot reset and retention sweep when state persistence is on).
    - toEndpoints:
        - matchLabels:
            {{- include "laboratory.registrySelector" . | nindent 12 }}
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
{{- if .Values.registry.cache.enabled }}
    # Image cache: the operator asks the upstream registries for the digest of a tag.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
    # DNS lookups of the registry Service and of the upstream registries.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
