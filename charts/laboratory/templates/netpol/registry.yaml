{{- if and (include "laboratory.registryEnabled" .) .Values.registry.networkPolicy.enabled }}
{{- /*
The registry gate has one listener, TLS on 5443, and the policy admits three kinds of caller on that port and nothing else:
  - the lab nodes: the relay of a node-agent dials the internal load balancer, whose traffic reaches the pod with the node's address (the Cilium
    entities "host" and "remote-node");
  - the operator (device reset, retention, the sweep) and the management agent (snapshot export, PrewarmImages), by pod label.
No plain port, no namespace of the platform and nothing from the platform pool: the platform never writes to the registry. Every caller shows a
ServiceAccount token the gate checks (TokenReview), so the network rule is the second lock, not the first. Egress is open: the gate calls the
API server and the upstream registries.
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: laboratory-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "laboratory.registrySelector" . | nindent 6 }}
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            control-plane: controller-manager
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
{{- if .Values.agent.enabled }}
    # The management agent: snapshot export, and PrewarmImages.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Values.agent.namespace }}
            app: laboratory-agent
      toPorts:
        - ports:
            - port: "5443"
              protocol: TCP
{{- end }}
{{- end }}
