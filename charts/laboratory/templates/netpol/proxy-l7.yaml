{{/*
NetworkPolicy + CiliumNetworkPolicy for the proxy-l7 Deployment (singleton,
namespace .Values.proxy.namespace (default "laboratory-proxy"), pod label app: laboratory-proxy-l7 —
see charts/laboratory/templates/proxy/deployment.yaml and
internal/names/labels.go:ProxyL7App). The pod runs the l7 container only
(:8443/TCP, terminates TLS + access-gated device proxying); the WireGuard demux
has its own pod and policy (netpol/wg-demux.yaml).

Ingress:
  - l7 (TCP): admitted from Cilium's own Envoy proxy acting as the
    Gateway/TLSRoute data-path, via the `ingress` reserved entity
    (CiliumNetworkPolicy only — live-cluster check with `cilium-dbg identity
    list` confirms `reserved:ingress` = identity 8 whenever
    gatewayAPI/l7Proxy is enabled). A podSelector/namespaceSelector peer for
    kube-system (k8s-app=cilium or cilium-envoy) CANNOT work for a vanilla
    NetworkPolicy here: Cilium's dedicated cilium-envoy DaemonSet pods run
    hostNetwork: true and are verifiably NOT tracked as CiliumEndpoints
    (`kubectl get ciliumendpoint -n kube-system` never lists them), so no
    podSelector/namespaceSelector peer can ever match their traffic — this
    was the original placeholder's bug. The vanilla NetworkPolicy below only
    keeps an ipBlock peer for .Values.operator.proxySourceCIDRs, a fallback
    for hostNetwork proxy sources on non-Cilium clusters (e.g. Kind).

Egress: kube-dns (vanilla NetworkPolicy — unrelated to Cilium identities)
plus, via the CiliumNetworkPolicy, kube-apiserver (operator watch/leases)
and endpoints in LabGroup namespaces only: l7 dials per-device Services in
namespaces the operator creates dynamically per LabGroup/Lab (see
internal/proxy/l7/handler.go's ServiceResolver). Those namespaces can't be
enumerated at chart-authoring time, but the operator stamps each one with
the stable label laboratory.cybericebox.com/group
(internal/names/labels.go:LabelGroup, applied in
labgroup_controller.go:ensureNamespace), which Cilium folds into every
endpoint identity in the namespace as
k8s:io.cilium.k8s.namespace.labels.laboratory.cybericebox.com/group
(live-verified with cilium-dbg identity get). Service ClusterIP translation
happens before policy, so matching the backend endpoint identity works for
the l7 dial. Everything else — including
other in-cluster namespaces — is denied.
*/}}
{{- if and .Values.proxy.enabled .Values.proxy.l7.enabled .Values.proxy.networkPolicy.enabled }}
{{- $l7Port := include "laboratory.l7Port" . | int }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laboratory-proxy-l7
  namespace: {{ .Values.proxy.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: laboratory-proxy-l7
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.operator.proxySourceCIDRs }}
    - from:
        {{- range splitList "," .Values.operator.proxySourceCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $l7Port }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: laboratory-proxy-l7
  namespace: {{ .Values.proxy.namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: laboratory-proxy-l7
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ $l7Port | quote }}
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.cilium.k8s.namespace.labels.laboratory.cybericebox.com/group
              operator: Exists
{{- end }}
