apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-vpn-role
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  # Direct current container identity is read for boot-fenced acknowledgements.
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ get ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroupclients ]
    verbs: [ get, list, watch, update ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroupaccesspolicies, labs ]
    verbs: [ get, list, watch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroupaccesspolicies/status ]
    verbs: [ get, patch, update ]
  # The VPN pod publishes its flow accounting as its own LabTrafficReport.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labtrafficreports ]
    verbs: [ get, create, update ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labtrafficreports/status ]
    verbs: [ get, patch, update ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgroupclients/status ]
    verbs: [ get, patch, update ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labvpns ]
    verbs: [ get, list, watch, update ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labvpns/status ]
    verbs: [ get, patch, update ]
  - apiGroups: [ allocation.cybericebox.com ]
    resources: [ pools ]
    verbs: [ get, list, watch ]

  # Events for reconciler diagnostics (kubectl describe / get events).
  - apiGroups: [ "" ]
    resources: [ events ]
    verbs: [ create, patch ]
