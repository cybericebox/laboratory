apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: laboratory-manager-rolebinding
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: laboratory-manager-role
subjects:
  - kind: ServiceAccount
    name: laboratory-controller-manager
    namespace: {{ .Release.Namespace }}
