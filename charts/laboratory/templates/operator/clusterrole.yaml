apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-manager-role
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [endpoints, namespaces, pods, secrets, serviceaccounts, services]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [allocation.cybericebox.com]
  resources: [pools]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [allocation.cybericebox.com]
  resources: [pools/status]
  verbs: [get, patch, update]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [laboratory.cybericebox.com]
  resources: [connections, devices, labgateways, labgroupclients, labgroups, labs, labvpns]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [laboratory.cybericebox.com]
  resources: [connections/finalizers, devices/finalizers, labgateways/finalizers, labgroupclients/finalizers, labgroups/finalizers, labs/finalizers, labvpns/finalizers]
  verbs: [update]
- apiGroups: [laboratory.cybericebox.com]
  resources: [connections/status, devices/status, labgateways/status, labgroupclients/status, labgroups/status, labs/status, labvpns/status]
  verbs: [get, patch, update]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [rolebindings]
  verbs: [create, delete, get, list, patch, update, watch]

# Events for reconciler diagnostics (kubectl describe / get events).
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]

# The LabGroup reconciler binds the agent ServiceAccount to laboratory-agent-role
# in each group namespace. The `bind` verb authorizes creating RoleBindings that
# reference this ClusterRole without the operator itself holding every permission
# the role grants — otherwise RBAC escalation-prevention rejects the binding and
# LabGroup provisioning fails whenever agent.enabled=true.
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  resourceNames: [laboratory-agent-role]
  verbs: [bind]
