apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "laboratory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The operator reads its settings as env vars: a changed ConfigMap rolls it.
        checksum/config: {{ include (print $.Template.BasePath "/operator/configmap.yaml") . | sha256sum }}
      labels:
        control-plane: controller-manager
        {{- include "laboratory.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: laboratory-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
        {{- if .Values.operator.leaderElection }}
            - --leader-elect
        {{- end }}
          envFrom:
            - configMapRef:
                name: laboratory-config
        {{- if .Values.devices.statePersistence.enabled }}
          env:
            - name: STATE_REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: laboratory-snapshots-registry
                  key: username
            - name: STATE_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laboratory-snapshots-registry
                  key: password
        {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
