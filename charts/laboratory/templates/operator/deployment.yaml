{{- include "laboratory.lifecycleProfile" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if include "laboratory.egressLogPVC" . }}
  # The connection log volume is ReadWriteOnce: the old operator stops before the new one starts.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "laboratory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The operator reads its settings as env vars: a changed ConfigMap rolls it.
        checksum/config: {{ include (print $.Template.BasePath "/operator/configmap.yaml") . | sha256sum }}
      labels:
        control-plane: controller-manager
        {{- include "laboratory.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: laboratory-controller-manager
      priorityClassName: {{ include "laboratory.priorityClass.platform" . }}
      securityContext:
        runAsNonRoot: true
        {{- if include "laboratory.egressLogPVC" . }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "laboratory.placement" (dict "own" .Values.operator "root" $) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "laboratory.imageRef" (dict "image" .Values.operator.image "root" $) | quote }}
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" .Values.operator.image.pullPolicy "tag" (include "laboratory.tag" (dict "image" .Values.operator.image "root" $))) }}
          command:
            - /manager
        {{- /* Leader election and the probe port :8081 are the manager's defaults. */}}
        {{- if not .Values.operator.leaderElection }}
          args:
            - --leader-elect=false
        {{- end }}
          envFrom:
            - configMapRef:
                name: laboratory-config
        {{- if .Values.devices.statePersistence.enabled }}
          env:
            - name: STATE_REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: laboratory-registry
                  key: username
            - name: STATE_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laboratory-registry
                  key: password
        {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Startup waits up to60s for CRDs and90s for admission policies before
          # the health server starts. Keep normal liveness gated during those waits.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
        {{- if include "laboratory.egressLogPVC" . }}
          volumeMounts:
            - name: egress-log
              mountPath: /var/lib/egress-log
      volumes:
        - name: egress-log
          persistentVolumeClaim:
            claimName: laboratory-egress-log
        {{- end }}
