{{- include "laboratory.lifecycleProfile" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if include "laboratory.egressLogPVC" . }}
  # The connection log volume is ReadWriteOnce: the old operator stops before the new one starts.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "laboratory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The operator reads its settings as env vars: a changed ConfigMap rolls it.
        checksum/config: {{ include (print $.Template.BasePath "/operator/configmap.yaml") . | sha256sum }}
        {{- with include "laboratory.scrapeAnnotations" (dict "metrics" .Values.operator.metrics) }}
        {{- . | nindent 8 }}
        {{- end }}
      labels:
        control-plane: controller-manager
        {{- include "laboratory.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: laboratory-controller-manager
      priorityClassName: {{ include "laboratory.priorityClass.platform" . }}
      securityContext:
        runAsNonRoot: true
        {{- if include "laboratory.egressLogPVC" . }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "laboratory.pool" (dict "pool" "labControl" "root" $) | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "laboratory.imageRef" (dict "image" .Values.operator.image "root" $) | quote }}
          imagePullPolicy: {{ include "laboratory.pullPolicy" (dict "policy" .Values.operator.image.pullPolicy "tag" (include "laboratory.tag" (dict "image" .Values.operator.image "root" $))) }}
          command:
            - /manager
        {{- /* Leader election and the probe port :8081 are the manager's defaults. */}}
        {{- if or (not .Values.operator.leaderElection) .Values.operator.metrics.enabled }}
          args:
          {{- if not .Values.operator.leaderElection }}
            - --leader-elect=false
          {{- end }}
          {{- if .Values.operator.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.operator.metrics.port }}
            - --metrics-secure=false
          {{- end }}
        {{- end }}
        {{- if .Values.operator.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
              protocol: TCP
        {{- end }}
          envFrom:
            - configMapRef:
                name: laboratory-config

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Startup waits up to60s for CRDs and90s for admission policies before
          # the health server starts. Keep normal liveness gated during those waits.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
        {{- if or (include "laboratory.egressLogPVC" .) (include "laboratory.registryEnabled" .) }}
          volumeMounts:
          {{- if include "laboratory.egressLogPVC" . }}
            - name: egress-log
              mountPath: /var/lib/egress-log
          {{- end }}
          {{- if include "laboratory.registryEnabled" . }}
            # The registry gate: its authority (public data) and the operator's own token for it (retention, device reset, the sweep).
            - name: registry-ca
              mountPath: /etc/registry-ca
              readOnly: true
            - name: registry-gate-token
              mountPath: /var/run/secrets/registry-gate
              readOnly: true
          {{- end }}
      volumes:
        {{- if include "laboratory.egressLogPVC" . }}
        - name: egress-log
          persistentVolumeClaim:
            claimName: laboratory-egress-log
        {{- end }}
        {{- if include "laboratory.registryEnabled" . }}
        - name: registry-ca
          configMap:
            name: laboratory-registry-ca
        - name: registry-gate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "laboratory.registryGateAudience" . }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- end }}
