apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-gateway-role
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labs ]
    verbs: [ get, list, watch ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgateways ]
    verbs: [ get, list, watch, update ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labgateways/status ]
    verbs: [ get, patch, update ]
  - apiGroups: [ allocation.cybericebox.com ]
    resources: [ pools ]
    verbs: [ get, list, watch ]
  # The per-minute egress report of the gateway: one object named gateway in the group namespace, written by the gateway pod, read and
  # acknowledged by the operator (nothing pulls it from the pod).
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labegressreports ]
    verbs: [ get, create, update ]
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labegressreports/status ]
    verbs: [ get, patch, update ]

  # Events for reconciler diagnostics (kubectl describe / get events).
  - apiGroups: [ "" ]
    resources: [ events ]
    verbs: [ create, patch ]
