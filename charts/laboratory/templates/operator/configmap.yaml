apiVersion: v1
kind: ConfigMap
metadata:
  name: laboratory-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
data:
  PUBLIC_VPN_ENDPOINT: {{ required "operator.publicVPNEndpoint is required" .Values.operator.publicVPNEndpoint | quote }}
  BASE_DOMAIN: {{ required "operator.baseDomain is required" .Values.operator.baseDomain | quote }}
  VPN_SERVICE_PORT: {{ .Values.operator.vpnServicePort | quote }}
  VPN_BASE_NETWORK: {{ .Values.operator.vpnBaseNetwork | quote }}
  INET_BASE_NETWORK: {{ .Values.operator.inetBaseNetwork | quote }}
  PROXY_SOURCE_CIDRS: {{ .Values.operator.proxySourceCIDRs | quote }}
  VPN_IMAGE: "{{ .Values.vpn.image.repository }}:{{ .Values.vpn.image.tag }}"
  GATEWAY_IMAGE: "{{ .Values.inetGateway.image.repository }}:{{ .Values.inetGateway.image.tag }}"
  NETCONFIG_IMAGE: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag }}"
  LAB_NODE_SELECTOR: {{ .Values.labWorkloads.nodeSelector | toJson | quote }}
  LAB_TOLERATIONS: {{ .Values.labWorkloads.tolerations | toJson | quote }}
  AGENT_ENABLED: {{ .Values.agent.enabled | quote }}
  AGENT_SERVICE_ACCOUNT: "laboratory-agent"
  AGENT_SERVICE_NAMESPACE: {{ .Values.agent.namespace | quote }}
  SUPPORT_EMAIL: {{ required "operator.supportEmail is required" .Values.operator.supportEmail | quote }}
  IMAGE_PULL_SECRETS: {{ include "laboratory.pullSecretNames" . | quote }}
  LAUNCH_ENABLED: {{ .Values.launch.enabled | quote }}
  LAUNCH_MAX_IN_FLIGHT: {{ .Values.launch.maxInFlight | quote }}
  LAUNCH_WAVE_TIMEOUT: {{ .Values.launch.waveTimeout | quote }}
  LAUNCH_HEADROOM_PERCENT: {{ .Values.launch.headroomPercent | quote }}
  LAUNCH_RESOURCE_CHECK: {{ .Values.launch.resourceCheck | quote }}
  LAUNCH_PREPULL: {{ .Values.launch.prepull.enabled | quote }}
  LAUNCH_PREPULL_TIMEOUT: {{ .Values.launch.prepull.timeout | quote }}
  DEVICE_DEFAULT_CPU: {{ .Values.launch.deviceDefaults.cpu | quote }}
  DEVICE_DEFAULT_MEMORY: {{ .Values.launch.deviceDefaults.memory | quote }}
