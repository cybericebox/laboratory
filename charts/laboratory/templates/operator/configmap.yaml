apiVersion: v1
kind: ConfigMap
metadata:
  name: laboratory-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
data:
  PUBLIC_VPN_ENDPOINT: {{ required "operator.publicVPNEndpoint is required" .Values.operator.publicVPNEndpoint | quote }}
  BASE_DOMAIN: {{ required "operator.baseDomain is required" .Values.operator.baseDomain | quote }}
  VPN_SERVICE_PORT: {{ .Values.operator.vpnServicePort | quote }}
  VPN_BASE_NETWORK: {{ .Values.operator.vpnBaseNetwork | quote }}
  INET_BASE_NETWORK: {{ .Values.operator.inetBaseNetwork | quote }}
  PROXY_SOURCE_CIDRS: {{ .Values.operator.proxySourceCIDRs | quote }}
  VPN_IMAGE: "{{ .Values.vpn.image.repository }}:{{ .Values.vpn.image.tag | default .Chart.AppVersion }}"
  VPN_CPU: {{ .Values.vpn.resources.cpu | quote }}
  VPN_MEMORY: {{ .Values.vpn.resources.memory | quote }}
  VPN_STATS_INTERVAL: {{ .Values.vpn.statsInterval | quote }}
  NETWORK_POLICY_ENABLED: {{ .Values.operator.groupNetworkPolicy.enabled | quote }}
  GATEWAY_CPU: {{ .Values.inetGateway.resources.cpu | quote }}
  GATEWAY_MEMORY: {{ .Values.inetGateway.resources.memory | quote }}
  GATEWAY_IMAGE: "{{ .Values.inetGateway.image.repository }}:{{ .Values.inetGateway.image.tag | default .Chart.AppVersion }}"
  NETCONFIG_IMAGE: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag | default .Chart.AppVersion }}"
  LAB_NODE_SELECTOR: {{ .Values.labWorkloads.nodeSelector | toJson | quote }}
  LAB_TOLERATIONS: {{ .Values.labWorkloads.tolerations | toJson | quote }}
  AGENT_ENABLED: {{ .Values.agent.enabled | quote }}
  AGENT_SERVICE_ACCOUNT: "laboratory-agent"
  AGENT_SERVICE_NAMESPACE: {{ .Values.agent.namespace | quote }}
  SUPPORT_EMAIL: {{ required "operator.supportEmail is required" .Values.operator.supportEmail | quote }}
  IMAGE_PULL_SECRETS: {{ include "laboratory.pullSecretNames" . | quote }}
  SCHEDULER_ENABLED: {{ .Values.scheduler.enabled | quote }}
  SCHEDULER_MAX_PODS: {{ .Values.scheduler.maxPods | quote }}
  SCHEDULER_STARTUP_TIMEOUT: {{ .Values.scheduler.startupTimeout | quote }}
  SCHEDULER_RESTART_THRESHOLD: {{ .Values.scheduler.restartThreshold | quote }}
  SCHEDULER_HEADROOM_PERCENT: {{ .Values.scheduler.headroomPercent | quote }}
  SCHEDULER_RESOURCE_CHECK: {{ .Values.scheduler.resourceCheck | quote }}
  SCHEDULER_PREPULL: {{ .Values.scheduler.prepull.enabled | quote }}
  SCHEDULER_PREPULL_TIMEOUT: {{ .Values.scheduler.prepull.timeout | quote }}
  TENANT_ENROLLMENT_TTL: {{ .Values.agent.enrollment.tokenTTL | quote }}
  DEVICE_DEFAULT_CPU: {{ .Values.scheduler.deviceDefaults.cpu | quote }}
  DEVICE_DEFAULT_MEMORY: {{ .Values.scheduler.deviceDefaults.memory | quote }}
  {{- with .Values.devices.statePersistence }}
  {{- if .enabled }}
  STATE_PERSISTENCE_ENABLED: "true"
  STATE_REGISTRY_ADDR: {{ include "laboratory.registryAddr" $ | quote }}
  STATE_DEBOUNCE: {{ .debounce | quote }}
  STATE_EXCLUDE_PATHS: {{ join "," .excludePaths | quote }}
  STATE_WRITE_QUOTA: {{ .writeQuota | quote }}
  STATE_MAX_FILE_SIZE: {{ .maxFileSize | quote }}
  STATE_MAX_LAYERS: {{ .maxLayers | quote }}
  STATE_RETENTION: {{ .retention | quote }}
  STATE_RETENTION_INTERVAL: {{ .retentionInterval | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.registry.cache.enabled }}
  IMAGE_CACHE_ENABLED: "true"
  IMAGE_CACHE_PIN_TTL: {{ .Values.registry.cache.pinTTL | quote }}
  IMAGE_CACHE_PREFIX: {{ printf "localhost:%v" .Values.registry.forwardPort | quote }}
  IMAGE_CACHE_REGISTRIES: {{ include "laboratory.cacheRegistryNames" . | quote }}
  {{- end }}
