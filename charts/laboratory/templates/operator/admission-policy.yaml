{{- if .Values.operator.admissionPolicy.enabled }}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail (printf "operator.admissionPolicy needs Kubernetes 1.30 or newer (ValidatingAdmissionPolicy), this cluster is %s. Without it the operator's ServiceAccount can bind its role in any namespace, so the chart will not install silently without it: upgrade the cluster, or set operator.admissionPolicy.enabled=false to accept that risk on purpose." .Capabilities.KubeVersion.Version) }}
{{- end }}
{{- /*
RBAC cannot restrict the operator to "the namespaces of its LabGroups" (they do not exist when the chart is installed), so these
policies do. They apply to the operator's ServiceAccount only. See DEPLOY.md, "Operator permissions".
*/ -}}
{{- $operator := printf "system:serviceaccount:%s:laboratory-controller-manager" .Release.Namespace }}
{{- /* CEL does not expose ownerReferences of an object, so "a namespace of a LabGroup" is the label the operator puts on it when it creates it. */ -}}
{{- $owned := "has(%s.metadata.labels) && 'laboratory.cybericebox.com/group' in %s.metadata.labels" }}
---
# Writes in a namespace: only the namespaces of LabGroups, plus the release, tenants and images namespaces for what the operator does there.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-operator-scope
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets, serviceaccounts, services, endpoints, pods]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, daemonsets]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [networkpolicies]
      - apiGroups: [policy]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [poddisruptionbudgets]
      - apiGroups: [cilium.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [ciliumnetworkpolicies]
  matchConditions:
    - name: from-the-operator
      expression: request.userInfo.username == {{ $operator | quote }}
  variables:
    - name: groupNamespace
      expression: {{ printf $owned "namespaceObject" "namespaceObject" | quote }}
    - name: platformNamespace
      expression: namespaceObject.metadata.name in [{{ .Release.Namespace | quote }}, "laboratory-tenants", "laboratory-images", "laboratory-access-keys"]
  validations:
    - expression: "variables.groupNamespace || (variables.platformNamespace && request.resource.resource != 'rolebindings')"
      message: "the operator may write here only in the namespaces of its LabGroups (RoleBindings: only there), the release namespace, the tenants, images and access keys namespaces"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-operator-scope
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  policyName: laboratory-operator-scope
  validationActions: [Deny]
---
# Namespaces: the operator creates the namespaces of its LabGroups (labelled laboratory.cybericebox.com/group) and may change or delete only those.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-operator-namespaces
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces]
  matchConditions:
    - name: from-the-operator
      expression: request.userInfo.username == {{ $operator | quote }}
  variables:
    - name: before
      expression: "request.operation == 'CREATE' ? object : oldObject"
  validations:
    - expression: {{ printf $owned "variables.before" "variables.before" | quote }}
      message: the operator may create, change and delete only the namespaces of its LabGroups
      reason: Forbidden
    - expression: {{ printf "request.operation != 'UPDATE' || (%s)" (printf $owned "object" "object") | quote }}
      message: a namespace of a LabGroup stays owned by it
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-operator-namespaces
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  policyName: laboratory-operator-namespaces
  validationActions: [Deny]
---
# The pods the operator creates (directly or through a Deployment or DaemonSet): nothing that reaches into the node.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: laboratory-operator-pods
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [deployments, daemonsets]
  matchConditions:
    - name: from-the-operator
      expression: request.userInfo.username == {{ $operator | quote }}
  variables:
    - name: podSpec
      expression: "request.resource.resource == 'pods' ? object.spec : object.spec.template.spec"
    - name: containers
      expression: "variables.podSpec.containers + (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])"
    # A running pod's spec cannot change (the operator patches its labels only), so the rules about what a pod is made of are
    # judged when it is created, and on the template of a Deployment or DaemonSet whenever that changes.
    - name: podUpdate
      expression: "request.resource.resource == 'pods' && request.operation == 'UPDATE'"
  validations:
    - expression: "!(has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) && !(has(variables.podSpec.hostPID) && variables.podSpec.hostPID) && !(has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC)"
      message: the operator may not create a pod that uses the host's network, PID or IPC namespace
      reason: Forbidden
    - expression: "!has(variables.podSpec.volumes) || !variables.podSpec.volumes.exists(v, has(v.hostPath))"
      message: the operator may not create a pod that mounts a host path
      reason: Forbidden
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)"
      message: the operator may not create a privileged container
      reason: Forbidden
    # The "never in any profile" list of the device profiles, enforced by allowing only what the operator really adds: the base
    # set, the profile additions (SYS_PTRACE, IPC_LOCK, LINUX_IMMUTABLE, NET_RAW, NET_ADMIN) and what the VPN and gateway need.
    - expression: "variables.podUpdate || variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop)"
      message: the operator may create only containers that drop ALL capabilities
      reason: Forbidden
    - expression: "variables.podUpdate || variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x in {{ include "laboratory.operatorCapabilities" . }}))"
      message: the operator may add only the capabilities of the device profiles and of the VPN and gateway pods
      reason: Forbidden
    - expression: "variables.podUpdate || (has(variables.podSpec.securityContext) && has(variables.podSpec.securityContext.seccompProfile) && variables.podSpec.securityContext.seccompProfile.type == 'RuntimeDefault')"
      message: the operator may create only pods with the RuntimeDefault seccomp profile
      reason: Forbidden
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type == 'RuntimeDefault')"
      message: a container of the operator may not choose another seccomp profile
      reason: Forbidden
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) || c.securityContext.procMount == 'Default')"
      message: the operator may not unmask /proc
      reason: Forbidden
    - expression: "variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: the operator may not publish a container on a host port
      reason: Forbidden
    - expression: "variables.podUpdate || !has(variables.podSpec.nodeName) || variables.podSpec.nodeName == ''"
      message: the operator may not place a pod on a node by name (the scheduler does)
      reason: Forbidden
    - expression: "!has(variables.podSpec.serviceAccountName) || variables.podSpec.serviceAccountName in ['', 'default', 'vpn', 'gateway']"
      message: the operator's pods may run only as the default, vpn or gateway service account of their namespace
      reason: Forbidden
    - expression: "!has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v, has(v.emptyDir) || has(v.projected) || has(v.downwardAPI) || has(v.secret) || has(v.configMap))"
      message: the operator's pods may use only emptyDir, projected, downwardAPI, secret and configMap volumes
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: laboratory-operator-pods
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
spec:
  policyName: laboratory-operator-pods
  validationActions: [Deny]
{{- end }}
