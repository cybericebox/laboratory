{{- if .Values.checks.enabled }}
{{- /* Every rule has its reason; DEPLOY.md, "Lab checks", lists them. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: laboratory-checker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-checker
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  # The labs: their checks (names and devices), the run-checks annotation, the readiness of the devices, the results. A Lab cannot be
  # selected by node, so the checker watches them all and keeps only a stub of each lab without checks.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labs ]
    verbs: [ get, list, watch ]
  # The results (status.checks) and the acknowledgement (status.checksRunAck), by server-side apply. Nothing else of a Lab is written:
  # no update of the object, no spec, no other resource.
  - apiGroups: [ laboratory.cybericebox.com ]
    resources: [ labs/status ]
    verbs: [ patch ]
  # The device pods of its own node (the informer asks the API server for spec.nodeName=<node>; RBAC cannot restrict that): readiness.
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ get, list, watch ]
  # Secrets are NOT readable cluster-wide: the checks document of a lab (Secret <lab>-checks) is read through the ClusterRole
  # laboratory-checker-secrets below, which the operator binds in each lab group namespace with the namespace (a RoleBinding there).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: laboratory-checker
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: laboratory-checker
subjects:
  - kind: ServiceAccount
    name: laboratory-checker
    namespace: {{ .Release.Namespace }}
---
# What the checker may read in a lab group namespace: one GET of the Secret <lab>-checks when the lab has a pod on the node and again when it
# was rewritten. get only: no list, no watch. The ClusterRole grants nothing by itself: it is bound by RoleBindings the operator makes in the
# group namespaces, which hold only lab-level Secrets (the checks, the device environment, the VPN keys, the tenant pull secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-checker-secrets
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "" ]
    resources: [ secrets ]
    verbs: [ get ]
---
# The keepalive: one Lease per node in the release namespace. create cannot be limited to a name; the admission policy below does that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laboratory-checker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
rules:
  - apiGroups: [ coordination.k8s.io ]
    resources: [ leases ]
    verbs: [ get, create, update, patch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: laboratory-checker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laboratory-checker
subjects:
  - kind: ServiceAccount
    name: laboratory-checker
    namespace: {{ .Release.Namespace }}
{{- end }}
