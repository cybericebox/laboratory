{{- if .Values.priorityClasses.create }}
{{- /* See values.yaml, "Priority classes". The device class never preempts: a device must not evict anything. */ -}}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.platform.name }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.platform.value }}
globalDefault: false
description: "Laboratory platform pods (operator, agent, L7 proxy, wg-demux, registry): above every lab pod."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.group.name }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.group.value }}
globalDefault: false
description: "VPN and gateway pods of a LabGroup: above the devices."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.device.name }}
  labels:
    {{- include "laboratory.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.device.value }}
globalDefault: false
preemptionPolicy: Never
description: "Device pods of a lab: the lowest, and they never evict anything."
{{- end }}
