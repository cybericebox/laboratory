kubeVersion: ">=1.33.0-0"
version: 1.1.0
appVersion: "v1.1.0"
keywords:
  - cybericebox
  - laboratory
  - ctf
  - wireguard
  - ovs
sources:
  - https://github.com/cybericebox/laboratory

