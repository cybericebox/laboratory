# Image tags: ONE release tag drives every image of the chart (operator, agent, proxy, node-agent, VPN and gateway). It is image.tag, and
# empty means the chart appVersion (the release version), so a normal install sets nothing. A `<component>.image.tag` set explicitly pins that
# one image to another build (an exact tag: a release version or a short git sha). The chart refuses `latest` and an empty tag with an empty
# appVersion: a moving tag leaves nodes on different images. The platform registry (registry.image) is a third-party image with its own tag.
image:
  tag: ""

# Everything below has a default that suits any installation; the only values a chart user has to give are operator.baseDomain,
# operator.publicVPNEndpoint, operator.supportEmail and, with an ACME issuer, certManager.email. Constants of the platform (the WireGuard
# port 51820 inside the VPN pods, the ports of the proxy containers, the node-agent probe port, the registry relay port 5035) are baked into the
# images and are not values. Tuning knobs (paths, names, namespaces, intervals, sizes) stay optional values with these defaults; the images
# also read them as optional environment variables, so any of them can be overridden without a rebuild.
# ============================================================
# Pools: where the components run
# ============================================================
# The cluster has pools of nodes, told apart by the label node-restriction.kubernetes.io/cib-pool (a label a node cannot set on itself, so a
# rooted node cannot move into another pool). The selectors are constants of the chart, not values: nothing can be pointed at another pool by a
# values file.
#   cib-pool=lab          the lab nodes: device, VPN and gateway pods (made by the operator), node-agent, node-state, device-access, the
#                         checker, the WireGuard demux and the L7 proxy.
#   cib-pool=lab-control  the control of the laboratory: the operator, the management agent, the lab scheduler and the registry (zot and its gate).
# Infrastructure labels the nodes before this chart is installed; a pod whose pool has no node stays Pending.
# Only the taints of the pools are values: the tolerations the pods of a pool carry.
pools:
  lab:
    tolerations: []
  labControl:
    tolerations: []

# ============================================================
# Operator configuration
# ============================================================
operator:
  # terminationGracePeriodSeconds of every pod of a lab (devices, VPN, gateway). They keep nothing a SIGTERM would flush, so a
  # deleted lab must not wait the Kubernetes default of 30 s. 0 = that default.
  labPodTerminationGraceSeconds: 5
  image:
    repository: cybericebox/laboratory-controller
    tag: ""
    pullPolicy: ""   # empty = IfNotPresent (the tag is always an exact version)

  # REQUIRED (no default): the address advertised to WireGuard clients (demux public address), also reported by the agent: a host, or
  # host:port. Without a port, proxy.wg.publicPort is used (51820 by default). With one, it is advertised as it is: that is for a
  # front (a cloud load balancer, a firewall) that maps the public port to proxy.wg.publicPort.
  # Examples: "vpn.example.com" or "vpn.example.com:443"
  publicVPNEndpoint: ""

  # REQUIRED: cluster ingress base domain for device exposure URLs (also the proxy's and the agent's
  # BASE_DOMAIN and the session cookie domain). Example: "lab.example.com"
  baseDomain: ""

  # The one address space of the lab networks. /24 number 0 (10.128.0.0/24) is the VPN clients; every other /24 goes to a gateway of a lab,
  # VPN entry or Internet exit alike, first free number (a gateway takes 10.128.N.0/24, N >= 1). The WireGuard clients get the whole
  # network as AllowedIPs. A /8 to /18 network; the pool of a group is as big as the network (a /9 holds 32767 gateway networks).
  labBaseNetwork: "10.128.0.0/9"

  # The most gateways one lab may have, VPN entries and Internet exits together.
  # A lab with more is refused when it is created. The backend and the catalog hold the rule 10 for task authors and do not ask.
  maxLabGateways: 10

  # How many objects of a kind the operator reconciles at the same time (1 to 64). One object is never worked on twice at once, so
  # raising a number only lets different labs, devices and connections go in parallel (the launch of a burst of labs). The
  # LabGroup controller always has one worker. Each worker that is busy uses the API client of the operator (operator.apiQps), so
  # watch the API server latency when raising them.
  workers:
    lab: 8
    device: 16
    connection: 8

  # Client-side rate limit of the operator's Kubernetes API client (requests per second, and the burst on top of it). All the workers
  # above and the scheduler share it. The API server and etcd are shared with the node agents, so raise it with their latency in view.
  api:
    qps: 200
    burst: 400

  # Comma-separated CIDRs of proxy source IPs for hostNetwork proxy (e.g. Kind).
  # Leave empty in standard clusters.
  proxySourceCIDRs: ""

  # REQUIRED: contact address shown to participants on the VPN probe page.
  # The operator passes it to every per-LabGroup VPN pod.
  supportEmail: ""

  leaderElection: true

  # The operator's Prometheus endpoint (/metrics, plain HTTP): controller-runtime's work queues and reconcile times, the scheduler's queue and
  # slots, the launch stages of device pods (laboratory_*, see DEPLOY.md "Metrics"). Off by default. scrapeAnnotations adds the
  # prometheus.io/scrape, port and path annotations to the pod for a Prometheus that discovers pods by annotation (no ServiceMonitor needed).
  # The port carries no authentication: keep it inside the cluster.
  metrics:
    enabled: false
    port: 8080
    scrapeAnnotations: false

  # A starting value for the default workers (operator.workers) and API rate (operator.api): set it from the load run.
  resources:
    limits:
      cpu: "2"
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi

  networkPolicy:
    enabled: true
  # Default-deny NetworkPolicy baseline in the namespace of every LabGroup (the chart's own policy of
  # the operator pod is networkPolicy.enabled above).
  groupNetworkPolicy:
    enabled: true
  # ValidatingAdmissionPolicy that confines the operator's ServiceAccount: it may create, change and
  # delete RoleBindings, Secrets, Services, pods, Deployments and the like only in the namespaces of its LabGroups (a namespace
  # it created, labelled laboratory.cybericebox.com/group) and, for what it really needs there, the release and tenants namespaces; it may change or
  # delete only the Namespaces it created; and the pods it creates may not be privileged or use hostNetwork, hostPID, hostIPC or
  # hostPath. RBAC alone cannot say "only these namespaces" for namespaces that do not exist yet.
  admissionPolicy:
    enabled: true

# ============================================================
# Priority classes: every pod the laboratory runs carries one, so the scheduler never evicts the system for a lab
# ============================================================
# node-agent: system-node-critical (built in). operator, agent, L7 proxy, wg-demux, registry: platform. VPN and gateway
# pods of a group: group, above the devices. Device pods: device, the lowest, with preemptionPolicy Never: a device never
# evicts anything (a VPN or a gateway may evict a device, the system may evict both). The operator's admission policy
# allows its pods exactly the group and device classes. Existing group pods keep what they have (no class) until recreated.
priorityClasses:
  # false: the classes already exist (the same names), the chart does not create them.
  create: true
  platform:
    name: laboratory-platform
    value: 1000000
  group:
    name: laboratory-group
    value: 10000
  device:
    name: laboratory-device
    value: 100

# ============================================================
# Lab scheduler: a second kube-scheduler with a bin-packing profile for the pods of labs
# ============================================================
# The pods of labs (devices, VPN, gateway) are placed by a kube-scheduler profile that fills one node after another
# (NodeResourcesFit, scoringStrategy MostAllocated) instead of spreading, so no hole is left on every node that a big device
# cannot use. Nothing is repacked during a running event, so placement must avoid holes from the start. System pods keep the
# cluster's own scheduler. false: lab pods use the cluster's default scheduler.
# Device profiles (docs/specs/MICROVM.md in the platform repo). A container device runs anywhere on the lab nodes unless the profile labels
# are turned on; a microVM device always needs a node with cybericebox.com/profile-microvm=true and the implementation label.
profileLabels:
  # On: container devices (and the VPN and gateway pods) select cybericebox.com/profile-container=true. Off (default): scheduling as before,
  # so a cluster whose nodes carry no profile labels is unchanged. Turn it on only after every container node carries the label.
  enabled: false
# Activity reports (off by default). When on, the laboratory keeps, for a short time (at most 1000 events and one hour per writer), the RAW facts
# of what happened in a lab group: the internet egress of its labs (source and destination address, port, bytes, per minute), the console
# sessions (when each opened and closed), and the lab addresses the VPN clients reached (bytes per minute; needs vpn.firewall iptables). The
# management agent hands them to your own platform when it calls GetLabGroupActivity. They are data handed only to your own platform through the
# agent API; the laboratory sends nothing anywhere by itself, aggregates nothing and stores nothing longer. When off, nothing is collected and
# the call answers FailedPrecondition "activity reports disabled". The egress facts also need internetEgress.monitor.enabled. The VPN and gateway
# pods of a group keep the setting they were made with: it reaches a group's VPN pod and gateway when they are next created.
activityReports:
  enabled: false
# Optional parts of the laboratory (two independent options, both off by default). The management agent refuses a lab that carries
# the matching feature while its option is off, and reports both in GetFeatures (features.checks.enabled, features.terminal.enabled).
# checks.enabled also renders the lab checker, a DaemonSet of its own (apart from the node-agent). The terminal component is built later
# and will be started by its switch.
checks:
  # Lab checks: a lab may carry checks (built-in observations and custom ones in its devices), the RunChecks call is accepted, and the checker
  # DaemonSet (templates/checker) runs on the lab nodes. It runs the image of the node-agent (/node checker), takes no inbound
  # connection and needs no host namespace. It needs the device access service on the same node (rendered with this option too).
  # DEPLOY.md, "Lab checks", lists its rights and what it needs on the node.
  enabled: false
  # How many checks run at once on one node, in all (a run is one exec of the probe in a device, made by the device access service). At most one
  # run of a lab goes at a time on a node, whatever this is.
  maxConcurrent: 4
  # The ceiling of the time limit of one check run, in seconds: a lab with a check that asks for more is refused, the checker runs nothing
  # longer and the device access service kills a probe at it. The contract's own maximum is 600.
  maxTimeLimitSeconds: 120
  # The least time between two manual runs of one lab (RunChecks): a button pressed in a loop cannot keep the node busy.
  manualCooldown: 10s
  # How the checker reaches the devices: the device access service of the node (the same DaemonSet that serves the console, see terminal.*)
  # makes a unix socket in this node directory and the checker pod mounts the directory. The checker holds NO container runtime socket, reads NO
  # file of a container from the node and runs as a plain user with every capability dropped. socketGid and socketUid are the group and the user
  # the checker runs as: the socket is mode 0660 for that group and the service refuses a peer that is not that user (SO_PEERCRED).
  socketDir: /run/cib-checker
  socketUid: 65532
  socketGid: 65532
  # Cilium policy of the checker pod: no ingress, egress to the API server only. The chart refuses to render with the checker on and this off
  # (and with the admission policies, operator.admissionPolicy.enabled, off).
  networkPolicy:
    enabled: true
  # The checker keeps a trimmed copy of every Lab of the cluster and of the pods of its own node; the limits bound it.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
      ephemeral-storage: 16Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 64Mi
terminal:
  # Browser terminal (the console): a container device may ask for a terminal (a `terminal` entry in devices[].access) and the lab reports a
  # "terminal" access entry. Off by default. On, it renders the device access service (a DaemonSet on the lab nodes, the only component with the
  # container runtime socket, templates/deviceaccess), turns on the console route of the L7 proxy (a host of its own per
  # device, <device>-<code>t.<operator.baseDomain> (the last character of the first label is the kind of access), under the same wildcard certificate as the device web hosts) and gives the proxy the read rights it needs for it. The management agent reports it in the features, so
  # the backend can refuse or hide a console. DEPLOY.md, "Device console", lists the rights, the paths and the checks to make on a node.
  enabled: false
  # The namespace of the device access service. Its own: the pod needs the privileged Pod Security level (hostPath), and the one Role the L7
  # proxy gets there (EndpointSlices of the service) then covers nothing else. The pod holds no image pull secret (a lab-pool pod holds no registry credential).
  namespace: laboratory-device-access
  # A console is opened with a grant the platform signs for the one device host (see proxy.l7.grantMaxTTL); the service verifies it with the
  # tenant's access public key, which the operator mirrors into a ConfigMap of this namespace (public data). There is no secret shared by the
  # proxy and the service. grantMaxTTL is the longest exp - iat of a grant the service accepts (the agent reports the smaller of this and
  # proxy.l7.grantMaxTTL to the backend); keyReload is how often the service reads the mirrored keys again.
  grantMaxTTL: 8h
  keyReload: 15s
  # Which sites may show the console page in a frame (the platform's pages). Two lists decide and nothing is implied: an origin that matches
  # an allow entry and no deny entry (deny wins) may; empty allow = no embedding. An entry is https://host[:port] or https://*.base[:port], where *
  # is exactly one label, leftmost only. Prefer exact entries (the catalog site, the Academy site); with a wildcard, list in deny every host that
  # must not embed (the landing, the controller, the VPN host, the labs base domain). The session cookie is SameSite=Lax: in a frame it is sent
  # only when the embedding site shares the registrable domain with the labs' domain, so on another domain the console opens in a tab (DEPLOY.md).
  embedding:
    allow: []
    deny: []
  # The device access service runs the image of the node-agent (/node device-access).
  port: 8080
  metricsPort: 9102
  # The runtime socket of the node (the kubelet's containerd) and its namespace. The socket and the FIFO directory are mounted at the same
  # path as on the host: the client makes the FIFOs and the runtime's shim, on the host, opens them by that path. The service owns the
  # subdirectory cib-device-access of fifoDir and empties it at start; it never touches the FIFOs of another client of the runtime.
  # k0s: /run/k0s/containerd.sock and, by default, /run/containerd/fifo (create it on the nodes: the service does not make hostPath parents).
  containerdSocket: ""   # empty = nodeAgent.criSocket
  containerdNamespace: k8s.io
  fifoDir: /run/containerd/fifo
  # Limits (the service enforces them; the L7 proxy applies the per-client one too). 0 = unlimited.
  limits:
    # Consoles open at once: per participant (client of a group), per lab, per node.
    perClient: 3
    perLab: 10
    perNode: 200
    # A console with no byte in either direction for this long is closed; any console is closed at this age.
    idleTimeout: 30m
    maxLifetime: 8h
  # Cilium policy of the service pod: ingress only from the L7 proxy pods on the service port, no egress at all. The chart refuses to render
  # with the console on and this off (the listener is plain HTTP and trusts its caller; the policy is the whole protection of it). The
  # narrowed egress of the L7 proxy (proxy.networkPolicy) is required too.
  networkPolicy:
    enabled: true
    # Extra ingress peers for the metrics port (Cilium endpoint selectors, e.g. the monitoring namespace). Empty: nothing scrapes it.
    metricsFrom: []
  # Root without capabilities by default: the runtime socket is root:root 0660 (k0s). A non-root user works when the socket group is known:
  # set runAsUser/runAsGroup and the socket's group in supplementalGroups, and make the FIFO directory writable by that user.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups: []
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
      ephemeral-storage: 16Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 64Mi
consoleCables:
  # Console ports and console cables (docs/internal-docs/laboratory/specs/console-ports-design.md): a container device may declare console
  # ports (devices[].consolePorts: a management line with the program that runs on it) and serial ports (devices[].serialPorts: a terminal
  # line inside the device, /dev/ttyCON<n>), and a lab may join a serial port to a console port of another device with a console cable
  # (spec.consoleCables). Off by default: a lab with a port or a cable is refused (CONSOLE_CABLES_UNAVAILABLE) by the agent, the operator
  # and the API server. On, it also renders the device access service (it moves the bytes of the lines), and the management agent reports
  # it in the features (console_cables). DEPLOY.md, "Console cables".
  enabled: false
  # The port of the cable stream: the device access pod on the node of a line's console end dials the device access pod on the node of the
  # serial end, on the pod network (never the lab network), at the pod IP and this port. The stream is authenticated with an HMAC key that only
  # the device access pods hold (the Secret laboratory-console-cable-key of terminal.namespace, made once by the chart and kept across upgrades;
  # delete it and upgrade to rotate). With terminal.networkPolicy.enabled the Cilium policy admits only device access pods on this port, and
  # gives the device access pods egress to it and nothing else.
  port: 8081
  # The node directory of cable.sock: the node-agent of a node tells the device access service of the same node, over this unix socket, which
  # lines to run (mode 0660 for group socketGid, and the peer must be user socketUid of group socketGid: the node-agent, root). Both pods
  # mount it; nothing else does.
  socketDir: /run/cybericebox/console-cables
  socketUid: 0
  socketGid: 0

microvm:
  # Offer the microVM profile. Needs Kata Containers with Cloud Hypervisor on KVM nodes (infrastructure installs it and labels the nodes).
  enabled: false
  runtimeClassName: cybericebox-microvm
  # The containerd runtime handler of the implementation (Kata with Cloud Hypervisor).
  handler: kata-clh-runtime-rs
  # The node label of the implementation the RuntimeClass selects; stays inside the laboratory.
  implementationLabel: cybericebox.com/runtime-kata-clh
  # RuntimeClass overhead.podFixed: what the guest kernel, the agent and the VMM cost per pod (a first guess, set after the measurement).
  # The scheduler adds it to every microVM pod; the agent reports it, the backend adds it to a reservation.
  overhead:
    cpu: 50m
    memory: 120Mi
# The device profiles the autoscaler node groups can add a node for (container, microvm); empty = not known, so the agent reports no
# "available after scale-up" and refuses a profile that no running node can run.
scaleUpProfiles: []

labScheduler:
  enabled: true
  # The profile name the operator puts into the pods of labs (schedulerName).
  schedulerName: laboratory-binpack
  replicas: 2
  # Weight of the bin-packing score against the soft co-location preferences of device pods (the same lab, the same group).
  fitWeight: 3
  # Weight of the co-location preferences (the same lab, the same group) among the running nodes. It must stay above 3 x fitWeight, so that a
  # node with a better match wins over any difference in fullness and the fuller node only breaks a tie between equal matches (the
  # preference terms differ by a third of the normalised range at least, and the fit score is at most 100 x fitWeight).
  affinityWeight: 12
  image:
    repository: registry.k8s.io/kube-scheduler
    # Empty = the cluster's own version (a scheduler must not be newer than the API server).
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ============================================================
# VPN pod image (created at runtime by operator per LabGroup)
# ============================================================
vpn:
  # The VPN of the whole laboratory. Off: no WireGuard demultiplexer, no VPN pod in any group, and everything that needs a VPN is refused
  # with a reason: a lab with a VPN gateway, a LabGroupClient, a LabGroupAccessPolicy, and turning a group's VPN switch on
  # (spec.vpn.enabled). The refusal is made by the API server itself (admission policies rendered by this chart), by the management agent
  # (GetFeatures reports it) and, for anything that slips through, by the operator. On by default.
  enabled: true
  # How the VPN pod forwards between the participants and the labs. iptables: the relation chains with connection tracking. nft: nftables sets
  # without connection tracking for the labs that may start connections towards participants (reverseConnections of a VPN gateway); the other labs, the
  # default, are tracked, because only conntrack tells a reply from a new connection (a pair is allowed in both directions at once, statelessly, in an open lab; one lookup per packet whatever the number of pairs;
  # a revoked pair stops with its next packet; the counters of the pair's set elements are the accounting). Only the VPN pods created after the
  # change use it; a pod that exists keeps its firewall.
  firewall: iptables
  # Resources of the VPN pod of a NEW LabGroup made with no size of its own (requests = limits: a Guaranteed pod): the sizing formula
  # below at groupLimits.maxUsers (20m + 6m * 10 = 80m, 64Mi + 20Mi * 10 = 264Mi), so it also fits the maximum the agent reports. Measured on
  # the local stand: idle 1m CPU / 16Mi; with 5 active peers pulling pages in a loop up to 48m CPU and 155Mi, 195Mi with 10 peers (the memory
  # grows with the peers and their traffic, so it is the limit that matters: 264Mi leaves 35% room). On AWS (infrastructure/experiments/
  # vpn-pooling-20261007) the pods of the current sizing used 2-6m CPU and 16-24Mi with 20 connected peers under UDP/TCP load. The data path is the
  # kernel's WireGuard, the pod manages peers and firewall rules. The management agent reports vpn + gateway as the
  # service overhead of a group (GetCapacity). Existing groups keep what they were created with.
  resources:
    cpu: 80m
    memory: 264Mi
  # How the platform sizes the VPN pod of a group: base + perUser * users, at most maxUsers users (the maximum size is
  # base + perUser * maxUsers). The agent reports it in GetFeatures; the backend computes the size of a group's VPN from the
  # event's largest team (users = WireGuard peers) and passes it to CreateLabGroups; the agent refuses a size over the maximum,
  # and the operator creates the pod Guaranteed at exactly that size, never resizing it. Measured: about 16Mi idle, about 55m and
  # 195Mi with 10 active peers. `resources` above is the size of a group created without an explicit one and must not exceed the
  # maximum, which is the size at groupLimits.maxUsers users (not at sizing.maxUsers below: the agent reports the former), so
  # base + perUser * groupLimits.maxUsers must be at least `resources` (the agent refuses to start otherwise).
  sizing:
    baseCpu: 20m
    baseMemory: 64Mi
    perUserCpu: 6m
    perUserMemory: 20Mi
    maxUsers: 20
  # How often the VPN pod of a NEW group samples traffic statistics (Go duration).
  statsInterval: 30s
  image:
    repository: cybericebox/laboratory-lab
    tag: ""   # empty = the release tag (image.tag)
    # No pullPolicy key here (unlike operator/proxy/nodeAgent/agent): the operator builds this Pod spec itself
    # and the pull policy is IfNotPresent (the tag is always an exact version).
    # The operator also brings the pods of existing groups to this image, one group at a time (see DEPLOY.md, "Upgrade").

# ============================================================
# Gateway pod image (created at runtime by operator per LabGroup)
# ============================================================
inetGateway:
  # The internet access of the whole laboratory. Off: no internet gateway pod in any group, and a lab with an Internet gateway, and turning
  # a group's internet switch on (spec.gateway.enabled), are refused with a reason (API server, agent and operator, as for vpn.enabled).
  # On by default.
  enabled: true
  # What one lab may do towards the outside through the gateway (its /24): the most connections held open, the most NEW connections in a
  # second. Only a NEW connection is looked at, after the established traffic has passed; 0 = no limit. Applied to the gateway pods created
  # after the change (a pod that exists would be restarted by a change of its environment).
  limits:
    maxConnectionsPerLab: 4096
    newConnectionsPerSecondPerLab: 100
  # Resources of the internet gateway pod of a NEW LabGroup (requests = limits). The gateway is a web proxy and a DNS answerer:
  # measured on kind with each lab downloading 50 Mbit/s, uploading 2 Mbit/s and asking 50 DNS q/s: about 1m CPU per Mbit/s
  # (5 labs ~100 Mbit/s: 102m average, 149m peak; 10 labs: 113m, 208m peak, the test link was the limit), memory 60-80Mi
  # (page cache included) whatever the load, a start under 10m CPU takes ~20 s.
  resources:
    cpu: 100m
    memory: 96Mi
  # How the platform sizes the gateway pod of a group: base + perLab * labs that use the internet, at most maxLabs labs (see vpn.sizing).
  # With headroom over the measurement above: the CPU follows the traffic of the labs, the memory hardly grows.
  sizing:
    baseCpu: 20m
    baseMemory: 96Mi
    perLabCpu: 40m
    perLabMemory: 2Mi
    maxLabs: 50
  # The labs of a group reach only the public internet through its gateway. The denied internal ranges (the private
  # ranges, link-local and the cloud metadata service, loopback, CGNAT, multicast and reserved, and the IPv6
  # equivalents) are a constant of the code (internal/egress), not a setting: a lab needs no internal service and must
  # not learn where it runs. Public addresses of nodes are protected by the cloud firewall.
  # The gateway and the VPN are one image (two commands): the operator takes the gateway image from the VPN image unless this one differs.
  image:
    repository: cybericebox/laboratory-lab
    tag: ""   # empty = the release tag (image.tag)
    # No pullPolicy key here (unlike operator/proxy/nodeAgent/agent): the operator builds this Pod spec itself
    # and the pull policy is IfNotPresent (the tag is always an exact version).
    # The operator also brings the pods of existing groups to this image, one group at a time (see DEPLOY.md, "Upgrade").

# ============================================================
# The internet of the labs (docs/specs/lab-internet-egress.md)
# ============================================================
# A lab with an Internet gateway leaves through the gateway of its group, and only through services inside the gateway: its TCP 80 and 443 end
# in a transparent web proxy (the name comes from the TLS server name or the HTTP Host; the address the lab chose is never used; no TLS
# termination), every port 53 ends in a small DNS answerer, ICMP echo is the only thing forwarded (a few a second), and every other packet is
# dropped. The ceilings per lab are bandwidth.caps.labInternetMbit (download) and bandwidth.caps.labUploadKbps (upload).
internetEgress:
  dns:
    # The resolvers the gateway asks, comma separated. Public ones: the gateway reaches the public internet only, and the lab must never
    # learn names of the cluster.
    upstreams: "1.1.1.1,9.9.9.9"
    # The most DNS questions a lab may ask in a second ("" = 50).
    queriesPerSecond: ""
  proxy:
    # The most new connections per second one lab opens to one host name ("" = 5), the most all the labs of one gateway open to it together
    # ("" = 20), and the longest a connection lives in seconds ("" = 600).
    hostNewPerSecond: ""
    hostGatewayNewPerSecond: ""
    maxConnSeconds: ""
    # Replaces the built-in list of tunnel services the proxy refuses (comma separated suffixes; "-" = none; "" = the built-in list).
    tunnelSuffixes: ""
  # The most echo requests per second a lab may send out ("" = 5).
  icmpPerSecond: ""
  monitor:
    # The operator pulls the summaries every minute, writes the connection log, and flags a lab (condition EgressAttention, an Event) when
    # hostLabs different labs reach one host name within ten minutes, or the lab sits at its caps in capMinutes of the ten.
    enabled: true
    hostLabs: 20
    capMinutes: 3
  log:
    # The connection log (lab, host name, minute, connections, bytes up/down, denied) is for the cluster's administrator only: it is kept in
    # daily files on a volume of the operator, gzipped when the day is over, for retentionDays. With persistence the chart makes the volume
    # (a PersistentVolumeClaim, ReadWriteOnce, so the operator Deployment is Recreate: an upgrade stops the old operator before it starts the
    # new one) and the operator goes on where the log ends after a restart (the gateways keep the last hour). Search it with
    #   kubectl -n <ns> exec deploy/laboratory-controller-manager -- /manager egress-log --host pypi.org --lab <lab> --from 2026-11-01
    # Size: a row is ~150 bytes, one per lab and host name a minute; 100 labs that reach 10 names each fill ~150 MB a day before gzip (~15 MB
    # after), 30 days ~0.6 GB: the default has room for ten times that.
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""     # empty = the cluster's default class
    # Instead of persistence: a directory the operator already has (a volume you mount yourself). Empty without persistence: the log is then
    # in the operator's own log only (logger egress-log), kept as long as the cluster's log collection keeps it.
    dir: ""
    retentionDays: 30

# ============================================================
# Proxy: the L7 proxy (unprivileged Deployment or DaemonSet) and the WireGuard demux (its own DaemonSet, namespace laboratory-wg)
# ============================================================
proxy:
  # The master switch of the L7 proxy. Off: no L7 proxy at all, and every access that goes through it is refused with a reason: a device
  # with an http, terminal, rdp or vnc access (HTTP and HTTPS are served whenever the proxy is on). Under it, separately: terminal.enabled
  # (the console and its device access service), rdp.enabled and vnc.enabled below. The WireGuard demultiplexer does not depend on it (see
  # vpn.enabled and proxy.wg.enabled).
  enabled: true
  # RDP and VNC accesses of devices. The proxy does not serve them yet (it answers "does not exist" for those hosts, so a visitor learns
  # nothing), so both are off and a device that asks for one is refused (reason ACCESS_UNAVAILABLE). They become usable once the proxy
  # serves them; turning one on before that only admits labs whose access cannot be opened. They need the L7 proxy.
  rdp:
    enabled: false
  vnc:
    enabled: false

  # Kubernetes namespace for the L7 proxy Deployment/Service/ServiceAccount/NetworkPolicy
  # and its own dedicated Namespace object. The demux lives in the fixed namespace
  # laboratory-wg (templates/wg).
  # Must stay "laboratory-proxy": the operator's lab access key sync
  # (platform_reconciler.go) and each Lab's web-exposure NetworkPolicy peer selector
  # (lab_controller.go) use the compile-time constant internal/names.ProxyNamespace.
  # templates/validate.yaml refuses any other value.
  namespace: "laboratory-proxy"

  # Set true when running in Kind: overrides API server address to 127.0.0.1:6443.
  kindMode: false

  # Shared image for the l7 and wg-demux containers (one image, two commands).
  image:
    repository: cybericebox/laboratory-proxy
    tag: ""
    pullPolicy: ""   # empty = IfNotPresent (the tag is always an exact version)
  # How the L7 proxy runs (the demux is always a DaemonSet, see proxy.wg).
  #   replicas (default): a Deployment of `replicas` pods, NEVER two on one node (required anti-affinity by
  #     hostname). With more replicas than schedulable nodes the extra pods stay Pending, so on a one-node
  #     cluster set replicas: 1 (the install refuses replicas > nodes when it can count them).
  #   daemonset: one pod on every node of the lab pool, for larger clusters;
  #     `replicas` and the PodDisruptionBudget do not apply.
  # In both modes the proxy requests count against its node like any pod, so the scheduler's room for lab
  # pods is what is left.
  mode: replicas
  # Two replicas by default: the L7 proxy is stateless (its session cookie is signed with the shared
  # secret), and a WireGuard client that lands on the other replica after a restart re-handshakes within
  # its persistent keepalive (about 15 s). Anti-affinity (preferred, by hostname) spreads them over nodes
  # when there are several; the PodDisruptionBudget keeps one up during a drain. Measured on the local
  # stand with 1 replica: L7 about 5000 rps for 500m of CPU (0.1 ms per request), wg-demux 1m idle and about
  # 110m at ten active peers.
  replicas: 2
  # Rollout: a new pod must be Ready for minReadySeconds before the next one is replaced (both modes). surge: true lets the Deployment start
  # a new pod before it stops an old one (maxSurge 1, maxUnavailable 0), which needs a node without a replica; empty = yes when a live install
  # sees more nodes than replicas. A pod gets terminationGracePeriodSeconds to stop requests and publish settled counters after SIGTERM, after a preStop sleep of
  # preStopSleepSeconds (so the load balancer and the Service stop sending it connections first).
  minReadySeconds: 20
  surge: null
  terminationGracePeriodSeconds: 45
  preStopSleepSeconds: 5
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # L7 HTTPS proxy container: it terminates TLS itself (the certificate proxy-tls) and serves the device web hosts.
  l7:
    enabled: true
    # The entry: a NodePort Service on 443 with externalTrafficPolicy Local, so the visitor's address reaches the proxy as the TCP peer. The load
    # balancer outside the cluster (infrastructure) targets the nodes that run a proxy pod and health-checks them. nodePort: a fixed number for
    # the target group (30000-32767), empty = Kubernetes picks one. annotations: for the Service (for example the address pool of a local
    # load balancer).
    service:
      nodePort: null
      annotations: {}
    # The HTTPS listener is :8443 and the probes (/readyz: the listener is bound and the informer caches have synced; /healthz: the
    # process answers) are on :8081; the TLS files are where proxy-tls is mounted. All constants of the image.
    # A device web host is opened with a grant: a short document the platform signs for that one host with the tenant's access key. The proxy
    # verifies it with the tenant's public key (the Secrets of the namespace laboratory-access-keys) and holds no secret of its own. The page of
    # the platform posts it to /_auth of the device host, and the proxy answers with a host-only cookie that lasts as long as the grant.
    # grantMaxTTL is the longest exp - iat of a grant the proxy accepts (the agent reports it to the backend). platformOrigins are the origins
    # whose page may post a grant (https://host[:port] or https://*.base[:port]); a post from any other Origin, or with none, is refused. Set by
    # infrastructure from the platform's domain.
    grantMaxTTL: 8h
    platformOrigins: []
    # The name of the host-only cookie that carries the grant after `/_auth` (a device cannot set or clear a cookie of this name).
    grantCookieName: __Host-cib_grant
    # HTTP server limits of the L7 proxy, set before any routing or authentication so that a client that dribbles its
    # headers or body cannot hold connections forever: the request headers, the whole request, a kept-alive connection
    # with no request, and the size of the headers. No write timeout: responses stream, and an upgraded (WebSocket)
    # connection lives at most liveMaxLifetime.
    readHeaderTimeout: 10s
    readTimeout: 5m
    idleTimeout: 2m
    maxHeaderBytes: 65536
    # What a client can hold open at the proxy (0 = unlimited): maxConnections in all (a further one waits in the kernel's backlog; the
    # header timeout frees the places of clients that say nothing); the requests in flight, upgraded connections included, per client of a
    # group (livePerClient), per group (livePerGroup) and in all (liveTotal), past which a request gets 429; and the handoff path
    # (/_auth) per peer address (authRate per second, burst authBurst; all peers together may do twenty times that). The Go runtime is
    # told to stay under 80% of the container memory limit (a soft limit), so a burst is collected before the kernel would kill the pod.
    # maxConnections follows the memory limit: a connection with a request in flight costs about 105 KiB (measured, TestL7MemoryPerConnection:
    # the client's TLS connection, the HTTP server, the reverse proxy and its upstream connection), so 2500 of them are about 260 MiB, and with
    # the informer caches (about 60 MiB at several hundred groups) and 25% headroom they stay under 80% of the 512Mi limit. Past
    # maxConnections a client waits in the kernel's backlog; to serve more clients add replicas (proxy.replicas, or proxy.mode: daemonset),
    # do not raise the cap without the memory (DEPLOY.md, "Sizing the proxy"). liveTotal is not above it: a request in flight holds a connection.
    maxConnections: 2500
    livePerClient: 200
    livePerGroup: 1000
    liveTotal: 2500
    authRate: 5
    authBurst: 20
    # An open request or WebSocket is checked against the group access policy every liveCheckInterval and
    # closed once the client may no longer reach the lab (a lock, a removed client); no connection lives longer than
    # liveMaxLifetime or past the session's absolute end (LIVE_CHECK_INTERVAL, LIVE_MAX_LIFETIME).
    liveCheckInterval: 10s
    liveMaxLifetime: 12h
    # How often each replica publishes its request counters (REPORT_INTERVAL).
    reportInterval: "1m"
    # Requests = limits (Guaranteed). Memory: about 4 MiB idle plus about 105 KiB per connection with a request in flight (measured with
    # 300, 1000 and 2000 in flight on a real proxy process, TestL7MemoryPerConnection), so maxConnections of 2500 need about 270 MiB, plus the
    # caches; 512Mi leaves the headroom above. CPU: about 4600 requests per second at 500m (0.1 ms per request), while a real event peaks
    # at about 1000, so 500m has roughly five times the headroom.
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi

  # WireGuard demux: a DaemonSet in the namespace laboratory-wg.
  wg:
    enabled: true
    # How the demux moves transport packets.
    #   tc: a BPF program on the node's network device forwards them in the kernel; the handshakes stay in user space. The pod
    #     runs on the host network, as root, with the capabilities BPF, NET_ADMIN and PERFMON only (never privileged) and the host's
    #     /sys/fs/bpf; its namespace admits the privileged Pod Security level.
    #   xdp: the same, plus an XDP program (native mode, generic when the driver refuses); it refuses to start if the device already has an XDP program.
    #   userspace (default): the demux relays every packet itself; unprivileged, non-root, on the pod network, in a restricted namespace.
    #   The default is userspace: tc and xdp are opt-in, switched on only after the load test and the XDP test
    #   (DEPLOY.md, "WireGuard demux modes", also for the xdp limits, the restart behaviour and the way back: `/proxy proxy-wg detach`).
    # There is no silent fallback: a mode that cannot start makes the pod crash loop, and the operator picks userspace by this value.
    mode: userspace
    # The demux runs on every node of the lab pool. The entry is a NodePort Service with externalTrafficPolicy Local in every mode (the client's
    # address reaches the demux, and a packet lands on a node that runs a demux pod: the load balancer health-checks the nodes).
    service:
      annotations: {}
    # The wg-demux binds UDP 51820 (the VPN pods listen on 51820 too), its probes (/readyz: the UDP socket is bound, the
    # caches have synced and every group is in the demux table; /healthz: the process answers) are on :8082 and its Prometheus metrics
    # on :8083. Constants of the image.
    # publicPort is the port OUTSIDE the cluster: the UDP port the LoadBalancer Service listens on, where the clients connect (the Service
    # forwards it to 51820). It is also the port of operator.publicVPNEndpoint when that has none.
    publicPort: 51820
    # Optional fixed nodePort of the laboratory-proxy-wg Service (30000-32767),
    # e.g. behind a cloud NLB that targets a known node port. Unset: Kubernetes
    # assigns one.
    nodePort: null
    # The demux reads a public UDP port shared by every team and holds a table of sessions, so what a stranger can make it
    # hold or spend is capped. There is NO limit per source address: one NAT (a venue, a campus) hides a whole event behind one
    # address, and behind a load balancer in SNAT mode every client has a node's address. maxEntries is the conntrack entries in
    # total (two per session); a handshake that would pass it is dropped and the client retries. partialTTL is how long a
    # handshake in progress (init forwarded, no answer yet) keeps its entry: it is made before anything is authenticated, so it
    # is short (a completed session keeps its entry for 3 minutes after its last packet). All sources together may start
    # globalHandshakeRate handshakes per second (burst globalHandshakeBurst; each scans every group's key) and send missRate
    # (missBurst) packets per second that match no session or come from an unexpected address, so guessing the 32-bit session
    # index is rate-limited. roamInterval is the least time between two address changes of one session (roaming itself works as
    # before). One session may send sessionRate packets per second (burst sessionBurst): the demux is shared by every tenant and
    # one participant with a valid session must not be able to use its CPU up. readers goroutines read the socket.
    limits:
      maxEntries: 100000
      partialTTL: 15s
      globalHandshakeRate: 2000
      globalHandshakeBurst: 4000
      missRate: 2000
      missBurst: 4000
      roamInterval: 5s
      sessionRate: 15000
      sessionBurst: 30000
      readers: 4
    # Requests = limits. Memory: the conntrack table is about 190 bytes per entry (measured, TestConntrackMemoryAtTheCap): 100000 entries,
    # the cap, are about 18 MiB live and about twice that while the map grows, plus the Go runtime and the group table; 128Mi keeps
    # that under the 80% soft limit with headroom. CPU: 1m idle and up to 111m at ten active peers (the packets are relayed in
    # userspace, so the CPU follows the VPN traffic).
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 250m
        memory: 128Mi

  networkPolicy:
    enabled: true

# ============================================================
# cert-manager integration (issues TLS cert for proxy)
# ============================================================
certManager:
  # Set true to install cert-manager as a Helm subchart dependency.
  # Set false if cert-manager is already installed in the cluster.
  # NOTE: currently has no effect either way — Chart.yaml does not declare cert-manager
  # under `dependencies:` (only Chart.lock and the vendored
  # charts/cert-manager-v1.20.2.tgz reference it), so the subchart never renders
  # regardless of this value (verified: `helm template` produces zero
  # laboratory/charts/cert-manager/* resources for both true and false). Until that
  # dependencies entry is added, install cert-manager separately and leave this false.
  install: false

  # Set true to create ClusterIssuer and Certificate resources.
  enabled: true

  # REQUIRED when enabled: email for ACME account registration.
  email: ""

  # Set true to use cert-manager SelfSigned issuer (local dev, no public domain needed).
  # Set false to use ACME (Let's Encrypt) — requires a real public domain and email.
  selfSigned: true

  # Use Let's Encrypt staging (recommended for testing).
  # Set false for production certificates.
  staging: true

  # The ACME directory of the issuer. Empty: the preset below chosen by `staging`. Set it for another
  # ACME CA (or a test one); the presets are Let's Encrypt.
  acme:
    server: ""
    presets:
      production: https://acme-v02.api.letsencrypt.org/directory
      staging: https://acme-staging-v02.api.letsencrypt.org/directory

  # Name of the ClusterIssuer to create.
  issuerName: "letsencrypt"

  # ACME DNS-01 through Cloudflare. The proxy certificate is a wildcard
  # (*.baseDomain), and Let's Encrypt issues wildcards only via DNS-01, so a
  # non-selfSigned issuer needs this. The Secret lives in cert-manager's cluster
  # resource namespace (usually cert-manager) and holds an API token with
  # Zone:DNS:Edit on the zone of baseDomain.
  dns01:
    cloudflare:
      apiTokenSecretRef:
        name: ""
        key: api-token

# ============================================================
# Node-agent DaemonSet configuration
# ============================================================
nodeAgent:
  enabled: true

  # The node-agent's Prometheus endpoint (/metrics, plain HTTP): the wiring of device pods (SetupNetworks and per interface times, the wait
  # for and hold of the node's wiring lock) and the prepull image times. Off by default. The node-agent is on the host network, so the port
  # is open on the node's address: enable it only where the node firewall or the network keeps it to the Prometheus.
  # scrapeAnnotations adds the prometheus.io/* annotations to the pod.
  metrics:
    enabled: false
    port: 9442
    scrapeAnnotations: false

  # Probes of the node-agent: /readyz (Open vSwitch answers, the caches have synced) and /healthz (Open vSwitch answers) on the loopback of the node
  # (it is on the host network) at healthPort; a DaemonSet rollout waits minReadySeconds after a node-agent is Ready before it moves to the next
  # node (a restart drops the node's flows until they are programmed again).
  healthPort: 9440
  minReadySeconds: 20

  # The init container wraps the node's real CNI config (Cilium) with cni-gate and waits for it as long as it takes: on a fresh
  # node the CNI can need minutes (image pull, agent start), and a pod must never get a network from anything else.
  # Explicit opt-in: a Go duration (e.g. "10m") after which, with no base config, a built-in ptp + host-local 10.244.0.0/16
  # config is written. It is for a cluster with no other CNI; it can collide with the pod CIDR. Empty = never.
  cniFallbackTimeout: ""

  # Storm control of the shared switch: the most (kbit/s) the veth port of a device may send into the bridge, so that a flood or a loop
  # inside one lab (a device with NET_ADMIN can bridge its own interfaces) is held to this rate instead of the datapath of the node.
  # 0 = off. Applied to the ports of running devices at the next resync, and to new ones when they are made.
  portPolicingKbps: 500000
  # How often the node-agent asks OVS (the database and OpenFlow channels) for a sign of life; after this many misses in a row it exits
  # and the kubelet restarts it, which programs the bridge again (the channels do not reconnect by themselves).
  ovsWatchInterval: 15s
  ovsWatchFailures: 3

  image:
    repository: cybericebox/laboratory-node
    tag: ""
    pullPolicy: ""   # empty = IfNotPresent (the tag is always an exact version)

  # The node is bare: Open vSwitch runs inside this DaemonSet (the "ovs" sidecar),
  # and the host-prep init container loads the kernel modules and sets the sysctls
  # below. Nothing but the kernel (with these modules) and k0s is installed on the host.
  # The host paths (/run/openvswitch for the OVS runtime, /var/lib/cybericebox/openvswitch for conf.db, /run/cybericebox for the
  # node-agent socket), the bridge name br-ovs and the kubelet's device-plugins directory are constants of the image and the chart.

  hostPrep:
    # Loaded with modprobe from the host's /lib/modules (mounted read-only). A module
    # that cannot be loaded fails the init container, and the pod stays in Init:Error.
    modules:
      - openvswitch   # L2 datapath of the lab network
      - geneve        # tunnel between nodes (OVS geneve port)
      - wireguard     # VPN pods create wg interfaces in the host kernel
      - br_netfilter  # needed by the bridge-nf-call-iptables sysctl
      - nf_conntrack
      - nf_conntrack_netlink  # flow accounting in the VPN pod (ctnetlink)
    # Written to /proc/sys in the host network namespace (the pod is hostNetwork).
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.bridge.bridge-nf-call-iptables: "1"
      # No gre0/gretap0/erspan0 fallback tunnel devices in any netns (pods would show them when ip_gre is loaded on the node).
      net.core.fb_tunnels_only_for_init_net: "2"
    # Switch on conntrack byte accounting and flow timestamps (net.netfilter.nf_conntrack_acct / _timestamp and the nf_conntrack
    # module parameters acct / tstamp that every new pod namespace inherits). Without them the VPN flow report counts attempts and
    # replies but its bytes stay zero. Only this privileged init container can write them: the node-agent container has a
    # read-only /proc/sys, and no pod sysctl is used. A node image that already sets them (node_prep) makes this a no-op.
    conntrackAccounting: true
  # Where the node-agent keeps its sockets and Open vSwitch state on the host, and the bridge it programs.
  # ovsSocket must stay inside ovsRunHostPath: templates/validate.yaml refuses anything else.
  ovsSocket: "/run/openvswitch/db.sock"
  # hostPath of the OVS runtime dir (db socket, pid and control files).
  ovsRunHostPath: "/run/openvswitch"
  # hostPath of /etc/openvswitch: conf.db (bridges, ports) survives pod restarts.
  ovsDBHostPath: "/var/lib/cybericebox/openvswitch"
  grpcSocket: "/run/cybericebox/node-agent.sock"
  # Name of the OVS bridge the node-agent programs.
  ovsBridge: br-ovs
  # The container runtime's socket on the host: the one path that depends on the Kubernetes distribution (k0s here).
  criSocket: "/run/k0s/containerd.sock"
  # The node-agent is the kubelet device plugin of the extended resource cybericebox.com/tun: a device pod with the
  # `extended` profile requests it and the kubelet passes /dev/net/tun (the host needs the tun module). dir is the kubelet's
  # device-plugins directory (/var/lib/kubelet/device-plugins: the kubelet hardcodes it, also on k0s, whatever its root-dir is); tunSlots is
  # how many such devices a node advertises, which bounds the extended devices per node.
  devicePlugin:
    dir: /var/lib/kubelet/device-plugins
    tunSlots: 1000

  # Requests and limits of the node-agent pod, so that one runaway process cannot starve the node (the pod is privileged
  # and the cluster's other pods share the node). Three groups: the node-agent container, the OVS sidecar, and the short init
  # containers (host-prep and the CNI installers). The snapshot engine is not here: it runs in the node-state DaemonSet (nodeState).
  # These are starting values: measure on your nodes and adjust.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  ovsResources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

# ============================================================
# node-state DaemonSet: the snapshot engine and the CPU throttle monitor
# ============================================================
# Rendered only while devices.statePersistence.enabled or lifecycle.runtimeObservation.enabled is on (and nodeAgent.enabled). It runs
# the image of the node-agent (/node node-state) on the same nodes, apart from it: the node-agent wires the network of every new pod and
# keeps only what that needs, while the privileges of the snapshot engine (appArmorProfile Unconfined, DAC_READ_SEARCH, the containerd
# root, the host cgroup tree) live here. It pushes snapshots only through the relay of the node-agent, over a unix socket; it holds no registry credential.
# What it runs: the CPU throttle monitor (whenever it is rendered) and, with devices.statePersistence.enabled, the snapshot engine and
# the check of the node for it (the Node annotation cybericebox.com/state-persistence). The runtime observer stays in the node-agent.
nodeState:
  # /readyz (the caches have synced) and /healthz on the loopback of the node (it is on the host network, like the node-agent).
  healthPort: 9441
  # Requests and limits of the pod (the snapshot engine keeps the path map of a layer merge in memory). Starting values: measure and adjust.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ============================================================
# Platform registry (zot): device snapshots and the image cache
# ============================================================
# One zot in the release namespace, behind a gate, serves two optional features, each with its own switch: devices.statePersistence (snapshots of
# device state) and registry.cache (a pull-through cache of the lab images, mandatory with lab nodes: a lab node has no registry credential and pulls
# only through the gate). zot is installed ONLY when one of them is on (it needs nodeAgent.enabled). With both off there is no zot, no registry
# Secret or policy and no relay on the nodes. The volume claim is kept (helm.sh/resource-policy: keep), so a feature switched off and on again
# finds its data. The platform never writes to the registry: it asks the management agent to prewarm the cache.
registry:
  # Runs on the lab-control pool. The volume is ReadWriteOnce: once bound (WaitForFirstConsumer) it stays on that node, so moving the registry to
  # other nodes of the pool leaves the pod Pending until the snapshots are moved to a new volume there, or pin it to the node that holds the volume.
  image:
    # The full image: the image cache needs its sync extension. Multi-arch
    # (linux/amd64 and linux/arm64); about 70 MB compressed.
    repository: ghcr.io/project-zot/zot
    tag: "v2.1.21"
    pullPolicy: ""   # empty = IfNotPresent (the tag is always an exact version)
  # The gate: a container of the registry pod in front of zot (see DEPLOY.md, "The registry gate"). Every request to the registry passes it; zot
  # listens on the loopback of the pod only. Same image as the node-agent (/node registry-gate). Requests and limits are starting values.
  gate:
    # host:port the lab nodes dial to reach the gate: the internal load balancer of infrastructure that targets the Service laboratory-registry (a
    # NodePort, TLS port 5443). Required with the node-agent: a node has no cluster DNS. It becomes a name (or an IP address) of the gate's
    # certificate, so set it before the first install, or delete the Secret laboratory-registry-tls to have the certificate made again.
    address: ""
    service:
      # The node port the target group of the internal load balancer points at (30000-32767); empty = Kubernetes picks one, and infrastructure
      # follows the Service. annotations: for the Service.
      nodePort: null
      annotations: {}
    # How a caller is known. The gate checks the ServiceAccount token every request carries (TokenReview) and remembers the answer for tokenCacheTTL
    # at most. bindSource: the peer address of a node's token must be one of the node's addresses, so a token read from one node cannot be used from
    # another (needs the client address to survive the load balancer).
    tokenCacheTTL: 5m
    bindSource: true
    # What a pull may do after its pod is gone, and how long a manifest's grant on the layers lives: a layer download of a device being reset on the
    # same node does not fail in the middle; apiStaleMax: how long the gate decides from its caches while the API server is unreachable (after it, 503).
    pullGrace: 2m
    grantMaxAge: 1h
    apiStaleMax: 15m
    # The most images the management agent's prewarm makes the gate fetch at once.
    agentMaxFills: 8
    # Bounds on what one caller can make the gate hold or open (defaults are the gate's own; raise them only for a measured need).
    # manifestHoldBytes: memory for manifests held while their layers are checked; manifestMaxBytes: one manifest; grantsPerNode and
    # grantMaxDigests: the layer grants one node holds and the digests one grant carries; tokenReviewConcurrency: TokenReview calls in flight;
    # uploadsPerDevice and uploadsPerNode: open snapshot uploads. The pushes of an exiting device are devices.statePersistence.exit*.
    limits:
      manifestHoldBytes: 67108864
      manifestMaxBytes: 4194304
      grantsPerNode: 2000
      grantMaxDigests: 512
      tokenReviewConcurrency: 8
      uploadsPerDevice: 4
      uploadsPerNode: 64
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # StorageClass of the registry volume; empty = the cluster default. The volume holds every device snapshot, so its
  # PersistentVolume must survive the claim: use a class with reclaimPolicy Retain (retainClass below creates one).
  # With a class whose reclaimPolicy is Delete, a deleted claim or namespace deletes all snapshots.
  storageClass: ""
  # A StorageClass with reclaimPolicy Retain made by the chart, used for the registry volume instead of storageClass.
  # Needs the provisioner of the cluster's storage: rancher.io/local-path (k0s stand; local-path-provisioner 0.0.24+),
  # ebs.csi.aws.com (AWS, with parameters type: gp3). A class cannot be changed in place: the name must be new, and a
  # volume that already exists keeps the reclaim policy it was made with (see DEPLOY.md, "Registry volume").
  retainClass:
    create: false
    name: laboratory-registry
    provisioner: ""
    parameters: {}
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: false
  # Size of the registry volume. It holds the cached images, the base image layers once
  # and every device's snapshot layers: plan for the images of the labs plus
  # (devices x writeQuota) at worst. The volume is kept on uninstall.
  size: 20Gi
  # Garbage collection of blobs no manifest references any more.
  gc:
    interval: 1h
    delay: 1h
  # zot: a starting value, measure under load (garbage collection and the image sync use memory).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  networkPolicy:
    enabled: true
  # Node-side access: the node-agent relays 127.0.0.1:5035 on each node to the gate at registry.gate.address (TLS, the node's own ServiceAccount token),
  # and images are referenced as localhost:5035/c/<tenant>/<registry>/<repo>...
  # containerd treats localhost registries as plain HTTP, so the nodes need no
  # configuration. The port 5035 must be free on the node; it is a constant of the images.

  # The registries lab images may come from, whatever the cache does (cache on or off): an image from any other registry is refused at
  # three places: the management agent (CreateLabs and PrewarmImages: PermissionDenied with the reason REGISTRY_NOT_ALLOWED; GetFeatures
  # reports the list), the operator (a Lab made by hand is Failed with a ValidationFailed event) and the API server (the policy
  # laboratory-operator-pods denies a pod of a lab namespace whose image is from another registry; the node's own forwarder
  # localhost:5035 passes, it is the gate). Entries are registry hosts ("docker.io", "registry.example.com:5000");
  # an image that names no registry is docker.io. The registries of the platform's own images (vpn.image, inetGateway.image,
  # nodeAgent.image) are added by the chart, so the list can never lock the platform out. "*" (alone or among others) allows every registry.
  # The default is the four registries the cache knows, so a lab with an image from another registry (gcr.io, mcr.microsoft.com, a
  # private one) is refused until its registry is added here.
  allowedRegistries:
    - docker.io
    - ghcr.io
    - quay.io
    - registry.k8s.io

  # Pull-through cache of the lab images. The operator rewrites REG/repo:tag of the
  # devices, VPN and gateway pods of labs created while the cache is on into
  # localhost:5035/REG/repo:tag; zot fetches each image from REG on the first
  # pull (on-demand sync) and serves it from its volume afterwards. The mode is fixed
  # on each lab at creation; flipping the switch never changes existing labs. With the cache on every image of a lab goes
  # through it: an image of a registry that is not listed below, or that does not parse, is refused, never pulled directly, so every
  # registry of allowedRegistries must be listed below (the chart refuses an install where one is not).
  cache:
    # On by default and not optional with lab nodes (nodeAgent.enabled): a lab node has no registry credential, so every image of a lab is
    # pulled through the gate and nowhere else; the chart refuses nodeAgent.enabled with this off.
    enabled: true
    # A cached image nobody pulled for this long is deleted (zot retention, then GC); an
    # image in use is never deleted. It is simply fetched again on the next pull.
    unusedTTL: 48h
    # Image tags are pinned to digests when a lab is created with the cache on: the
    # operator asks the upstream registry (with the pull secrets, not through the cache)
    # for each tag once and the lab's pods pull REG/repo@sha256:..., so a lab, and the
    # labs created in the same wave, run one image even if an upstream tag moves. A
    # resolved digest is remembered for pinTTL; an image that cannot be resolved is
    # pulled by its tag and named in Lab.status.imageWarning (with requireDigest, the lab fails instead).
    pinTTL: 30m
    # How many tags are resolved at the same time (1 to 64). The resolving runs in the background: a new lab waits for its
    # digests without holding an operator worker, and one tag is resolved once however many labs ask for it.
    pinConcurrency: 8
    # Upstream registries to cache. docker.io, ghcr.io, quay.io and registry.k8s.io are
    # built in; others go into extraRegistries.
    registries:
      - docker.io
      - ghcr.io
      - quay.io
      - registry.k8s.io
    # Additional upstream registries: - name: registry.example.com
    #                                   url: https://registry.example.com
    #                                   authHosts: [auth.example.com]   # optional: token services besides the registry's own host (https only)
    extraRegistries: []
    # Where a registry may redirect its MANIFEST requests to: a map of a registry (built in or in extraRegistries) to a list of host patterns,
    # an exact host or "*." and a domain for its subdomains only ("*.pkg.dev"; never a bare "*", an IP address or a public suffix such as
    # "*.com": the gate refuses to load such a list). registry.k8s.io answers every manifest with a 307 to a regional Google Artifact
    # Registry host, so it cannot be used without this. The gate follows a redirect (at most 3, each one checked again) only over https, on the
    # default port, with no userinfo, to a listed host, and never sends the pull's credentials to it; the final answer is judged as a direct one.
    # Any other redirect stays inconclusive (the pull fails with IMAGE_REGISTRY_UNAVAILABLE), as does every redirect of a registry not listed
    # here. A registry's list set here replaces its default; set a registry to [] (or null) to follow none. A registry the cache does not serve is ignored if built in, an error otherwise.
    redirects:
      registry.k8s.io:
        - "*.pkg.dev"
    # An entry may also carry authHosts: [host, ...], the hosts besides the registry's own whose token endpoint its challenge may name (the gate
    # sends credentials only to the registry's host and to these; docker.io has auth.docker.io built in).
    # The credentials for an upstream registry are the tenant's (tenants.<name>.images.pullSecret), the lab's own (the registry credentials of
    # a variant call) and the platform's (imagePullSecrets). They sit in the namespace laboratory-upstream, which only the gate reads: no pod of
    # a lab and no node holds one, and an image address names the tenant (localhost:5035/c/<tenant>/...), so the gate proves a pull with that
    # tenant's credentials (see DEPLOY.md, "The registry gate").
    # How long a verified pull is served while the upstream registry is unreachable (a Go duration). Longer, and a pull of a tenant already
    # verified fails with IMAGE_REGISTRY_UNAVAILABLE; a tenant that was never verified for those credentials always fails then. An image
    # that was public stays served from the cache for the whole outage.
    staleIfError: 10m
    # How long a fresh check (a token and a HEAD against the upstream registry with the pull's credentials) is reused for a tenant already
    # verified; after it the next pull is served and checked again in the background. A refusal is repeated without asking for deniedFor.
    decisionMaxAge: 2m
    deniedFor: 30s
    # On (the default): the gate refuses a manifest requested by tag (403, CIB_UNPINNED) and the operator treats a tag it cannot resolve to a
    # digest as a failure to create the lab (it names the image) instead of a warning. A tag is resolved by the operator at creation of
    # the lab, so a lab whose image reference already carries @sha256 needs no lookup at all. Off: an unresolvable tag is pulled by tag
    # and named in Lab.status.imageWarning.
    requireDigest: true
    # Percent of the registry volume in use above which a miss is streamed through to the pod and not stored (hits still serve).
    diskHighWater: 90
    # Optional login for rate-limit relief (for example Docker Hub): the NAME of a Secret of the release namespace of type
    # kubernetes.io/dockerconfigjson. The gate uses it ONLY to fill an image it proved readable without credentials; never for a tenant's
    # private image, never to prove anything. Empty: anonymous fills.
    anonymousFill: ""
    # Cache prewarm: the management agent's PrewarmImages RPC makes the cache fetch images
    # ahead of an event. Needs agent.enabled. See DEPLOY.md, "Cache prewarm".
    prewarm:
      # Images fetched at once.
      concurrency: 4
      # Longest time for one image.
      timeout: 10m

# ============================================================
# Devices: optional state persistence
# ============================================================
devices:
  # Hardening of the device pods (the participant is root inside). Device security profiles are a fixed catalog in the
  # code (internal/profiles): `standard` (the default; web, API, databases, SSH, privilege escalation, cracking,
  # forensics, gdb, strace, ping) and `extended` (standard plus NET_RAW, NET_ADMIN and /dev/net/tun: raw scans,
  # sniffing, spoofing, routers, VPNs). The capability sets are not a setting. Here you only say which catalog profiles
  # this cluster offers: the agent reports them to the backend and refuses a lab that asks for another. Every capability is dropped, then the base set and the profile's
  # are added back; device pods never get the service account token and run with the runtime's default seccomp profile.
  security:
    profiles:
      - standard
      - extended
    # Run device pods in a user namespace (hostUsers: false): root in a device is not root on the node. Needs Kubernetes
    # 1.33+ (the chart needs 1.35), a runtime with support (containerd 2.x) and kernel 6.3+. A hidden setting, not shown in any UI.
    userNamespaces: true
    # Limit of the writable layer, logs and emptyDirs of a device, so one device cannot fill the node's disk
    # (DiskPressure evicts other pods). "0" = no limit.
    ephemeralStorage: 2Gi
  # Device state persistence: the writable layer of a device container survives an
  # UNPLANNED container restart (crash, OOM, reschedule). The node-agent snapshots
  # it into the platform registry above (zot); the operator recreates the device
  # from the latest snapshot. What is kept: files only. Memory, processes and live
  # netfilter/route state are lost, as in a VM reboot; seconds of work are lost when
  # a node dies. See DEPLOY.md, "Device state persistence".
  #
  # This switch only ALLOWS persistence. Each device chooses with persistence.enabled
  # in its topology: such a device runs as a bare Pod managed by the operator, every
  # other device as a Deployment (one lab may mix both). The choice is made when the
  # Device is created and never changes, whatever this switch does later.
  # false: no device can ask for persistence.
  statePersistence:
    # On, the node-state DaemonSet (nodeState) is rendered and runs the snapshot engine, with appArmorProfile Unconfined: the runtime's
    # default AppArmor profile (cri-containerd.apparmor.d on Ubuntu and other AppArmor nodes) has `deny mount`, and the snapshot filter
    # mounts read-only overlay views of a device's layers, so under it every snapshot fails with "permission denied". It also has SYS_ADMIN
    # and DAC_READ_SEARCH; the node-agent has neither Unconfined nor DAC_READ_SEARCH. A node-state that still finds itself under that
    # profile says so in its log and on every device it follows. Needs the platform registry (the engine pushes through the node-agent's relay).
    # Residual risk: with this on, the node-state ServiceAccount may `get` Secrets in every namespace (the pull Secrets of a device pod
    # live in lab namespaces the operator creates later, so RBAC cannot name them; the code reads only those of a pod of its own node).
    # If a node-state pod were taken over, it could read any Secret whose name it knows, also on other nodes and of other tenants. The
    # rule exists only with this switch on, and is to be replaced by credentials the operator delivers.
    enabled: false

    # How long a device's writable layer must stay quiet before a snapshot is taken.
    debounce: 5s
    # Paths inside the container that are never snapshotted. Configurable only here, in
    # the chart: a topology cannot ask for its own.
    excludePaths:
      - /tmp
      - /var/tmp
      - /run
    # Write quota per device: the most of a participant's writes we keep (the uncompressed
    # size of all its snapshot layers). Over the quota the last good snapshot is kept
    # and a warning shows in the lab status.
    writeQuota: 512Mi
    # A regular file larger than this is never snapshotted (only that file is skipped;
    # the lab status warning names it). The write quota above is the total backstop,
    # applied after skipping.
    maxFileSize: 256Mi
    # The byte quotas count only the bytes of regular files, so a device that makes millions of empty files costs nothing
    # against them but a lot of memory and time to merge and unpack. maxEntries caps the entries (files, directories, links) of
    # one snapshot layer and of a squashed chain; over it the last good snapshot is kept and a warning shows in the lab status.
    # Character and block devices and named pipes are never kept, and an entry whose names and attributes pass 8 KiB is left out.
    maxEntries: 100000
    # The most the snapshots of ALL the devices of one tenant may take in the registry together (the sizes in their status).
    # The registry volume is shared by every tenant and the image cache, so without it one tenant can fill it. A Tenant may be
    # given less with spec.persistence.registryQuota. "0" = no limit.
    tenantQuota: 10Gi
    # What one device may push into the shared registry. A device keeps only its current state: the manifest (and the blobs only it
    # used) that a new snapshot replaces is deleted supersededGrace after the push (the grace lets a pod that was just created from
    # it still pull it). A change that comes sooner than minPushInterval after the last push, or over pushBudget of state within
    # pushBudgetWindow, waits for the next snapshot; the exit snapshot is never held back. "0" = no budget.
    # The exit snapshot (a pod that ended pushes outside the interval and the budget) is bounded per device: exitMaxBytes at most per push
    # ("0" = the device's write quota above) and exitPushesPerHour in a sliding hour, whatever the pod UIDs.
    exitMaxBytes: "0"
    exitPushesPerHour: 6
    minPushInterval: 60s
    pushBudget: 2Gi
    pushBudgetWindow: 1h
    supersededGrace: 2m
    # A push is refused while the registry (registry.size) holds more than this fraction less than its volume: everything it
    # stores counts, each blob once, retained repositories of deleted labs included.
    registryReserve: 0.1
    # Directories of one device's writable layer node-state watches with inotify (the kernel's watch limit is shared by
    # everything on the node). Past it the layer is only polled (about every 30 s), so a change is noticed later.
    maxWatchedDirs: 2000
    # How often the retention sweep of old snapshots runs (Go duration).
    retentionInterval: 10m
    # A snapshot-backed device is a bare Pod. When its node dies (NotReady, still in the cluster, or gone) the pod stays
    # Terminating and the device stays down. After this long Terminating on such a node the operator force-deletes the pod
    # and recreates the device from its last snapshot ("0" = never; see DEPLOY.md, "Node loss").
    nodeLossForceDeleteAfter: 5m
    # Snapshot layers kept on top of the base image before they are squashed into one.
    maxLayers: 10
    # How long the snapshots of a deleted lab are kept before the repository is deleted
    # (and the registry's GC frees the space).
    retention: 168h

    # Host path of the containerd root (the overlayfs snapshotter keeps the writable
    # layers below it), mounted read-only at the same path into node-state.
    containerdRoot: /var/lib/k0s/containerd
    # containerd namespace of the kubelet's CRI.
    containerdNamespace: k8s.io

# ============================================================
# Scheduler: how pods start when many labs arrive at once
# ============================================================
# The units are the top-level objects, LabGroup (its VPN and gateway pods) and Lab
# (one pod per container device); the slots are pods. At most maxPods pods are
# starting at once; a pod holds its slot from dispatch until it is Ready or declared
# failed. Objects with the same deploy group (label laboratory.cybericebox.com/deploy-group)
# form a group, and a group (or an independent lab) starts whole or not at all: it needs
# a slot for every pod (a group larger than maxPods goes in slices of the free slots) and
# a placement of every pod on the nodes, simulated per node with the reserves below, else
# it waits and the groups behind it go past it. A group whose pods are not all set up yet
# waits whole. The group being dispatched gets the slots first, the next group starts as
# soon as the current one has nothing left to dispatch (it does not wait for readiness),
# and a group whose annotation laboratory.cybericebox.com/deploy-after lists other groups
# starts only when all of them are complete (every pod Ready or failed). Objects without a
# deploy group are independent and go after all grouped work. The queue place and the
# reason are in status.scheduling of the Lab and LabGroup and in the agent's LabStatus.
scheduler:
  # false: every pod starts as soon as its object is created.
  enabled: true
  # Largest number of pods starting at once; 0 sets no limit.
  maxPods: 20
  # A dispatched pod that is not Ready after this long (Go duration) is declared
  # failed: its slot is freed and the device status gets a warning.
  startupTimeout: 5m
  # ... or after this many restarts, whichever comes first.
  restartThreshold: 5
  # Platform reserve: CPU and memory that user labs can never consume, so the platform itself (operator, proxy,
  # registry, node-agent, monitoring, the VPN and gateway pods' bursts) always has room. It is applied AFTER the
  # kubelet's own reserve (the allocatable of a node is already net of kube-reserved, system-reserved and
  # eviction) and AFTER the requests of every pod scheduled on the node (DaemonSets and the proxy included, in
  # both proxy modes). First platformReserveCpu / platformReserveMemory come off EVERY schedulable node (absolute
  # quantities, "0" = none), then platformReservePercent (0-99) of what is left of each node is kept free.
  platformReservePercent: 10
  platformReserveCpu: "0"
  platformReserveMemory: "0"
  # Packing reserve (hidden): the part of every node that is kept unused, because nodes do not share memory and devices leave
  # gaps between them, so the last part of a node can never be packed full. It is taken PER NODE from what is free there after
  # the requests of the non-lab pods and the platform node reserve, by the operator and by the agent alike: the operator admits
  # groups only into the room of each node net of it, and the agent reports its capacity net of it (0-49); tenants never see
  # the reserve or the nodes. packingReserveCpu / packingReserveMemory (absolute quantities, "0" = none) replace the percent
  # for that resource when they are not "0" (the agent takes that amount once off a tenant's cluster-wide quota).
  packingReservePercent: 15
  packingReserveCpu: "0"
  packingReserveMemory: "0"
  # false: dispatch does not look at the free CPU and memory of the nodes.
  resourceCheck: true
  # Aging: a group that has waited longer than this many seconds gets the room it needs kept for it (the oldest such group
  # only), so a stream of small groups cannot keep a big one out forever. 0 turns aging off (the default): the kept room is
  # held against every tenant without a time limit, so enable it once the reservation scopes the aged room.
  agingSeconds: 0
  # Pull the images of a group onto the eligible nodes before its first pod starts.
  # A short-lived DaemonSet in laboratory-system runs the images with the command
  # replaced by a sleep (no lab service starts); the node-agents pull through the registry gate, with the credentials of the tenant.
  prepull:
    enabled: true
    # Dispatch goes on after this long even if some image is still not pulled.
    timeout: 5m

# ============================================================
# Reservations (Reservation objects: cpu and memory kept for a tenant in a window)
# ============================================================
reservations:
  # The Ending condition is set this many seconds before the end of a reservation; at the end every group under it is
  # deleted. A reservation whose tenant is gone ends this long after that is seen. 0: no notice. Unreserved work that holds
  # the room of active reservations is marked this long (at least a minute) before it is deleted.
  endingNoticeSeconds: 300

# Capacity of the lab nodes (DEPLOY.md, "Maximum capacity and node autoscaling"). Current: the lab nodes that exist and are
# schedulable. Maximum: the real room of the fixed lab nodes plus, for the autoscaled ones (label cybericebox.com/node-group),
# the larger of their real room and budget: what they may give at most, as infra renders it: the number of nodes x
# (allocatable - the DaemonSets' requests), no percentage (the operator takes its reserves itself). Admission, the
# agent's capacity and the reservation check use the maximum: a group sent beyond the real room stays Pending until a node
# autoscaler (if infra installed one) adds a node. Both empty: no budget, the maximum is the current capacity.
capacity:
  budget:
    cpu: ""
    memory: ""
  # Gang commit (always on): when some dispatched pod of a group still has no node this many seconds after the group's last
  # dispatch, the whole group is withdrawn (all its pods deleted, also the running ones) and queued again with a backoff.
  nodeTimeoutSeconds: 900

# ============================================================
# Groups: what a group is made for
# ============================================================
# A group (the VPN and internet gateway pods it runs itself) is sized once, when it is created, from the number of VPN users and of
# labs it is made for (CreateLabGroups expected_users / expected_labs; formulas in code (internal/grouppods/limits.go), base = the size a pod had before,
# vpn.sizing and inetGateway.sizing only serve the old way, sizes sent by the caller). The pods are not resized afterwards: more users or labs than expected still run within the
# margin of the formula. A request for more than the maximum is refused. A group that says nothing gets the defaults.
groupLimits:
  maxUsers: 10
  maxLabs: 50
  defaultUsers: 1
  defaultLabs: 5
  # How many VPN and Internet gateways a lab is expected to have. The VPN pod is sized for labs x vpnGatewaysPerLab (a leg and an access
  # rule per client for each), the gateway pod for labs x internetGatewaysPerLab. A lab may have up to operator.maxLabGateways in all.
  vpnGatewaysPerLab: 2
  internetGatewaysPerLab: 1

# ============================================================
# VNI pool: retirement, quarantine, sweep
# ============================================================
# A VNI is not returned to the pool one write at a time: a release only retires it (a mark in the pool's status, queued and written
# in batches every retireFlush), the VNI is not given out for quarantine (a flow of its old owner may still be on a node), and
# the sweep, every sweepInterval, returns all that passed the quarantine in one update per pool. The sweep also retires leases whose
# owner is gone and held VNIs nobody references (a release that never ran).
vni:
  quarantine: 10m
  sweepInterval: 5m
  retireFlush: 2s

# ============================================================
# Bandwidth protection
# ============================================================
# No participant, lab or group can saturate a node or the cluster network. Per node and per direction:
#   U = the node's bandwidth - systemReserveMbit - the reserves of the platform pods that run on that node
# and of U the entry (the WireGuard demux and the L7 proxy) gets shares.entry percent, the internet (the gateways) shares.internet,
# and Geneve (the traffic between nodes) shares.geneve. Inside a class everyone gets a fair share, never more than its cap. Nothing
# inside a node is limited; only what crosses nodes (Geneve: an OVS meter per lab and one for the node; VXLAN: the demux and the L7 proxy
# per participant) and what goes to the internet (the gateway, per lab).
# A node's bandwidth is its label cybericebox.com/node-bandwidth in Mbit/s (the cloud code sets it from the instance type, the Proxmox
# inventory from the NIC); a node without it is defaultMbit. A platform pod declares what it keeps for itself with the annotation
# cybericebox.com/bandwidth-reserve (Mbit/s); it is taken off the node the pod runs on and no other.
# On by default. A node without the label is counted as defaultMbit (1000), so the fair sharing between participants and labs is exact
# only where the label is set; the per-participant ceiling (caps.participantMbit) works regardless of the label.
# Off: nothing is limited. Switching it on (also by upgrading from a version where it was off) gives the pods made from then on their
# limits (existing gateway pods keep none until they are recreated); switching it off again: set enabled: false, and the shares and caps to 0
# first, so the pods that already carry limits limit nothing.
bandwidth:
  enabled: true
  defaultMbit: 1000
  systemReserveMbit: 100
  shares:
    entry: 50
    internet: 25
    geneve: 25
  caps:
    participantMbit: 20
    # The lower bound of one participant's share (kbit/s; 0 = none, the share can then fall to 1 kbit/s). With very many active participants
    # class/active drops below it and a participant still gets this much, so a console session keeps working. The ceiling wins: a floor above
    # participantMbit is clamped to it. Accepted trade-off: with a floor the shares of all active participants together can pass the entry
    # class. Applies to participants only (the VPN demux, userspace and kernel fast path, and the L7 proxy), not to lab internet or Geneve.
    participantMinKbps: 1000
    labInternetMbit: 50
    labGeneveMbit: 100
    # What one lab may SEND to the internet (kbit/s, payload; the ACKs of what it downloads are not counted), and what all the labs of the
    # cluster together may send (Mbit/s; a lab's upload shrinks when they would pass it; 0 = no total). The download of a lab is labInternetMbit.
    labUploadKbps: 2048
    uploadTotalMbit: 100
  # The OVS meter counts the frame before the Geneve headers (about 50 bytes) are added; the Geneve class is scaled by this so that
  # small packets do not push the node over its class.
  geneveOverheadFactor: 0.85
  # The cluster network (VXLAN) adds about 50 bytes to every packet the demux and the L7 proxy forward to another node; the entry class
  # of a demux is scaled by this and divided by the number of lab nodes that can send to one VPN node, so that all of them sending to
  # one node together stay within that node's entry class (the U invariant).
  entryOverheadFactor: 0.85
  # What the pods of this chart keep for themselves (the annotation above). The backend and the frontends declare theirs in the
  # platform chart.
  reserves:
    registryMbit: 100
    agentMbit: 20

# ============================================================
# Limits the cluster owns on devices, labs and tenants
# ============================================================
# The management agent enforces them on CreateLabs (a lab over them is refused with the reason) and reports them
# in GetFeatures and the Monitoring stream; the backend keeps no copy. CPU and memory are Kubernetes quantities.
# A device is planned at its requests (CPU: request, else limit, else the default; memory: limit, else request, else the
# default); the CPU limit may sit above the request (a burst, the pod is Burstable) and is not counted by the scheduler or the quotas. The maxima are a sanity ceiling, not a sizing
# profile. 0 / "0" = no limit.
limits:
  device:
    # The most one device may take. A larger CPU of an object made by hand is clamped to maxCpu; a larger memory refuses the
    # device (no pod, Ready=False with the reason DeviceMemoryAboveMaximum, and its Lab fails with the same reason).
    maxCpu: 2000m
    maxMemory: 4Gi
    # The planning profile: what a device that declares no resources gets (and counts as).
    defaultCpu: 100m
    defaultMemory: 256Mi
    # true: a device that declares no cpuLimit runs with a CPU request only, no hard cap (CFS shares by request: it bursts to the
    # free CPU of its node, is never throttled, and cannot take a neighbour's requested share). A device with its own cpuLimit
    # keeps it. false: the limit equals the request (the old behaviour; short spikes are throttled).
    noCpuLimit: false
  lab:
    # Devices of one lab, every type counted (container, switch, hub). The platform has a ceiling of 64 that this can only lower (0 = the
    # ceiling); the chart refuses a larger value. A container device has at most 16 interfaces, a switch or hub 48 ports.
    maxDevices: 32
  group:
    # Labs of one LabGroup, and the sum of the planned resources of the devices of all its labs
    # ("0" = no limit on the sum). Devices count at their requests, so a group's sum is what it reserves.
    maxLabs: 50
    maxCpu: "0"
    maxMemory: "0"
  tenant:
    # Labs of one tenant; 0 = unlimited (the tenant's resource quota still applies).
    maxLabs: 0

# ============================================================
# Management agent: optional per-cluster gRPC agent for platform ops
# ============================================================
agent:
  enabled: false
  # The agent's Prometheus endpoint (/metrics, plain HTTP): CreateLabs per-item latency and the wait for the group admission lock. Off by
  # default. scrapeAnnotations adds the prometheus.io/* annotations to the pod. With agent.networkPolicy.enabled the port is opened to the cluster.
  metrics:
    enabled: false
    port: 9443
    scrapeAnnotations: false
  # Namespace of the management agent (the operator binds its ServiceAccount in every LabGroup namespace).
  namespace: laboratory-agent
  # Stable identity of this agent: makes the monitoring observations idempotent at the platform boundary.
  id: laboratory-agent
  # How often the agent refreshes the status of the Tenant objects (Go duration).
  tenantStatusInterval: 30s

  image:
    repository: cybericebox/laboratory-agent
    tag: ""
    pullPolicy: ""   # empty = IfNotPresent (the tag is always an exact version)

  # Rollout and shutdown: a new pod must be Ready (its port bound, the CRD check done) for minReadySeconds before the next one is replaced;
  # on SIGTERM the agent finishes running calls for up to shutdownGrace, after a preStop sleep of preStopSleepSeconds (so the Service stops sending
  # it calls first); terminationGracePeriodSeconds must be above the sum (default 5 + 30 + margin).
  minReadySeconds: 10
  preStopSleepSeconds: 5
  shutdownGrace: 30s
  terminationGracePeriodSeconds: 45

  # gRPC port the agent listens on (TLS).
  grpcPort: 5454
  # The entry: a NodePort Service with externalTrafficPolicy Local; the load balancer outside the cluster (infrastructure) sends the platform's
  # calls to the nodes that run the agent. mTLS stays. nodePort: a fixed number for the target group (30000-32767), empty = Kubernetes picks one.
  service:
    nodePort: null
    annotations: {}

  # Public domain for the agent's TLS certificate. Empty = ctl.<operator.baseDomain>.
  domain: ""

  # Replicas of the agent. One by default: one platform is one client and one agent is enough; scale only if one cannot cope.
  # The quota and fit checks of reservations are serialized inside one agent process only (a lock per tenant and per reservation,
  # DEPLOY.md, "Reservations through the agent"), so a second replica can let two reservations past the quota together. The chart
  # therefore REFUSES more than one replica unless multiReplicaAck is true: an explicit statement that this backend does not
  # use reservations through the agent (or accepts that race). The state in memory (the image-prewarm progress, the Monitoring
  # journal) is per replica and rebuilt when a client reconnects to another one.
  replicas: 1
  # Acknowledge that more than one replica is meant (see replicas). Needed only for replicas > 1.
  multiReplicaAck: false
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Callers must present a client certificate (mTLS) and the agent always serves TLS. The CA that signs the client certificates:
  # its lifetime (cert-manager defaults to 90 days) and how long before its end it is renewed (with the same key, so certificates
  # already issued keep working).
  mtls:
    caDuration: 43800h
    caRenewBefore: 8760h
  # The one development switch: the agent does not ask for a client certificate and every caller is the default tenant. For local
  # development only. TLS stays on.
  allowInsecure: false

  # What a caller can cost the agent. A connection without a client certificate reaches only the Enroll call, on a server that
  # reads small messages and is rate limited; a connection with one gets the full API.
  server:
    maxConcurrentStreams: 64        # per connection
    maxConnectionAge: 1h            # a connection is replaced after this (a revoked certificate is noticed at the latest then)
    maxConnectionAgeGrace: 1m
    keepaliveMinTime: 10s           # the most frequent client keepalive ping the server accepts
    streamRecheck: 30s              # a running stream (Monitoring, snapshot export) is authorized again this often
    renewMinInterval: 10s           # one tenant may renew its certificate this often
    enroll:
      maxMessageBytes: 65536        # the largest message of a caller without a client certificate
      rate: 5                       # Enroll calls per second, all callers together
      burst: 10
      handshakeTimeout: 10s
      maxHandshakes: 64             # TLS handshakes in progress at once
      maxAnonymousConns: 256        # open connections without a client certificate, all addresses together
      # No per-address limits: behind the gateway every caller has the same source address.

  # Enrollment: a tenant gets its client certificate and registers its access key with a one-time
  # token (see DEPLOY.md, "Enrollment & access keys"); no private key ever leaves the tenant.
  enrollment:
    # How long an unused enrollment token works.
    tokenTTL: 24h
    # How long a client certificate issued by Enroll / RenewCertificate is valid (at most the CA's).
    certificateTTL: 720h

  # Manual fallback, off by default: cert-manager issues a client certificate (and its private key,
  # into a Secret of the cluster) for every tenant: Secret laboratory-agent-client-<name>-tls. Use
  # enrollment instead whenever the tenant can reach the agent.
  tenantCertificates:
    enabled: false

  # The Monitoring stream: one poller and one in-memory journal serve every platform
  # backend that subscribes. See DEPLOY.md, "Monitoring stream".
  monitoring:
    # Updates the journal keeps for resuming subscribers.
    journalSize: 10000
    # How long an update stays in the journal.
    journalAge: 15m
    # How often the platform is observed while anybody is subscribed. A poll reads informer caches (no API call), so 1s is cheap;
    # the caches hold the objects of all tenants (raise agent.resources with the number of labs).
    pollInterval: 1s
    # Updates a subscriber may lag behind before its stream is dropped.
    subscriberBuffer: 256
    # Monitoring streams one tenant may hold open at once (each subscribe runs a full collect and keeps a buffer); 0 = unlimited.
    maxStreamsPerTenant: 8

  # Container resource requests/limits.
  # 256Mi: the Monitoring caches hold the objects of all tenants (and a request is read up to 4 MiB).
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  networkPolicy:
    enabled: true

# ============================================================
# Tenant images
# ============================================================
images:
  # Repositories no tenant may use, "registry/repository-prefix" entries. Put here every
  # private registry or organization the platform has credentials for (the image cache and
  # its on-demand sync use the platform's credentials, so a tenant that names such an
  # image would otherwise get it). Enforced by the management agent on CreateLabs and
  # PrewarmImages. A tenant's own images.allow narrows the rest.
  tenantDeny: []

# ============================================================
# Common
# ============================================================
# Registry Secrets (type kubernetes.io/dockerconfigjson) for the PLATFORM's private
# images, as a list of `- name: <secret>`. Create them in the release namespace
# (laboratory-system) outside the chart. They are referenced by the pods of the lab-control
# pool (the operator, the agent, the lab scheduler, the registry), and the operator copies
# them into the Secret `platform` of the namespace laboratory-upstream, where only the registry
# gate reads them, to fetch the VPN, gateway and netconfig images. No pod of the lab pool and
# no pod of a lab gets a pull secret: a tenant's images are fetched by the gate with the
# tenant's own credentials (tenants.<name>.images.pullSecret), or anonymously.
# The agent runs in its own namespace (laboratory-agent): create the Secrets there too.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ============================================================
# cert-manager subchart values (used when certManager.install=true)
# ============================================================
cert-manager:
  crds:
    enabled: true

# ============================================================
# Tenants of the management agent
# ============================================================
# A tenant is a client of the agent with its own objects, device persistence policy and
# resource quota. The chart always creates the tenant "default" (the caller without a client
# certificate, local development) and one Tenant per key below. The operator gives every tenant a
# one-time enrollment token (Secret tenant-<name>-enrollment in laboratory-tenants); the tenant enrolls
# with it and gets a client certificate with CN = the tenant name (see DEPLOY.md, "Enrollment & access keys").
# The agent refuses a certificate whose CN is not a tenant. A name is a DNS-1123 label.
#
#   tenants:
#     platform:
#       persistence:
#         allowed: true         # may ask for device persistence (needs devices.statePersistence.enabled)
#         writeQuota: 256Mi     # optional; capped by devices.statePersistence.writeQuota
#         maxFileSize: 128Mi    # optional; capped by devices.statePersistence.maxFileSize
#       receivesLabErrors: true # the platform's own backend: it gets the laboratory's own errors (operator, node-agent, proxy,
#                               #   demux, VPN and gateway pods) in the error journal; leave it off for a customer tenant
#       quota:                  # optional; absent = no limit
#         cpu: "50%"            # sum of the CPU requests of its pods: "32", "500m" or a percentage
#         memory: "40%"         #   of what the lab nodes allocate
#       images:
#         pullSecret: acme-registry   # a dockerconfigjson Secret in laboratory-tenants: the tenant's
#                                     #   own registry credentials for its devices. With the image cache
#                                     #   on they go through it (re-keyed for the cache path, the tenant
#                                     #   in the username) and the registry gate proves every pull.
#         allow:                      # optional; absent = any image `images.tenantDeny` does not exclude
#           - ghcr.io/acme/           # registry/repository prefixes; a reference equal to an entry
#           - docker.io/library       #   or under it is allowed
#
# "default" may be listed to change its policy; unless it is, it may use persistence and has no quota.
tenants: {}

# Lifecycle acceptance stays gated until the final integrated native proof.
# Advertised capabilities require owner-qualified native evidence and all
# dependencies below. Source/SDK integration alone does not authorize enable.
lifecycle:
  # "full" switches on with one value what a cluster needs to stop and restart labs: devices.statePersistence.enabled,
  # runtimeObservation.enabled and the capabilities perLabStop, confirmedRuntime, retainedRestart, fullGroupStop and requiredSnapshot (with requiredSnapshotAvailable).
  # Set devices.statePersistence.containerdRoot to the containerd root of the cluster. The node-agents check their node at start (the
  # containerd root and its snapshotter, the container runtime, the cgroup tree, the snapshot registry); what a node cannot do is switched
  # off there, told in an Event on the Node and in its annotations, and GetFeatures reports the lifecycle capabilities and persistence as
  # available only when every ready lab node confirms them, with the reason otherwise. Empty (default): the values below as they are.
  profile: ""
  capabilities:
    requiredSnapshot: false
    perLabStop: false
    confirmedRuntime: false
    retainedRestart: false
    fullGroupStop: false
  requiredSnapshotAvailable: false
  runtimeObservation:
    enabled: false
    interval: 5s
