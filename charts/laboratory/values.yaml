# ============================================================
# Operator configuration
# ============================================================
operator:
  image:
    repository: cybericebox/laboratory-controller
    tag: "latest"
    pullPolicy: IfNotPresent

  # REQUIRED: host:port advertised to WireGuard clients (demux public address).
  # Example: "vpn.example.com:51820"
  publicVPNEndpoint: ""

  # REQUIRED: cluster ingress base domain for device exposure URLs.
  # Example: "lab.example.com"
  baseDomain: ""

  # UDP port the VPN server listens on.
  vpnServicePort: 51820

  # Base address space for all VPN subnets.
  # Client subnet = first /24 (e.g. 10.8.0.0/24).
  # Per-lab VPN subnets = 10.8.N.0/24, N >= 1.
  vpnBaseNetwork: "10.8.0.0/10"

  # Base address space for internet-gateway subnets.
  inetBaseNetwork: "10.9.0.0/10"

  # Comma-separated CIDRs of proxy source IPs for hostNetwork proxy (e.g. Kind).
  # Leave empty in standard clusters.
  proxySourceCIDRs: ""

  # DNS server advertised to WireGuard clients via DHCP option (optional).
  dhcpDns: ""

  leaderElection: true

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

# ============================================================
# VPN pod image (created at runtime by operator per LabGroup)
# ============================================================
vpn:
  image:
    repository: cybericebox/laboratory-lab
    tag: "latest"

# ============================================================
# Gateway pod image (created at runtime by operator per LabGroup)
# ============================================================
inetGateway:
  image:
    repository: cybericebox/laboratory-lab
    tag: "latest"

# ============================================================
# Proxy: proxy-l7 (Deployment) + proxy-wg (DaemonSet)
# ============================================================
proxy:
  enabled: true

  # Set true when running in Kind: overrides API server address to 127.0.0.1:6443.
  kindMode: false

  # L7 HTTPS proxy — Deployment, receives TLS passthrough from Cilium Gateway.
  l7:
    enabled: true
    image:
      repository: cybericebox/laboratory-proxy
      tag: "latest"
      pullPolicy: IfNotPresent
    listen: ":443"
    cookieName: "challenge"
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # WireGuard demux — DaemonSet, hostNetwork, XDP on eth0.
  wg:
    enabled: true
    image:
      repository: cybericebox/laboratory-proxy
      tag: "latest"
      pullPolicy: IfNotPresent
    # Internal UDP port the proxy-wg pod binds to on the host.
    # The LoadBalancer Service maps operator.vpnServicePort → this port.
    # Set to a different value than vpnServicePort to avoid bind conflicts
    # when the host already occupies 51820 (e.g. Kind with WireGuard).
    listenPort: 51820
    externalInterface: "lima0"
    # Restrict proxy-wg DaemonSet to specific nodes (e.g. nodes with public IPs).
    # Leave empty to run on all worker nodes.
    # Example: {"proxy-node": "true"}
    nodeSelector: {}
    tolerations: []
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # LoadBalancer Service annotations (e.g. cloud-specific LB config).
  service:
    annotations: {}
    # Share the same LB IP with the Cilium Gateway Service via lbipam.cilium.io/sharing-key.
    # Both proxy-wg (UDP:51820) and Gateway (TCP:443) get the same external IP.
    # Leave empty to get a separate IP for WireGuard.
    sharedLBKey: "laboratory"

# ============================================================
# Cilium Gateway API (TLS passthrough, shared LB IP)
# ============================================================
gateway:
  enabled: true

  # GatewayClass name (cilium is installed with Cilium).
  gatewayClassName: "cilium"

  # Set true to create GatewayClass resource.
  # Set false if GatewayClass already exists in the cluster.
  createGatewayClass: false

  # Additional annotations on the Gateway (e.g. for cloud LB config).
  annotations: {}

# ============================================================
# cert-manager integration (issues TLS cert for proxy)
# ============================================================
certManager:
  # Set true to install cert-manager as a Helm subchart dependency.
  # Set false if cert-manager is already installed in the cluster.
  install: false

  # Set true to create ClusterIssuer and Certificate resources.
  enabled: true

  # REQUIRED when enabled: email for ACME account registration.
  email: ""

  # Set true to use cert-manager SelfSigned issuer (local dev, no public domain needed).
  # Set false to use ACME (Let's Encrypt) — requires a real public domain and email.
  selfSigned: false

  # Use Let's Encrypt staging (recommended for testing).
  # Set false for production certificates.
  staging: true

  # Name of the ClusterIssuer to create.
  issuerName: "letsencrypt"

# ============================================================
# Node-agent DaemonSet configuration
# ============================================================
nodeAgent:
  enabled: true

  image:
    repository: cybericebox/laboratory-node-agent
    tag: "latest"
    pullPolicy: IfNotPresent

  # Exclude control-plane nodes from the DaemonSet (set false for single-node Kind).
  excludeControlPlane: true

  ovsSocket: "/run/openvswitch/db.sock"
  grpcSocket: "/run/cybericebox/node-agent.sock"
  procRoot: "/host/proc"

# ============================================================
# Lab workload scheduling (VPN, gateway, device pods)
# ============================================================
labWorkloads:
  # nodeSelector applied to all runtime lab pods.
  # Example: {"lab-node": "true"} — only schedule on nodes labelled lab-node=true.
  nodeSelector: {}
  # tolerations applied to all runtime lab pods.
  tolerations: []

# ============================================================
# Platform credentials
# ============================================================
platform:
  # RSA public key (PEM) used by proxy-l7 to verify JWT tokens issued by the daemon.
  # The operator syncs this into proxy-credentials secret in laboratory-proxy namespace.
  # Pass via: --set-file platform.jwtPublicKey=/path/to/jwt-public-key.pem
  jwtPublicKey: ""

# ============================================================
# Common
# ============================================================
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ============================================================
# cert-manager subchart values (used when certManager.install=true)
# ============================================================
cert-manager:
  crds:
    enabled: true
