# ============================================================
# Operator configuration
# ============================================================
operator:
  image:
    repository: cybericebox/laboratory-controller
    tag: "latest"
    pullPolicy: IfNotPresent

  # REQUIRED (no default): host:port advertised to WireGuard clients (demux public address).
  # Example: "vpn.example.com:51820"
  publicVPNEndpoint: ""

  # REQUIRED: cluster ingress base domain for device exposure URLs (also the proxy's
  # BASE_DOMAIN and the session cookie domain). Example: "lab.example.com"
  baseDomain: "lab.local"

  # UDP port the VPN server listens on.
  vpnServicePort: 51820

  # Global lab network 10.128.0.0/9 is split into two non-overlapping /10 halves:
  # VPN = 10.128.0.0/10 (10.128.0.0-10.191.255.255), internet = 10.192.0.0/10.
  # Client subnet = first /24 (10.128.0.0/24); per-lab VPN subnets = 10.128.N.0/24, N >= 1.
  vpnBaseNetwork: "10.128.0.0/10"

  # Internet-gateway half of the global network (per-lab = 10.192.N.0/24).
  inetBaseNetwork: "10.192.0.0/10"

  # Comma-separated CIDRs of proxy source IPs for hostNetwork proxy (e.g. Kind).
  # Leave empty in standard clusters.
  proxySourceCIDRs: ""

  # REQUIRED: contact address shown to participants on the VPN probe page.
  # The operator passes it to every per-LabGroup VPN pod.
  supportEmail: "support@cybericebox.com"

  leaderElection: true

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  networkPolicy:
    enabled: true

# ============================================================
# VPN pod image (created at runtime by operator per LabGroup)
# ============================================================
vpn:
  image:
    repository: cybericebox/laboratory-lab
    tag: "latest"
    # No pullPolicy key here (unlike operator/proxy/nodeAgent/agent): this image is
    # only ever used to build a Pod spec directly in Go
    # (internal/controller/laboratory/labgroup_controller.go), which hardcodes
    # ImagePullPolicy: IfNotPresent. There is no chart-level knob to plumb it through.

# ============================================================
# Gateway pod image (created at runtime by operator per LabGroup)
# ============================================================
inetGateway:
  image:
    repository: cybericebox/laboratory-lab
    tag: "latest"
    # No pullPolicy key here (unlike operator/proxy/nodeAgent/agent): this image is
    # only ever used to build a Pod spec directly in Go
    # (internal/controller/laboratory/labgroup_controller.go), which hardcodes
    # ImagePullPolicy: IfNotPresent. There is no chart-level knob to plumb it through.

# ============================================================
# Proxy: l7 + wg-demux containers in one unprivileged Deployment
# ============================================================
proxy:
  enabled: true

  # Kubernetes namespace for the proxy Deployment/Service/ServiceAccount/NetworkPolicy
  # and its own dedicated Namespace object (l7 + wg-demux containers). Also the value
  # exchanged with the Gateway via the mutual lbipam.cilium.io/sharing-cross-namespace
  # annotation pair (gateway/gateway.yaml names this namespace; proxy/service-wg-lb.yaml
  # names the Gateway's namespace via .Release.Namespace) — both must stay in sync for
  # Cilium's LB-IPAM cross-namespace IP sharing to work.
  # Must stay "laboratory-proxy": the operator's lab access key sync
  # (platform_reconciler.go) and each Lab's web-exposure NetworkPolicy peer selector
  # (lab_controller.go) use the compile-time constant internal/names.ProxyNamespace.
  # templates/validate.yaml refuses any other value.
  namespace: "laboratory-proxy"

  # Set true when running in Kind: overrides API server address to 127.0.0.1:6443.
  kindMode: false

  # Shared image for both the l7 and wg-demux containers.
  image:
    repository: cybericebox/laboratory-proxy
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 1

  # L7 HTTPS proxy container — receives TLS passthrough from Cilium Gateway.
  l7:
    enabled: true
    listen: ":8443"
    # Name of the proxy's own session cookie (SESSION_COOKIE_NAME).
    sessionCookieName: "challenge"
    # HMAC-SHA256 key (32+ bytes) of the proxy's own session cookie, set on /_auth
    # from the platform's lab access link. Never the lab access key. Shared by all
    # replicas. existingSecret names a Secret with key `sessionSecret`; otherwise
    # `value` is used, and when that is empty a key is generated once and kept
    # across upgrades (lookup).
    sessionSecret:
      existingSecret: ""
      value: ""
    # How often each replica publishes its request counters (REPORT_INTERVAL).
    reportInterval: "1m"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # WireGuard demux container — plain userspace UDP, no hostNetwork/capabilities.
  wg:
    enabled: true
    # Internal UDP port the wg-demux container binds to.
    # The LoadBalancer Service maps operator.vpnServicePort → this port.
    listenPort: 51820
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

  # LoadBalancer Service annotations (e.g. cloud-specific LB config).
  service:
    annotations: {}

  # Cilium LB-IPAM sharing key: makes the WG LoadBalancer Service and the
  # Gateway's Service share one external IP (UDP 51820 + TCP 443 don't conflict).
  sharingKey: "laboratory-edge"

  networkPolicy:
    enabled: true

# ============================================================
# Cilium Gateway API (TLS passthrough, shared LB IP)
# ============================================================
gateway:
  enabled: true

  # GatewayClass name (cilium is installed with Cilium).
  gatewayClassName: "cilium"

  # Set true to create GatewayClass resource.
  # Set false if GatewayClass already exists in the cluster.
  createGatewayClass: false

  # Additional annotations on the Gateway (e.g. for cloud LB config).
  annotations: {}

  # Extra annotations for the Gateway's generated LoadBalancer Service
  # (spec.infrastructure.annotations), e.g. a fixed edge IP:
  #   lbipam.cilium.io/ips: "192.168.105.241"
  # Give the same lbipam.cilium.io/ips to proxy.service.annotations so the WG
  # Service and the Gateway share that one IP.
  serviceAnnotations: {}

# ============================================================
# cert-manager integration (issues TLS cert for proxy)
# ============================================================
certManager:
  # Set true to install cert-manager as a Helm subchart dependency.
  # Set false if cert-manager is already installed in the cluster.
  # NOTE: currently has no effect either way — Chart.yaml does not declare cert-manager
  # under `dependencies:` (only Chart.lock and the vendored
  # charts/cert-manager-v1.20.2.tgz reference it), so the subchart never renders
  # regardless of this value (verified: `helm template` produces zero
  # laboratory/charts/cert-manager/* resources for both true and false). Until that
  # dependencies entry is added, install cert-manager separately and leave this false.
  install: false

  # Set true to create ClusterIssuer and Certificate resources.
  enabled: true

  # REQUIRED when enabled: email for ACME account registration.
  email: ""

  # Set true to use cert-manager SelfSigned issuer (local dev, no public domain needed).
  # Set false to use ACME (Let's Encrypt) — requires a real public domain and email.
  selfSigned: true

  # Use Let's Encrypt staging (recommended for testing).
  # Set false for production certificates.
  staging: true

  # Name of the ClusterIssuer to create.
  issuerName: "letsencrypt"

# ============================================================
# Node-agent DaemonSet configuration
# ============================================================
nodeAgent:
  enabled: true

  image:
    repository: cybericebox/laboratory-node-agent
    tag: "latest"
    pullPolicy: IfNotPresent

  # Exclude control-plane nodes from the DaemonSet (set false for single-node Kind).
  excludeControlPlane: true

  ovsSocket: "/run/openvswitch/db.sock"
  grpcSocket: "/run/cybericebox/node-agent.sock"
  criSocket: "/run/k0s/containerd.sock"

  # Container resource requests/limits for all init/main containers (ovs,
  # node-agent, cni installers). Empty by default: these are host-privileged
  # system processes intentionally left unconstrained unless overridden.
  resources: {}

# ============================================================
# Lab workload scheduling (VPN, gateway, device pods)
# ============================================================
labWorkloads:
  # nodeSelector applied to all runtime lab pods.
  # Example: {"lab-node": "true"} — only schedule on nodes labelled lab-node=true.
  nodeSelector: {}
  # tolerations applied to all runtime lab pods.
  tolerations: []

# ============================================================
# Management agent: optional per-cluster gRPC agent for platform ops
# ============================================================
agent:
  enabled: false
  namespace: laboratory-agent

  image:
    repository: cybericebox/laboratory-agent
    tag: "latest"
    pullPolicy: IfNotPresent

  # gRPC port the agent listens on (TLS).
  grpcPort: 5454

  # Public domain for the agent's TLS certificate + TLSRoute hostname.
  domain: agent.example.com

  mtls:
    enabled: true

  # CNs of client certs allowed to call the agent (sent as AGENT_ALLOWED_CLIENT_CNS).
  allowedClientCNs:
    - platform

  # Each entry becomes a cert-manager Certificate → Secret laboratory-agent-client-<name>-tls,
  # issued by the private laboratory-agent-ca Issuer.
  clients:
    - platform

  # Container resource requests/limits.
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  networkPolicy:
    enabled: true

# ============================================================
# Platform credentials
# ============================================================
platform:
  # Ed25519 public key (PKIX PEM) that proxy-l7 uses to verify the lab access
  # tokens (handoff links) signed by the daemon (LAB_ACCESS_PRIVATE_KEY).
  # The operator's PlatformReconciler syncs this into the lab-access-public-key Secret in
  # the proxy namespace. REQUIRED while the proxy is enabled.
  # Pass via: --set-file platform.labAccessPublicKey=/path/to/lab-access-public.pem
  # (make lab-access-keys generates the pair).
  labAccessPublicKey: ""

# ============================================================
# Common
# ============================================================
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ============================================================
# cert-manager subchart values (used when certManager.install=true)
# ============================================================
cert-manager:
  crds:
    enabled: true
