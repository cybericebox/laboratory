name: Build image

# Builds any commit and publishes sha-<7>. When that image already exists it is not rebuilt.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build (the develop head by default)
        required: false
        default: develop

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The Docker Hub credentials are secrets of the environment "build" (deployment branches: develop and release/*), so no workflow
    # holds a registry write credential outside an environment. A manual run on any other branch cannot read them.
    environment:
      name: build
      # The environment holds the Docker Hub secrets and their branch rule; it is not a place anything is deployed to
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            image: cybericebox/laboratory-controller
            target: controller
          - name: agent
            image: cybericebox/laboratory-agent
            target: agent
          - name: proxy
            image: cybericebox/laboratory-proxy
            target: proxy
          - name: node
            image: cybericebox/laboratory-node
            target: node
          - name: lab
            image: cybericebox/laboratory-lab
            target: lab
    steps:
      # The scripts that run with the Docker Hub credentials are the ones of the branch the workflow runs on (develop or release/*, the
      # branches the environment allows), never the ones of the commit that is built: that commit is data for the build.
      - name: Check repository (the trusted scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the commit to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'develop' }}
          path: src
          persist-credentials: false
      - name: Login to docker registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tag
        id: meta
        run: |
          echo "sha=$(.github/scripts/ci.sh sha-tag "$(git -C src rev-parse HEAD)")" >> "$GITHUB_OUTPUT"
      - name: Is the image already there
        id: exists
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.meta.outputs.sha }}
        run: |
          if .github/scripts/ci.sh exists "$IMAGE" "$TAG"; then
            echo "$IMAGE:$TAG already exists: nothing is rebuilt"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        if: steps.exists.outputs.found != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build and push the image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: src/Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-release
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.sha }}
