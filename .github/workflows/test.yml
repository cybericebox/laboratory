name: Test

# The tests of the repository: the PR check and the pre-release run them (workflow_call).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned tools (mise.toml)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Running Tests
        run: |
          go mod tidy
          mise run test

  netns:
    name: Real-iptables tests (network namespaces)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to Docker Hub for container tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: VPN and gateway pod firewalls in network namespaces (privileged docker, make test-netns)
        run: make test-netns

  bpf:
    name: eBPF fast path of the WireGuard demux
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to Docker Hub for container tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: The committed objects match wg_fastpath.bpf.c (make generate-bpf is reproducible)
        run: |
          make generate-bpf
          git diff --exit-code -- internal/proxy/demux/fastpath
      - name: Program tests and live forwarding in network namespaces (privileged docker, make test-bpf)
        run: make test-bpf

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned tools (mise.toml)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Run linter
        run: mise run lint

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned tools (mise.toml)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Login to Docker Hub for container tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Allow user namespaces (device pods run with hostUsers false; Ubuntu's AppArmor restricts them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Create kind cluster (1 control plane + 2 lab workers, one tainted)
        run: mise run cluster-up
      - name: Running Test e2e
        run: |
          go mod tidy
          mise run e2e
