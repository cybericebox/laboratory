name: Promote

# Turns a candidate (vX.Y.Z-rc.N) of a release line into the release vX.Y.Z. Started by `mise run release promote` in infrastructure
# (gh workflow run promote.yml -f rc=...) or by hand. Steps, each one safe to run again after a failure:
#   verify   the candidate is the newest of its version, its commit is the result of a merged pull request into release/X.Y whose head had
#            every required check green (the first candidate of a line: a merged pull request into develop), and the line gate still passes
#            (.github/scripts/release_gate.py; any failed lookup refuses). There is no review requirement.
#   release  the SAME images get the tag vX.Y.Z (no rebuild; latest moves when this is the newest release), the chart is published with
#            the final version, the git tag and the GitHub release page are created at the commit of the candidate
#   main     the commit is merged into main with a merge commit
#   cleanup  retention (cleanup.yml): the candidates of every released version are deleted, then the older patches and minors
# dry_run verifies and prints the plan and changes nothing (it only reads: the retention list is made with the Docker Hub credentials).
#
# It runs only from main: the scripts that decide are the ones on main, never the ones of the line or of a pull request. The default
# branch of this repository is develop, so it must be started with `gh workflow run promote.yml --ref main` (a run on any other ref stops
# at the first step). The workflow file has to exist on the default branch too (GitHub lists a dispatchable workflow from there) and on
# main: the first promote of a repository needs these workflows on both already.
# Secrets (the Docker Hub credentials and RELEASE_TOKEN) are secrets of the environment "release" (deployment branch: main only), so a
# run from any other ref, with any edited copy of this file, cannot read them.
on:
  workflow_dispatch:
    inputs:
      rc:
        description: Candidate to promote (vX.Y.Z-rc.N)
        required: true
      dry_run:
        description: Verify and print only, change nothing
        type: boolean
        default: false

concurrency:
  group: promote
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  IMAGES: cybericebox/laboratory-controller cybericebox/laboratory-agent cybericebox/laboratory-proxy cybericebox/laboratory-node cybericebox/laboratory-lab
  CHART_REPO: cybericebox/laboratory
  RC: ${{ inputs.rc }}

jobs:
  verify:
    name: Verify the candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      sha: ${{ steps.rc.outputs.sha }}
      version: ${{ steps.rc.outputs.version }}
      latest: ${{ steps.rc.outputs.latest }}
    steps:
      - name: Promote runs from main only
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" == refs/heads/main ]] || { echo "::error::Promote runs from main (got $REF): its scripts are the trusted ones"; exit 1; }
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The candidate may be promoted
        id: rc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force --quiet
          sha=$(python3 .github/scripts/release_gate.py verify-candidate --repo "$GITHUB_REPOSITORY" --rc "$RC")
          version=${RC%-rc.*}
          latest=false
          if git tag --list | python3 .github/scripts/release_version.py is-latest "$version"; then latest=true; fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
      # Before anything is published: a merge into main that cannot happen would leave a public release behind a red run.
      - name: main can take the commit
        env:
          SHA: ${{ steps.rc.outputs.sha }}
        run: |
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "main already has ${SHA:0:7}"
          elif git merge-tree --write-tree --quiet origin/main "$SHA" >/dev/null; then
            echo "main takes ${SHA:0:7} with a merge commit, without a conflict"
          else
            echo "::error::merging ${SHA:0:7} into main conflicts. Nothing is published yet. Merge main into the line by a pull request first (or merge by hand), then promote"
            exit 1
          fi
      - name: The plan
        env:
          VERSION: ${{ steps.rc.outputs.version }}
          SHA: ${{ steps.rc.outputs.sha }}
          LATEST: ${{ steps.rc.outputs.latest }}
        run: |
          echo "promote $RC (${SHA:0:7}) to $VERSION"
          echo "images that get the tag $VERSION (no rebuild; latest moves: $LATEST):"
          for image in $IMAGES; do echo "  $image"; done
          echo "chart $CHART_REPO:${VERSION#v}"
          if git merge-base --is-ancestor "$SHA" origin/main; then echo "main already has the commit"; else echo "main gets the commit with a merge commit"; fi
          echo "candidates of $VERSION that retention deletes afterwards:"
          git tag --list "$VERSION-rc.*" | sed 's/^/  /'

  release:
    name: Release
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
      LATEST: ${{ needs.verify.outputs.latest }}
    steps:
      # First, before a single tag is pushed: the last job needs this token, and a release cannot be undone (version tags are immutable).
      - name: The token that updates main is there and can push
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          [[ -n "$RELEASE_TOKEN" ]] || { echo "::error::the secret RELEASE_TOKEN is not set: main could not be updated after the release. Nothing is published"; exit 1; }
          push=$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq .permissions.push)
          [[ "$push" == true ]] || { echo "::error::RELEASE_TOKEN has no push access to $GITHUB_REPOSITORY. Nothing is published"; exit 1; }
      - name: Check repository (the trusted scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check the released commit (the chart)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: src
          persist-credentials: false
      - name: Login to docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: The candidate images exist and were built from the commit
        run: |
          for image in $IMAGES; do
            state=$(.github/scripts/ci.sh image-state "$image" "$RC" "$SHA")
            [[ "$state" == same ]] || { echo "::error::$image:$RC is $state"; exit 1; }
          done
      - name: Add the version tag to the candidate image (no rebuild)
        run: |
          for image in $IMAGES; do
            .github/scripts/ci.sh retag "$image" "$RC" "$VERSION"
            if [[ "$LATEST" == true ]]; then .github/scripts/ci.sh retag "$image" "$RC" latest; fi
          done
      - name: Install helm (the pinned tools of the released commit)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          working_directory: src
      - name: Package and push the chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          .github/scripts/ci.sh chart src/charts/laboratory "${VERSION#v}" "$VERSION" "$RUNNER_TEMP/dist"
      # A draft that gets its asset and is published last (the repository's releases are immutable: a published one takes no asset). The
      # tag is created at the publication, at SHA. A re-run continues in whatever state the release is (.github/scripts/release.sh).
      - name: Create the release as a draft, add the chart, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force --quiet
          .github/scripts/release.sh "$VERSION" "$SHA" "$LATEST" "$RUNNER_TEMP/dist/laboratory-${VERSION#v}.tgz"

  main:
    name: Merge the line into main
    needs: [verify, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      # main is protected: only the owner and RELEASE_TOKEN (a fine-grained token or an app token with contents write that the ruleset of
      # main lets bypass the pull request rule) may update it. The commit of the candidate goes in with a merge commit.
      - name: Check main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Merge
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          [[ -n "$RELEASE_TOKEN" ]] || { echo "::error::the secret RELEASE_TOKEN is not set: main cannot be updated. Merge ${SHA:0:7} into main by hand, then run Promote again (or Retention)"; exit 1; }
          if git merge-base --is-ancestor "$SHA" HEAD; then
            echo "main already has ${SHA:0:7}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff -m "Release $VERSION" "$SHA" || { echo "::error::$VERSION is published but merging ${SHA:0:7} into main conflicts: merge it by hand, then run Promote again (it skips what is done) or Retention"; exit 1; }
          git push origin HEAD:main || { echo "::error::$VERSION is published but main could not be pushed (the ruleset of main must let RELEASE_TOKEN bypass): fix it, then run Promote again"; exit 1; }

  cleanup:
    name: Retention
    needs: [verify, release, main]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (inputs.dry_run || (needs.release.result == 'success' && needs.main.result == 'success')) }}
    permissions:
      contents: write
    uses: ./.github/workflows/cleanup.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      strict: false # the release is public by now; a refused deletion is reported and does not turn this run red
    secrets: inherit
