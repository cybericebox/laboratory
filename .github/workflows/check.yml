name: Check

# PR builds use Docker Hub's reusable cache. Each successful same-repository
# run exports to a unique tag before updating buildcache-develop; old caches
# are tracked on Docker Hub and pruned after 72 hours. Forks never write caches.
on:
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  image:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            image: cybericebox/laboratory-controller
            target: controller
          - name: agent
            image: cybericebox/laboratory-agent
            target: agent
          - name: proxy
            image: cybericebox/laboratory-proxy
            target: proxy
          - name: node
            image: cybericebox/laboratory-node
            target: node
          - name: lab
            image: cybericebox/laboratory-lab
            target: lab
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to docker registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Cache export tag
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: cache
        run: echo "tag=buildcache-run-$(date +%s)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-develop
          cache-to: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref={0}:{1},mode=max,oci-mediatypes=true,image-manifest=true', matrix.image, steps.cache.outputs.tag) || '' }}

      - name: Publish reusable cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGE: ${{ matrix.image }}
          CACHE_TAG: ${{ steps.cache.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/scripts/cache.py publish "$IMAGE" "$CACHE_TAG"
      - name: Prune superseded registry caches
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/scripts/cache.py prune "$IMAGE" --keep-hours 72

  passed:
    name: Check passed
    if: ${{ always() }}
    needs: [test, image]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
