name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.2.0)
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  images:
    name: image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: laboratory
            file: Dockerfile
            image: cybericebox/laboratory
          - name: node
            file: Dockerfile.node
            image: cybericebox/laboratory-node
          - name: lab
            file: Dockerfile.lab
            image: cybericebox/laboratory-lab
    steps:
      - name: Check repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          tags: |
            ${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ${{ matrix.image }}:latest

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - name: Check repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Package chart
        run: |
          VERSION="${TAG#v}"
          helm package charts/laboratory --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Login to Docker Hub OCI registry
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Push chart
        run: helm push dist/laboratory-*.tgz oci://registry-1.docker.io/cybericebox
      - name: Attach chart to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/laboratory-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
