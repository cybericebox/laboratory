name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.2.0)
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

# Nothing here needs more than to read the repository; a job that does asks for it itself.
permissions:
  contents: read

jobs:
  images:
    name: image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            target: controller
            image: cybericebox/laboratory-controller
          - name: agent
            target: agent
            image: cybericebox/laboratory-agent
          - name: proxy
            target: proxy
            image: cybericebox/laboratory-proxy
          - name: node
            target: node
            image: cybericebox/laboratory-node
          - name: lab
            target: lab
            image: cybericebox/laboratory-lab
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image version
        id: ver
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "the tag $TAG is not a version (vX.Y.Z)"; exit 1;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # :latest only for a published release (never for a manual run of any tag)
          tags: |
            ${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ${{ github.event_name == 'release' && format('{0}:latest', matrix.image) || '' }}

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Package chart
        run: |
          VERSION="${TAG#v}"
          helm package charts/laboratory --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Login to Docker Hub OCI registry
        # the secrets reach the shell through the environment, never through the text of the command
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Push chart
        run: helm push dist/laboratory-*.tgz oci://registry-1.docker.io/cybericebox
      - name: Attach chart to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/laboratory-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
