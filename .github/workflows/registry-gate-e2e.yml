name: Registry gate E2E

# The whole pull path of the image cache on a kind node (Kubernetes 1.35): kubelet and containerd, the relay of a node over TLS, the
# registry gate and zot of the chart (cache on), two upstream registries (one open, one with Basic authentication). See
# hack/registry-gate-e2e/run.sh. Like the P0 probe it runs on its own branch and by hand.
on:
  push:
    branches: [feat/registry-gate]
    paths:
      - hack/registry-gate-e2e/**
      - internal/registrygate/**
      - internal/cmds/registrygated/**
      - internal/devicestate/forward*.go
      - charts/laboratory/templates/registry/**
      - .github/workflows/registry-gate-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: g1 g2 g3 g4 on kind 1.35
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install kind (a pinned version, verified against a checksum kept here)
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Login to Docker Hub (kind node, registry and httpd images)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Unit tests of the gate (with a real zot)
        run: |
          curl -fsSLo "$RUNNER_TEMP/zot" https://github.com/project-zot/zot/releases/download/v2.1.21/zot-linux-amd64
          chmod +x "$RUNNER_TEMP/zot"
          ZOT_BIN="$RUNNER_TEMP/zot" go test -race ./internal/registrygate/... ./internal/devicestate/...
      - name: Run g1 g2 g3 g4
        env:
          E2E_OUT: ${{ runner.temp }}/gate-e2e
          E2E_KEEP: "1"
        run: hack/registry-gate-e2e/run.sh
      - name: Evidence (gate, relay, upstream and kubelet logs, metrics)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-gate-e2e
          path: ${{ runner.temp }}/gate-e2e
          if-no-files-found: warn
