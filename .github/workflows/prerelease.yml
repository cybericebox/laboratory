name: Pre-release

# A push to main (the merge of develop) publishes vX.Y.Z-rc.N and creates the GitHub pre-release.
# The version comes from the last release tag: patch by default, minor when a PR merged since the last release has the
# "minor" label, major only through a manual run. Nothing is published when the tree is unchanged since the last rc.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      major:
        description: Bump the major version
        type: boolean
        default: false

concurrency:
  group: prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Next version
        id: v
        env:
          BUMP: ${{ inputs.major && 'major' || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci.sh next-version

  test:
    name: Test
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/test.yml

  image:
    name: Image ${{ matrix.name }}
    needs: [version, test]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            image: cybericebox/laboratory-controller
            target: controller
          - name: agent
            image: cybericebox/laboratory-agent
            target: agent
          - name: proxy
            image: cybericebox/laboratory-proxy
            target: proxy
          - name: node
            image: cybericebox/laboratory-node
            target: node
          - name: lab
            image: cybericebox/laboratory-lab
            target: lab
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          tags: ${{ matrix.image }}:${{ needs.version.outputs.tag }}

  release:
    name: GitHub pre-release
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" --generate-notes
