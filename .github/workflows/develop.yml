name: Publish develop

# A merge into develop publishes sha-<7> only (no moving develop tag). The build reads the registry cache
# written by the PR check. A newer merge cancels an unfinished older one; build the older commit with "Build image".
on:
  push:
    branches: [ develop ]

concurrency:
  group: publish-develop
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    # Cache imports must finish before a release retires their manifests.
    concurrency:
      group: docker-hub-cache-maintenance
      cancel-in-progress: false
      queue: max
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            image: cybericebox/laboratory-controller
            target: controller
          - name: agent
            image: cybericebox/laboratory-agent
            target: agent
          - name: proxy
            image: cybericebox/laboratory-proxy
            target: proxy
          - name: node
            image: cybericebox/laboratory-node
            target: node
          - name: lab
            image: cybericebox/laboratory-lab
            target: lab
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tag
        id: meta
        run: echo "sha=$(.github/scripts/ci.sh sha-tag "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-develop
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.sha }}
