name: Backport

# After every push to a release line (a merged pull request), open a pull request with the same change into develop (a cherry-pick), so a
# fix never exists only in the line. A change that does not apply cleanly gets an issue that says so (.github/scripts/backport.sh).
#
# The branches require signed commits and a commit made with git on a runner is not signed, so the commit is made through the GitHub API
# (GraphQL createCommitOnBranch, which GitHub signs and shows as verified): git only computes the cherry-pick in a scratch clone, and
# nothing made by git is pushed (.github/scripts/backport_commit.py). A change the API cannot express (a file mode, a symlink, a
# submodule, too large) gets an issue instead.
# It uses only the token of the job (contents, pull requests and issues write, in this job alone): no other credential, no environment.
# Events made with GITHUB_TOKEN do not start workflows, except workflow_dispatch and repository_dispatch; a pull request it opens does
# start a pull_request run of check.yml, but in an "approval-required" state: the owner presses "Approve workflows to run" on the pull
# request (or closes and reopens it). The check cannot be started by a dispatch instead: a check of a workflow_dispatch run is not
# evaluated for a pull request, so it would not satisfy the required "Check passed".
# The setting "Allow GitHub Actions to create and approve pull requests" is required.
# The job runs only the code that is already merged into the line, never code of a pull request.
on:
  push:
    branches: [ 'release/*' ]

concurrency:
  group: backport-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  backport:
    name: Pull request into develop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Cherry-pick into develop
        env:
          GH_TOKEN: ${{ github.token }}
          LINE_BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/backport.sh
