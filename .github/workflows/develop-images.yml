name: Develop images

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

# Nothing here needs more than to read the repository; a job that does asks for it itself.
permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            target: controller
            image: cybericebox/laboratory-controller
          - name: agent
            target: agent
            image: cybericebox/laboratory-agent
          - name: proxy
            target: proxy
            image: cybericebox/laboratory-proxy
          - name: node
            target: node
            image: cybericebox/laboratory-node
          - name: lab
            target: lab
            image: cybericebox/laboratory-lab
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          echo "sha=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Build and push docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          tags: |
            ${{ matrix.image }}:develop
            ${{ matrix.image }}:${{ steps.meta.outputs.sha }}
