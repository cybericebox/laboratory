name: Retention

# The retention policy (CONTRIBUTING.md, "Retention") on its own; Promote runs it right after a release. It deletes
#   - the candidates (vX.Y.Z-rc.N) of every released version: images, chart, pre-release page and git tag;
#   - the final releases that left the window (the newest line keeps every patch, each of the 10 previous lines its newest patch; lines
#     below 1.10 are the history from before the policy and are never touched): images, chart and release page, never the git tag;
#   - the dev images (sha-<7>) of commits that are part of main, and the registry layer caches.
# The list is printed first. dry_run (the default for a manual run) deletes nothing.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      strict:
        description: Fail the run when a deletion failed or was refused (false after a promote, the release is already public)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the list only, delete nothing
        type: boolean
        default: true
      strict:
        description: Fail the run when a deletion failed or was refused
        type: boolean
        default: true

concurrency:
  group: retention
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  retention:
    name: Apply the retention policy
    runs-on: ubuntu-latest
    environment: release # the Docker Hub credentials: deployment branch main only
    permissions:
      contents: write
    steps:
      - name: Runs from main only
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" == refs/heads/main ]] || { echo "::error::Retention runs from main (got $REF): its scripts are the trusted ones"; exit 1; }
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply
        env:
          IMAGES: cybericebox/laboratory-controller cybericebox/laboratory-agent cybericebox/laboratory-proxy cybericebox/laboratory-node cybericebox/laboratory-lab
          CHART_REPO: cybericebox/laboratory
          PRUNE_FROM: "1.10"
          PRUNE_KEEP: "10"
          DRY_RUN: ${{ inputs.dry_run }}
          STRICT: ${{ inputs.strict }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/scripts/retention.sh
