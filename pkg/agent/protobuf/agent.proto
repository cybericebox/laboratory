syntax = "proto3";
package labmanager;
option go_package = "github.com/cybericebox/laboratory/pkg/agent/protobuf";

service LabManager {
  rpc Ping(Empty) returns (Empty) {}

  // The CRUD API is plural-only: every call works on a list, one object is a list of one.
  // The agent is a thin layer: it writes custom resources (and the write-only per-device
  // Secrets); scheduling and the work itself are the operator's job.
  //
  // Mutating calls (Create*, Update*, Delete*, SetLabGroupAccess, the device calls) answer
  // with one ItemResult per item, in the order of the request (selector calls: sorted by
  // reference); one failing item never fails the call. A call fails as a whole (INVALID_ARGUMENT)
  // only for a malformed request: more than 5000 items, a reserved or invalid label, an
  // invalid selector, a duplicate variant id. Objects are referenced by LabGroup name
  // and object name, never by namespace; the agent resolves the namespace.
  //
  // Selector calls (List, Update, Delete, device calls): a Kubernetes label selector or explicit
  // items, never both. Update, Delete and the device calls with a selector REQUIRE a
  // non-empty selector and take an optional expected_count: when MORE objects match, nothing
  // is done and the call fails with FAILED_PRECONDITION (reason COUNT_MISMATCH, the actual
  // count in the error metadata "actual"). A selector may match at most 5000 objects.

  // LabGroups.
  rpc CreateLabGroups(CreateLabGroupsRequest) returns (BatchResult) {}
  rpc ListLabGroups(ListRequest) returns (LabGroupList) {}
  rpc UpdateLabGroups(UpdateLabGroupsRequest) returns (BatchResult) {}
  rpc DeleteLabGroups(DeleteRequest) returns (BatchResult) {}

  // LabGroupClients (VPN clients). The CreateLabGroupClients result carries the finished
  // WireGuard config with the private key the agent generated; it is never available again.
  rpc CreateLabGroupClients(CreateLabGroupClientsRequest) returns (CreateLabGroupClientsResponse) {}
  rpc ListLabGroupClients(ListRequest) returns (LabGroupClientList) {}
  rpc UpdateLabGroupClients(UpdateLabGroupClientsRequest) returns (BatchResult) {}
  rpc DeleteLabGroupClients(DeleteRequest) returns (BatchResult) {}

  // SetLabGroupAccess atomically replaces the complete client-to-lab access policy of
  // every listed LabGroup. Unlisted existing clients receive no labs.
  rpc SetLabGroupAccess(SetLabGroupAccessRequest) returns (BatchResult) {}

  // Labs. A variant (the lab spec and its common variables) is sent once, the items
  // refer to it by id.
  rpc CreateLabs(CreateLabsRequest) returns (BatchResult) {}
  rpc ListLabs(ListRequest) returns (LabList) {}
  rpc UpdateLabs(UpdateLabsRequest) returns (BatchResult) {}
  rpc DeleteLabs(DeleteRequest) returns (BatchResult) {}

  // Monitoring is a server-push stream. Every subscription starts with a
  // complete snapshot; subsequent messages are sequenced deltas or heartbeats.
  rpc Monitoring(MonitoringRequest) returns (stream MonitoringUpdate) {}

  rpc GetCapacity(Empty) returns (CapacityResponse) {}

  // PrewarmImages makes the platform image cache (zot) fetch images from their upstream
  // registries BEFORE labs need them, so a burst of labs pulls only from the cache. It is
  // asynchronous and idempotent: each call returns the current state of the requested images
  // (starting the work for new ones, retrying FAILED ones, refreshing DONE ones that are
  // older than the agent's staleness bound); an empty list returns every image the agent
  // knows. Poll by repeating the call. Fails with FailedPrecondition when the cache is off.
  rpc PrewarmImages(PrewarmImagesRequest) returns (PrewarmImagesResult) {}

  // Device calls. Targets are explicit (lab_group, lab, device) items or a selector over
  // LABS plus a device name. The state calls (reset, rescue) only make sense for devices
  // with snapshot-backed state (LabDeviceStatus.snapshot is set); the backend restricts
  // them to organizers and admins.
  //
  // ResetDevices discards the devices' snapshots and restarts them from their base image.
  rpc ResetDevices(DevicesRequest) returns (BatchResult) {}
  // RescueDevices starts the devices from their latest snapshot with a shell instead of
  // the image entrypoint (enable=true), or back to normal (enable=false), to repair a
  // configuration that makes the service crash.
  rpc RescueDevices(RescueDevicesRequest) returns (BatchResult) {}
  // RetryDevices asks the operator to retry the pod of a device whose start failed (the
  // operator gave up after its retries); every call is a new retry.
  rpc RetryDevices(DevicesRequest) returns (BatchResult) {}
}

message Empty {}

// ---- common shapes -------------------------------------------------------------------

// ItemRef names one object. A LabGroup (and the access policy of one) is identified by
// name alone; a LabGroupClient or Lab by lab_group + name; a Device by lab_group + lab +
// name (the device name).
message ItemRef {
  string lab_group = 1;
  string lab = 2;
  string name = 3;
}

enum ItemState {
  ITEM_STATE_UNSPECIFIED = 0;
  ITEM_STATE_CREATED = 1;
  ITEM_STATE_EXISTS = 2;     // already there with the same spec and labels
  ITEM_STATE_UPDATED = 3;    // changed (an existing object that got the labels it lacked), or the request was handed to the operator (device calls)
  ITEM_STATE_DELETED = 4;    // deletion started (it finishes asynchronously, finalizers)
  ITEM_STATE_NOT_FOUND = 5;
  ITEM_STATE_FAILED = 6;     // see error; for an existing name with a different spec as well
}

message ItemResult {
  ItemRef ref = 1;
  ItemState state = 2;
  string error = 3;
  // True when the failure is worth repeating (the object is still being deleted, the
  // LabGroup namespace is not ready yet).
  bool retryable = 4;
}

message BatchResult {repeated ItemResult results = 1;}

// ListRequest: names (items) or a selector, never both; none = everything. lab_group
// narrows a listing of namespaced kinds to one LabGroup.
message ListRequest {
  string selector = 1;
  repeated ItemRef items = 2;
  string lab_group = 3;
}

// Selector picks objects by Kubernetes label selector ("a=b,c in (d,e),!f"). It must be
// non-empty. lab_group narrows namespaced kinds to one LabGroup.
message Selector {
  string selector = 1;
  string lab_group = 2;
  // The upper bound of matching objects; more matches fail the call (see the service notes).
  optional int64 expected_count = 3;
}

message DeleteRequest {
  Selector by_selector = 1;
  repeated ItemRef items = 2;
}

// LabelChanges: set labels (a set label overrides an existing one) and remove labels.
// A key in both is invalid.
message LabelChanges {
  map<string, string> set = 1;
  repeated string remove = 2;
}

message StringList {repeated string values = 1;}

// Labels of every mutating call: request-level labels apply to every item, the item's
// own labels win on a conflict. Keys and values must be valid Kubernetes labels; the
// prefix laboratory.cybericebox.com/ is reserved for the platform and rejected. Labels
// go onto the custom resource; a Lab's labels are copied to its Devices and pods when those
// are created.
//
// Scheduling parameters are NOT labels but fields: deploy_group (any string, e.g. a UUID)
// and deploy_after (deploy groups this one waits for). The agent converts them to
// label-safe keys (base36 of a UUID, a hash of anything else) and writes the operator-internal
// label laboratory.cybericebox.com/deploy-group and the annotation
// laboratory.cybericebox.com/deploy-after (comma-separated keys).

// ---- LabGroups ----------------------------------------------------------------------

message LabGroupItem {
  string name = 1;
  map<string, string> labels = 2;
  string deploy_group = 3;
  repeated string deploy_after = 4;
  bool suspended = 5;
  bool vpn_disabled = 6;
  bool probe_while_suspended = 7;
}
message CreateLabGroupsRequest {
  map<string, string> labels = 1;
  repeated LabGroupItem items = 2;
}

message LabGroupChanges {
  LabelChanges labels = 1;
  optional bool suspended = 2;
  optional bool vpn_disabled = 3;
  optional bool probe_while_suspended = 4;
}
message UpdateLabGroupItem {
  string name = 1;
  LabGroupChanges changes = 2;
}
// Selector or items. changes apply to every target; an item's own changes win.
message UpdateLabGroupsRequest {
  Selector by_selector = 1;
  LabGroupChanges changes = 2;
  repeated UpdateLabGroupItem items = 3;
}

// ---- LabGroupClients ----------------------------------------------------------------

message LabGroupClientItem {
  string lab_group = 1;
  string name = 2;
  map<string, string> labels = 3;
}
message CreateLabGroupClientsRequest {
  map<string, string> labels = 1;
  repeated LabGroupClientItem items = 2;
}
// client is set for CREATED (with the finished WireGuard config) and EXISTS (the
// placeholder config: the private key exists only in the answer of the create call).
message LabGroupClientResult {
  ItemResult result = 1;
  LabGroupClient client = 2;
}
message CreateLabGroupClientsResponse {repeated LabGroupClientResult results = 1;}

message UpdateLabGroupClientItem {
  string lab_group = 1;
  string name = 2;
  LabelChanges labels = 3;
}
message UpdateLabGroupClientsRequest {
  Selector by_selector = 1;
  LabelChanges labels = 2;
  repeated UpdateLabGroupClientItem items = 3;
}

message SetLabGroupAccessRequest {
  // Added to the labels of every policy (a policy also gets the labels of its LabGroup).
  map<string, string> labels = 1;
  repeated LabGroupAccessPolicy policies = 2;
}

// ---- Labs ---------------------------------------------------------------------------

// LabVariant is sent once per request however many labs use it. Device variables are
// secrets only: spec_json must not carry env or flags on devices (rejected).
message LabVariant {
  string variant_id = 1;
  bytes spec_json = 2;            // Lab.spec serialized; the agent passes it through
  repeated DeviceEnv env = 3;     // variables common to every lab of the variant
}
message LabItem {
  string lab_group = 1;
  string name = 2;
  string variant_id = 3;
  // This lab's own variables; they override the variant's by device and variable name.
  repeated DeviceEnv env = 4;
  map<string, string> labels = 5;
  string deploy_group = 6;
  repeated string deploy_after = 7;
}
message CreateLabsRequest {
  map<string, string> labels = 1;
  repeated LabVariant variants = 2;
  repeated LabItem items = 3;
}

// LabChanges: labels, and env = rewrite the write-only Secret of every listed device
// with exactly these variables (no variables = remove the Secret); unlisted devices are
// untouched.
message LabChanges {
  LabelChanges labels = 1;
  repeated DeviceEnv env = 2;
}
message UpdateLabItem {
  string lab_group = 1;
  string name = 2;
  LabChanges changes = 3;
}
message UpdateLabsRequest {
  Selector by_selector = 1;
  LabChanges changes = 2;
  repeated UpdateLabItem items = 3;
}

// ---- Devices ------------------------------------------------------------------------

// DeviceSelector selects LABS by label and names the device inside each of them.
message DeviceSelector {
  string selector = 1;
  string lab_group = 2;
  string device = 3;
  optional int64 expected_count = 4;   // of labs
}
// items (lab_group, lab, name = device) or by_selector, never both.
message DevicesRequest {
  repeated ItemRef items = 1;
  DeviceSelector by_selector = 2;
}
message RescueDevicesRequest {
  DevicesRequest devices = 1;
  bool enable = 2;
}

message LabGroup {
  string name = 1;
  LabGroupStatus status = 2;
  // Kubernetes labels of the LabGroup (the Monitoring selector matches against them).
  map<string, string> labels = 10;
}
message LabGroupStatus {
  string phase = 1;
  string namespace = 2;
  bool vpn_registered = 3;
  bool suspended = 4;
  string vpn_client_subnet = 5;
  // VPN or gateway image that could not be pinned to a digest (pulled by tag); empty when fine.
  string image_warning = 6;
}
message LabGroupList {repeated LabGroup items = 1;}

message Lab {
  string namespace = 1;
  string name = 2;
  bytes spec_json = 3;   // Lab.spec serialized; agent is a thin wrapper, spec passes through
  LabStatus status = 4;
  reserved 5;   // was env: device variables are write-only and never read back
  // Populated only by monitoring so the backend can associate a namespaced
  // Lab record with its LabGroup without inferring it from a namespace.
  string lab_group_name = 6;
  // Kubernetes labels of the Lab.
  map<string, string> labels = 10;
}
// DeviceEnv carries the variables of one device. The agent materializes them into a
// write-only per-device Secret (the pod loads it via envFrom): they never land in the
// Lab/Device CR and are never read back.
message DeviceEnv {
  string device = 1;
  map<string, string> vars = 2;
}
message LabStatus {
  string phase = 1;
  string vpn_cidr = 2;
  string internet_cidr = 3;
  bool ready = 4;
  repeated string access_urls = 5;          // flat list of exposed URLs (kept for convenience)
  bool vpn_ready = 6;
  bool internet_ready = 7;
  repeated LabDeviceStatus devices = 8;      // per-device readiness
  repeated LabConnectionStatus connections = 9;  // per-connection readiness
  repeated LabAccessEntry access = 10;       // structured web-exposure entries
  // Launch queue state. Set by the operator's launch pacing; absent (nil)
  // for labs that were never queued. Numbers 20+ are reserved for launch pacing.
  LabQueueStatus queue = 20;
  // Image cache: the images of the lab that could not be pinned to a digest and
  // are pulled by tag; empty when all were pinned or the lab does not use the cache.
  string image_warning = 40;
}
// LabQueueStatus is the place of a Lab in the operator's launch queue. A lab is
// queued while LabStatus.phase is "Queued"; once admitted, position and length
// are 0 and reason is empty. The platform can show "in queue: position of length".
message LabQueueStatus {
  int32 position = 1;       // 1-based place in the queue, 0 = not queued
  int32 length = 2;         // queued labs at the time position was written
  // Why the queue does not admit the lab now: InFlightLimit | PreparingImages |
  // InsufficientResources | NoSchedulableNodes. Empty when not queued.
  string reason = 3;
  string launch_class = 4;  // resolved launch class (spec launchClass or topology hash)
  int64 admitted_at_unix_ms = 5;  // 0 = not admitted yet
}
message LabDeviceStatus {
	string name = 1;
	bool ready = 2;
	int64 cpu_millicores = 3;
	int64 memory_bytes = 4;
	bool usage_available = 5;
	int64 cpu_request_millicores = 6;
	int64 memory_request_bytes = 7;
	int64 cpu_limit_millicores = 8;
	int64 memory_limit_bytes = 9;
	string pod_phase = 10;
	string pod_reason = 11;
	int32 restart_count = 12;
	// Set only for a device with state persistence.
	DeviceSnapshotStatus snapshot = 30;
}
// DeviceSnapshotStatus is the state of a device's writable-layer snapshots.
message DeviceSnapshotStatus {
  int64 last_snapshot_unix_ms = 1;  // 0 = no snapshot yet
  int64 restored_unix_ms = 2;       // when the device was last started from a snapshot; 0 = never
  int64 size_bytes = 3;             // uncompressed size of the kept snapshot layers
  string warning = 4;               // quota exceeded or snapshot failing; the last good snapshot is kept
  bool rescue = 5;                  // the device runs in rescue mode
}
message LabConnectionStatus {
  string name = 1;
  bool ready = 2;
}
message LabAccessEntry {
  string device = 1;
  int32 port = 2;
  string protocol = 3;
  string url = 4;
}
message LabList {repeated Lab items = 1;}

message LabGroupClient {
  string namespace = 1;
  string name = 2;
  string public_key = 3;
  LabGroupClientStatus status = 4;
  // Populated only by monitoring; CRUD callers resolve group scope themselves.
  string lab_group_name = 5;
  // Kubernetes labels of the client.
  map<string, string> labels = 10;
}
message LabGroupClientStatus {
  reserved 2;   // was secret_ref (client Secret removed)
  string assigned_ip = 1;
  bool ready = 3;
  // Assembled WireGuard client config. In the CreateLabGroupClients answer the agent
  // fills in the real private key it generated; everywhere else it carries the
  // placeholder (the cluster never holds the private key).
  string config = 4;
  LabGroupClientStatistics statistics = 5;   // live WireGuard peer stats (bytes + handshake)
}
// LabGroupClientStatistics mirrors the CRD status the VPN server writes per peer.
// WireGuard natively exposes transfer bytes + last handshake only (no packet counts).
message LabGroupClientStatistics {
  int64 last_handshake_unix = 1;   // unix seconds; 0 = never handshaked
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
}
message LabGroupClientList {repeated LabGroupClient items = 1;}

message LabGroupAccessPolicy {
  // The agent resolves the namespace from this LabGroup, preventing a caller
  // from applying a policy to a namespace outside the group.
  string lab_group_name = 1;
	repeated LabGroupAccessRule rules = 2;
	LabGroupAccessPolicyStatus status = 3;
	// Populated only by monitoring; mutations resolve scope from LabGroup name.
	string namespace = 4;
  // Labels of the policy object. SetLabGroupAccess gives it the labels of its
  // LabGroup plus these, so a selector that matches a group matches its policy.
  map<string, string> labels = 10;
}
enum LabGroupAccessAction {
  LAB_GROUP_ACCESS_ACTION_UNSPECIFIED = 0;
  LAB_GROUP_ACCESS_ACTION_ALLOW = 1;
  LAB_GROUP_ACCESS_ACTION_DENY = 2;
}
message LabGroupAccessRule {
  LabGroupAccessAction action = 1;
  // Empty means every VPN client in the LabGroup.
  repeated string client_names = 2;
  // Empty means every Lab in the LabGroup.
  repeated string lab_names = 3;
}

message LabGroupAccessPolicyStatus {
	int64 observed_generation = 1;
	string state = 2;
	int64 applied_at_unix_ms = 3;
	string last_error = 4;
	repeated LabGroupAccessRuleStatistics rules = 5;
}
message LabGroupAccessRuleStatistics {
	string client_name = 1;
	string lab_name = 2;
	LabGroupAccessAction action = 3;
	int64 packets = 4;
	int64 bytes = 5;
	bool counter_reset = 6;
}

message MonitoringRequest {
  // The agent bounds this to protect the Kubernetes API from a too-fast caller. It is
  // the least time between two messages of this stream: changes in between are merged.
  int64 min_interval_ms = 1;
  // Resume: the last sequence the subscriber processed from the agent instance named in
  // agent_epoch. If that instance still holds the missed updates in its journal, they are
  // replayed (snapshot=false); otherwise a full snapshot (snapshot=true) is sent. 0 = no resume.
  int64 resume_after_sequence = 2;
  // Kubernetes label selector ("a=b,c in (d,e),!f"). Only objects of the kinds LabGroup, Lab,
  // LabGroupClient and access policy whose labels match are sent, in the snapshot and in the
  // updates, deletions included. A traffic report is cut down to the touches of matching labs.
  // Capacity is always sent. Empty = everything. An invalid selector fails the call.
  string selector = 3;
  // The agent_epoch of the updates resume_after_sequence belongs to.
  string agent_epoch = 4;
}

message MonitoringDeletedKey {
  string kind = 1;
  string lab_group_name = 2;
  string namespace = 3;
  string name = 4;
}

message MonitoringUpdate {
  string agent_id = 1;
  int64 sequence = 2;
  int64 observed_at_unix_ms = 3;
  uint32 schema_version = 4;
  bool snapshot = 5;
  repeated LabGroup groups = 10;
  repeated Lab labs = 11;
  repeated LabGroupClient clients = 12;
	repeated MonitoringDeletedKey deleted_keys = 13;
	repeated LabGroupAccessPolicy policies = 14;
  // Cluster-wide capacity is not tied to any LabGroup. It lets the platform
  // administrator see actual headroom even when no event is currently active.
  CapacityResponse capacity = 15;
  // Lab traffic accounting: cumulative aggregates relayed from LabTrafficReport
  // resources. State records like clients and policies, so a fresh snapshot
  // after a reconnect re-sends them; consumers apply them as cumulative values.
  repeated TrafficReport traffic = 16;
  // Identifies this agent PROCESS. Sequences are monotonic within one epoch only; a changed
  // epoch means the agent restarted and a resume is impossible (a snapshot follows).
  string agent_epoch = 20;
}

// TrafficReport is the state of one collector (the VPN pod of a group, or one
// proxy replica). It carries counters and times only: never a user address,
// path, header or payload.
message TrafficReport {
  string lab_group_name = 1;
  string namespace = 2;
  string source = 3;   // name of the LabTrafficReport object
  string kind = 4;     // "vpn" | "proxy"
  string instance = 5; // writing pod
  // Changes on every collector restart; the ledger is cumulative within one boot.
  string boot_id = 6;
  // The span the collector actually observed. Absence of a touch proves
  // nothing outside this span.
  int64 covered_from_unix_ms = 7;
  int64 covered_to_unix_ms = 8;
  bool partial = 9;
  bool truncated = 10;
  repeated TrafficTouch ledger = 11;
}

// TrafficTouch is one cumulative aggregate of a subject against a lab target.
message TrafficTouch {
  string subject = 1;  // LabGroupClient name (p-<user uuid>) for vpn, user id for proxy
  string lab_name = 2;
  string device = 3;
  string dst_ip = 4;   // lab-internal address only
  string proto = 5;
  uint32 dst_port = 6;
  int64 attempts = 7;  // new connections (vpn) or requests (proxy)
  int64 packets_out = 8;
  int64 packets_in = 9;
  int64 bytes_out = 10;
  int64 bytes_in = 11;
  int64 first_seen_unix_ms = 12;
  int64 last_seen_unix_ms = 13;
  int64 first_responded_unix_ms = 14; // 0 = the lab never answered
}

// NodeCapacity reports a node's allocatable resources and how much is already
// requested by scheduled pods, so a caller can compute remaining headroom.
message NodeCapacity {
  string name = 1;
  int64 allocatable_cpu_millicores = 2;
  int64 allocatable_memory_bytes = 3;
  int64 requested_cpu_millicores = 4;   // sum of scheduled pod container requests
  int64 requested_memory_bytes = 5;
}
// CapacityResponse aggregates per-node capacity plus cluster totals. Remaining
// headroom = allocatable - requested; divide by a lab's summed device requests
// to estimate how many more labs fit.
message CapacityResponse {
  repeated NodeCapacity nodes = 1;
  int64 allocatable_cpu_millicores = 2;
  int64 allocatable_memory_bytes = 3;
  int64 requested_cpu_millicores = 4;
  int64 requested_memory_bytes = 5;
}

message PrewarmImagesRequest {
  // Image references as written in a lab spec ("nginx:1.25", "ghcr.io/o/app@sha256:...").
  repeated string images = 1;
}

enum PrewarmState {
  PREWARM_STATE_UNSPECIFIED = 0;
  PREWARM_STATE_QUEUED = 1;   // waiting for a free slot (the agent bounds the concurrency)
  PREWARM_STATE_WARMING = 2;  // the cache is fetching it
  PREWARM_STATE_DONE = 3;     // the manifest and every blob are stored in the cache
  PREWARM_STATE_FAILED = 4;   // see error; a repeated call retries
  PREWARM_STATE_SKIPPED = 5;  // the image's registry is not served by the cache: nodes pull it directly
}

message PrewarmImageStatus {
  string image = 1;
  PrewarmState state = 2;
  string error = 3;
  // The digest the cache holds: the manifest of the cluster's node platform for a
  // single-architecture cluster, the index otherwise (what the operator pins labs to).
  string digest = 4;
  int64 updated_unix_ms = 5;
}

message PrewarmImagesResult {
  repeated PrewarmImageStatus images = 1;
}
