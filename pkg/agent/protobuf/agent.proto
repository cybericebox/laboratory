syntax = "proto3";
package labmanager;
option go_package = "github.com/cybericebox/laboratory/pkg/agent/protobuf";

service LabManager {
  rpc Ping(Empty) returns (Empty) {}

  rpc CreateLabGroup(LabGroup) returns (LabGroup) {}
  rpc GetLabGroup(IDRequest) returns (LabGroup) {}
  rpc ListLabGroups(Empty) returns (LabGroupList) {}
  rpc UpdateLabGroup(LabGroup) returns (LabGroup) {}
  rpc DeleteLabGroup(IDRequest) returns (Empty) {}

  rpc CreateLab(Lab) returns (Lab) {}
  rpc GetLab(NamespacedIDRequest) returns (Lab) {}
  rpc ListLabs(NamespaceRequest) returns (LabList) {}
  rpc UpdateLab(Lab) returns (Lab) {}
  rpc DeleteLab(NamespacedIDRequest) returns (Empty) {}

  rpc CreateLabGroupClient(LabGroupClient) returns (LabGroupClient) {}
  rpc GetLabGroupClient(NamespacedIDRequest) returns (LabGroupClient) {}
  rpc ListLabGroupClients(NamespaceRequest) returns (LabGroupClientList) {}
  rpc DeleteLabGroupClient(NamespacedIDRequest) returns (Empty) {}

  rpc Monitoring(stream Empty) returns (stream MonitoringUpdate) {}
}

message Empty {}
message IDRequest {string name = 1;}
message NamespaceRequest {string namespace = 1;}
message NamespacedIDRequest {string namespace = 1; string name = 2;}

message LabGroup {
  string name = 1;
  LabGroupStatus status = 2;
}
message LabGroupStatus {
  string phase = 1;
  string namespace = 2;
  bool vpn_registered = 3;
}
message LabGroupList {repeated LabGroup items = 1;}

message Lab {
  string namespace = 1;
  string name = 2;
  bytes spec_json = 3;   // Lab.spec serialized; agent is a thin wrapper, spec passes through
  LabStatus status = 4;
}
message LabStatus {
  string phase = 1;
  string vpn_cidr = 2;
  string internet_cidr = 3;
  bool ready = 4;
  repeated string access_urls = 5;          // flat list of exposed URLs (kept for convenience)
  bool vpn_ready = 6;
  bool internet_ready = 7;
  repeated LabDeviceStatus devices = 8;      // per-device readiness
  repeated LabConnectionStatus connections = 9;  // per-connection readiness
  repeated LabAccessEntry access = 10;       // structured web-exposure entries
}
message LabDeviceStatus {
  string name = 1;
  bool ready = 2;
  int64 cpu_millicores = 3;   // live CPU usage in millicores (0 if metrics unavailable)
  int64 memory_bytes = 4;     // live memory usage in bytes (0 if metrics unavailable)
}
message LabConnectionStatus {
  string name = 1;
  bool ready = 2;
}
message LabAccessEntry {
  string device = 1;
  int32 port = 2;
  string protocol = 3;
  string url = 4;
}
message LabList {repeated Lab items = 1;}

message LabGroupClient {
  string namespace = 1;
  string name = 2;
  string public_key = 3;
  LabGroupClientStatus status = 4;
}
message LabGroupClientStatus {
  string assigned_ip = 1;
  string secret_ref = 2;
  bool ready = 3;
  bytes wg_conf = 4;   // populated on Get/Create from the client Secret
  LabGroupClientStatistics statistics = 5;   // live WireGuard peer stats (bytes + handshake)
}
// LabGroupClientStatistics mirrors the CRD status the VPN server writes per peer.
// WireGuard natively exposes transfer bytes + last handshake only (no packet counts).
message LabGroupClientStatistics {
  int64 last_handshake_unix = 1;   // unix seconds; 0 = never handshaked
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
}
message LabGroupClientList {repeated LabGroupClient items = 1;}

message MonitoringUpdate {
  repeated LabGroup groups = 1;
  repeated Lab labs = 2;
  repeated LabGroupClient clients = 3;
}
