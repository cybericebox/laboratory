# mise: the pinned tools of this repository and its commands. One entry point for developers, agents and CI.
#   mise install            install exactly these tool versions (once, and after this file changes)
#   mise tasks              list the commands
#   mise run <task> ...     run one; extra arguments go to the command
# The Makefile stays the implementation (the kubebuilder layout, about 80 targets). The tasks below are the common entry points;
# every other target runs as `mise run make <target> [VAR=value ...]`, so that it sees the pinned tools.

[tools]
go = "1.27.1"            # the same as the toolchain line of go.mod
kind = "0.33.0"
kubectl = "1.36.4"
helm = "4.3.0"           # the chart tests render the chart with it
kustomize = "5.8.2"
protoc = "35.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
gh = "2.104.0"           # dev-push
"github:mokevnin/heavy" = "0.1.2"  # a machine-wide semaphore: heavy commands of every checkout and agent take turns (heavy --status)
# Built with the pinned Go, not downloaded: a tool built by an older Go cannot parse the newer standard library.
# golangci-lint stays here and is not a go.mod tool: its authors advise against making it a module dependency (it would pull its
# whole dependency tree into go.mod). The Go tools of the module (controller-gen, setup-envtest, bpf2go) are tool directives of go.mod.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.14.0"

# The registry of the chart (the same version as registry.image in charts/laboratory/values.yaml): the registry gate tests run
# against the real binary (ZOT_BIN, set by the test task).
[tools."github:project-zot/zot"]
version = "2.1.21"
asset_pattern = "zot-{{os(macos='darwin')}}-{{arch(x64='amd64')}}"
bin = "zot"

[env]
# This module is built on its own: a go.work of a parent directory (the daemon's local workspace) must not change what it resolves.
GOWORK = "off"

[tasks.cache-guard]
hide = true
description = "Local caches stay under a size limit (the workspace script of infrastructure; does nothing in CI or without it)"
run = 'd="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"; for up in .. ../..; do g="$d/$up/infrastructure/scripts/cache-guard.sh"; [ -x "$g" ] && break; done; if [ -z "${CI:-}" ] && [ -x "$g" ]; then "$g"; fi'

[tasks.make]
description = "Any Makefile target with the pinned tools. Usage: mise run make <target> [VAR=value ...]; mise run make help lists them"
run = "make"

[tasks.build]
description = "Generate, vet and build the manager binary"
depends = ["cache-guard"]
run = "heavy -- make build"

[tasks.generate]
description = "Regenerate everything generated: CRDs and RBAC (and the chart's copies), deepcopy, the API clients, the gRPC code"
run = [
  "make manifests generate generate-api",
  { task = "proto" },
]

[tasks.generate-check]
description = "Regenerate everything and fail when that changes the tree (git status --porcelain must be empty; commit first what you changed)"
run = '''
mise run generate
out="$(git status --porcelain)"
if [ -n "$out" ]; then
  echo "generated files are out of date or the tree is not clean; run 'mise run generate' and commit:" >&2
  echo "$out" >&2
  exit 1
fi
'''

[tasks.proto]
description = "Regenerate the Go code of the gRPC contracts (agent.proto, node_agent.proto)"
run = [
  "protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative pkg/agent/protobuf/agent.proto",
  "protoc --proto_path=pkg/rpc/node/v1 --go_out=pkg/rpc/node/v1 --go_opt=paths=source_relative --go-grpc_out=pkg/rpc/node/v1 --go-grpc_opt=paths=source_relative node_agent.proto",
]

[tasks.lint]
description = "golangci-lint, for Linux as in CI (on macOS the Linux-only files would be left out and their helpers reported unused)"
depends = ["cache-guard"]
env = { GOOS = "linux" }
run = "heavy -- make lint"

[tasks.test]
description = "Unit and envtest tests (everything but e2e); the registry gate tests run against the real zot"
depends = ["cache-guard"]
run = 'ZOT_BIN="$(command -v zot)" heavy -- make test'

[tasks.test-netns]
description = "The real-iptables tests in network namespaces (Docker, privileged)"
run = "heavy -- make test-netns"

[tasks.test-bpf]
description = "The eBPF tests of the WireGuard demux fast path (Docker, privileged)"
run = "heavy -- make test-bpf"

[tasks.cluster-up]
description = "Create the kind cluster of the e2e tests (1 control plane + 2 lab workers)"
run = "make cluster-up KIND_CLUSTER_NAME=kind"

[tasks.cluster-down]
description = "Delete the kind cluster of the e2e tests"
run = "make cluster-down KIND_CLUSTER_NAME=kind"

[tasks.e2e]
description = "The e2e tests on the kind cluster (mise run cluster-up first)"
depends = ["cache-guard"]
run = "heavy -- make test-e2e"

[tasks.check]
description = "What the CI check runs without Docker: generate-check, lint and test"
run = [{ task = "generate-check" }, { task = "lint" }, { task = "test" }]

# Branch cycle (scripts/dev.sh, the same in every repository), see CONTRIBUTING.md.
[tasks.dev-start]
description = "feature/<name> from the fresh develop. Usage: mise run dev-start <name>"
run = "scripts/dev.sh start"

[tasks.dev-push]
description = "Push, open or update the PR into develop, auto-merge when green (MINOR=1 labels it minor)"
run = "scripts/dev.sh push"

[tasks.dev-done]
description = "Back to develop, pull, delete the merged local branch"
run = "scripts/dev.sh done"
