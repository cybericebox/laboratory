# mise: the pinned tools of this repository and its commands. One entry point for developers, agents and CI.
#   mise install            install exactly these tool versions (once, and after this file changes)
#   mise tasks              list the commands
#   mise run <task> ...     run one; extra arguments go to the command
# Short commands are tasks below; longer ones are executable files under mise-tasks/ (a subdirectory is a group: image/build is image:build).
# Settings that were make variables are environment variables with defaults, described in the description of the task that reads them.

[tools]
gitleaks = "8.30.1"   # lint:leaks: the secret scan of the whole history (.gitleaks.toml)
actionlint = "1.7.12"   # lint:leaks: the GitHub workflows
shellcheck = "0.11.0"   # actionlint checks the run: scripts with it
go = "1.27.4"            # the same as the toolchain line of go.mod
kind = "0.33.0"
kubectl = "1.36.4"
helm = "4.3.0"           # the chart tests render the chart with it
kustomize = "5.8.2"
protoc = "35.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
gh = "2.104.0"           # dev-push
python = "3.14.10"       # the release helpers of .github/scripts (standard library only)
"github:mokevnin/heavy" = "0.1.2"  # a machine-wide semaphore: heavy commands of every checkout and agent take turns (heavy --status)
# Built with the pinned Go, not downloaded: a tool built by an older Go cannot parse the newer standard library.
# golangci-lint stays here and is not a go.mod tool: its authors advise against making it a module dependency (it would pull its
# whole dependency tree into go.mod). The Go tools of the module (controller-gen, setup-envtest, bpf2go) are tool directives of go.mod.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.14.0"

# The registry of the chart (the same version as registry.image in charts/laboratory/values.yaml): the registry gate tests run
# against the real binary (ZOT_BIN, set by the test task).
[tools."github:project-zot/zot"]
version = "2.1.21"
asset_pattern = "zot-{{os(macos='darwin')}}-{{arch(x64='amd64')}}"
bin = "zot"

[env]
# This module is built on its own: a go.work of a parent directory (the local workspace of the platform backend) must not change what it resolves.
GOWORK = "off"

[tasks.cache-guard]
hide = true
description = "Local caches stay under a size limit (the workspace script of infrastructure; does nothing in CI or without it)"
run = 'd="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"; for up in .. ../..; do g="$d/$up/infrastructure/scripts/cache-guard.sh"; [ -x "$g" ] && break; done; if [ -z "${CI:-}" ] && [ -x "$g" ]; then "$g"; fi'

[tasks.prepare]
hide = true
description = "What build, test, run and e2e start with, in this order: CRDs and RBAC, deepcopy, go fmt, go vet"
run = [{ task = "generate:manifests" }, { task = "generate:deepcopy" }, { task = "fmt" }, { task = "vet" }]

[tasks.fmt]
description = "go fmt"
run = "go fmt ./..."

[tasks.vet]
description = "go vet"
run = "heavy -- go vet ./..."

[tasks.build]
description = "Generate, vet and build the manager binary into bin/manager"
depends = ["cache-guard", "prepare"]
run = "heavy -- go build -o bin/manager ./cmd/manager"

[tasks.run]
description = "Run the operator from this machine against the current kubectl context (one manager, no admission policies of the chart to require)"
depends = ["prepare"]
env = { OPERATOR_REQUIRE_ADMISSION_POLICY = "false" }
run = "go run ./cmd/manager --leader-elect=false"

[tasks.generate-bpf]
description = "Regenerate the eBPF objects of the WireGuard demux fast path (Docker; clang and libbpf in the container)"
run = "hack/generate-bpf.sh"

[tasks."kind-demux:up"]
description = "Create the demux kind cluster (icebox-demux, Cilium 1.20.2, no kube-proxy) with the CRDs"
run = "hack/kind-demux/up.sh"

[tasks."kind-demux:down"]
description = "Delete the demux kind cluster and its client containers"
run = "hack/kind-demux/down.sh"

[tasks.generate]
description = "Regenerate everything generated: CRDs and RBAC (and the chart's copies), deepcopy, the API clients, the gRPC code"
run = [
  { task = "generate:manifests" },
  { task = "generate:deepcopy" },
  { task = "generate:clients" },
  { task = "proto" },
]

[tasks.generate-check]
description = "Regenerate everything and fail when that changes the tree (git status --porcelain must be empty; commit first what you changed)"
run = '''
mise run generate
out="$(git status --porcelain)"
if [ -n "$out" ]; then
  echo "generated files are out of date or the tree is not clean; run 'mise run generate' and commit:" >&2
  echo "$out" >&2
  exit 1
fi
'''

[tasks.proto]
description = "Regenerate the Go code of the gRPC contracts (agent.proto, node_agent.proto)"
run = [
  "protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative pkg/agent/protobuf/agent.proto",
  "protoc --proto_path=pkg/rpc/node/v1 --go_out=pkg/rpc/node/v1 --go_opt=paths=source_relative --go-grpc_out=pkg/rpc/node/v1 --go-grpc_opt=paths=source_relative node_agent.proto",
]

[tasks."lint:leaks"]
description = "gitleaks over the whole history (.gitleaks.toml) and actionlint over the workflows"
run = ["gitleaks git --redact --no-banner --log-level warn", "actionlint"]

[tasks.lint]
description = "Everything lint: lint-go and lint-ci"
run = [{ task = "lint-go" }, { task = "lint-ci" }]

[tasks.lint-go]
description = "golangci-lint, for Linux as in CI (on macOS the Linux-only files would be left out and their helpers reported unused)"
depends = ["lint:leaks", "cache-guard"]
env = { GOOS = "linux" }
run = "heavy -- golangci-lint run"

[tasks.lint-ci]
description = "shellcheck: the release helpers and dev.sh with every finding, the other scripts and tasks from warnings up (actionlint runs in lint:leaks)"
run = [
  "shellcheck -x -P SCRIPTDIR .github/scripts/*.sh scripts/dev.sh scripts/dev.test.sh mise-tasks/test-scripts",
  "git ls-files -z '*.sh' 'mise-tasks/*' | xargs -0 shellcheck -x -P SCRIPTDIR -S warning",
]

[tasks.test-netns]
description = "The real-iptables tests in network namespaces (Docker, privileged)"
run = "heavy -- hack/test-netns.sh"

[tasks.test-bpf]
description = "The eBPF tests of the WireGuard demux fast path (Docker, privileged)"
run = "heavy -- hack/test-bpf.sh"

[tasks.check]
description = "What the CI check runs without Docker: generate-check, lint, test and test-scripts"
run = [{ task = "generate-check" }, { task = "lint" }, { task = "test" }, { task = "test-scripts" }]

# Branch cycle (scripts/dev.sh, the same in every repository), see CONTRIBUTING.md.
[tasks.dev-start]
description = "feature/<name> from the fresh develop; with --line X.Y, fix/X.Y/<name> from release/X.Y. Usage: mise run dev-start <name> [--line X.Y]"
run = "scripts/dev.sh start"

[tasks.dev-push]
description = "Push, open or update the PR into its base: develop (auto-merge when green) or release/X.Y for a fix branch (merged by hand, no auto-merge)"
run = "scripts/dev.sh push"

[tasks.dev-done]
description = "Back to develop, pull, delete the merged local branch"
run = "scripts/dev.sh done"
