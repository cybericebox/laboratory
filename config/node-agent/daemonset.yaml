apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: system
  labels:
    app: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      serviceAccountName: node-agent
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-cni-bins
          image: ghcr.io/cybericebox/laboratory/node-agent:0.1.0
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              set -e
              cp /node /opt/cni/bin/cni-gate
              for p in bridge ptp loopback host-local portmap; do
                [ -f /usr/libexec/cni/$p ] && cp /usr/libexec/cni/$p /opt/cni/bin/$p
              done
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: cni-bin
              mountPath: /opt/cni/bin
        - name: install-cni-conf
          image: ghcr.io/cybericebox/laboratory/node-agent:0.1.0
          command: [ "/node", "install-cni" ]
          env:
            - name: GRPC_SOCK
              value: /run/cybericebox/node-agent.sock
            - name: CNI_CONF_DIR
              value: /etc/cni/net.d
            - name: CNI_FALLBACK_TIMEOUT
              value: "60s"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: cni-conf
              mountPath: /etc/cni/net.d
      containers:
        - name: ovs
          image: ghcr.io/cybericebox/laboratory/node-agent:0.1.0
          command: [ "/node-agent/bin/start-ovs.sh" ]
          securityContext:
            privileged: true
          volumeMounts:
            - name: ovs-run
              mountPath: /run/openvswitch
        - name: node-agent
          image: ghcr.io/cybericebox/laboratory/node-agent:0.1.0
          command: [ "/node", "node-agent" ]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OVS_SOCK
              value: /run/openvswitch/db.sock
            - name: GRPC_SOCK
              value: /run/cybericebox/node-agent.sock
            - name: NODE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PROC_ROOT
              value: /host/proc
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_PTRACE
          volumeMounts:
            - name: ovs-run
              mountPath: /run/openvswitch
            - name: grpc-dir
              mountPath: /run/cybericebox
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-netns
              mountPath: /run/netns
              readOnly: true
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: ovs-run
          emptyDir: { }
        - name: grpc-dir
          hostPath:
            path: /run/cybericebox
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
