# Namespace for the proxy singleton pod.
apiVersion: v1
kind: Namespace
metadata:
  name: laboratory-proxy
---
# ServiceAccount used by the proxy pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxy
  namespace: laboratory-proxy
---
# ClusterRole: proxy needs cluster-wide read on LabGroups (demux table)
# and Services (L7 service resolver informer cache).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-proxy
rules:
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroups" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "services" ]
    verbs: [ "get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: laboratory-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: laboratory-proxy
subjects:
  - kind: ServiceAccount
    name: proxy
    namespace: laboratory-proxy
---
# Role: proxy reads only its own credentials Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: proxy-credentials-reader
  namespace: laboratory-proxy
rules:
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    resourceNames: [ "proxy-credentials" ]
    verbs: [ "get" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proxy-credentials-reader
  namespace: laboratory-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: proxy-credentials-reader
subjects:
  - kind: ServiceAccount
    name: proxy
    namespace: laboratory-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: laboratory-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      serviceAccountName: proxy
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: proxy
          image: cybericebox/proxy:latest
          imagePullPolicy: Never
          securityContext:
            capabilities:
              add: [ "NET_ADMIN" ]
          ports:
            - name: https
              containerPort: 443
              hostPort: 443
            - name: wg-udp
              containerPort: 51820
              protocol: UDP
              hostPort: 51820
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: "127.0.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - name: TLS_CERT_PATH
              value: /etc/proxy/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/proxy/tls/tls.key
            - name: JWT_PUBLIC_KEY_PATH
              value: /etc/proxy/credentials/jwt-public-key.pem
            - name: BASE_DOMAIN
              value: test.local
            - name: UDP_LISTEN_ADDR
              value: "0.0.0.0:51820"
            - name: EXTERNAL_INTERFACE
              value: eth0
          volumeMounts:
            - name: tls
              mountPath: /etc/proxy/tls
              readOnly: true
            - name: credentials
              mountPath: /etc/proxy/credentials
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: proxy-tls
        - name: credentials
          secret:
            secretName: proxy-credentials
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
