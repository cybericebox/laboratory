# Plain-manifest twin of charts/laboratory/templates/proxy (values: defaults).
# Not part of config/default; keep it in step with the chart.
#
# Prerequisites in laboratory-proxy:
#   - Secret proxy-tls (tls.crt, tls.key): the wildcard certificate of BASE_DOMAIN.
#   - Secret lab-access-public-key (public.pem): created by the operator from the
#     Secret of the same name in laboratory-system (PlatformReconciler).
#   - Secret proxy-session (sessionSecret): HMAC key (32+ bytes) of the proxy's own
#     session cookie, shared by all replicas:
#       kubectl -n laboratory-proxy create secret generic proxy-session \
#         --from-literal=sessionSecret="$(openssl rand -base64 48)"
apiVersion: v1
kind: Namespace
metadata:
  name: laboratory-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: laboratory-proxy
  namespace: laboratory-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: laboratory-proxy
rules:
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroups" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "services" ]
    verbs: [ "get", "list", "watch" ]
  # The group access policy is the same one the VPN enforces.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroupaccesspolicies" ]
    verbs: [ "get", "list", "watch" ]
  # A token names a LabGroupClient; the proxy checks that it exists.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labgroupclients" ]
    verbs: [ "get", "list", "watch" ]
  # Each replica publishes its request counters as its own report in every group
  # namespace.
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labtrafficreports" ]
    verbs: [ "get", "create", "update" ]
  - apiGroups: [ "laboratory.cybericebox.com" ]
    resources: [ "labtrafficreports/status" ]
    verbs: [ "get", "patch", "update" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: laboratory-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: laboratory-proxy
subjects:
  - kind: ServiceAccount
    name: laboratory-proxy
    namespace: laboratory-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laboratory-proxy
  namespace: laboratory-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laboratory-proxy-l7
  template:
    metadata:
      labels:
        app: laboratory-proxy-l7
    spec:
      serviceAccountName: laboratory-proxy
      containers:
        - name: l7
          image: cybericebox/laboratory-proxy:latest
          command: [ "/proxy", "proxy-l7" ]
          env:
            # REQUIRED, no default: the overlay must set the lab base domain.
            - name: BASE_DOMAIN
              value: ""
            - name: LISTEN_HTTPS
              value: ":8443"
            - name: SESSION_COOKIE_NAME
              value: challenge
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: proxy-session
                  key: sessionSecret
            - name: REPORT_INTERVAL
              value: 1m
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TLS_CERT_PATH
              value: /etc/proxy/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/proxy/tls/tls.key
            - name: LAB_ACCESS_PUBLIC_KEY_PATH
              value: /etc/proxy/lab-access/public.pem
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /etc/proxy/tls
              readOnly: true
            - name: lab-access
              mountPath: /etc/proxy/lab-access
              readOnly: true
        - name: wg-demux
          image: cybericebox/laboratory-proxy:latest
          command: [ "/proxy", "proxy-wg" ]
          env:
            - name: UDP_LISTEN_ADDR
              value: ":51820"
            - name: VPN_SERVICE_PORT
              value: "51820"
          ports:
            - name: wg
              containerPort: 51820
              protocol: UDP
      volumes:
        - name: tls
          secret:
            secretName: proxy-tls
        - name: lab-access
          secret:
            secretName: lab-access-public-key
