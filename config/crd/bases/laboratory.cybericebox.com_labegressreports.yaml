---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: labegressreports.laboratory.cybericebox.com
spec:
  group: laboratory.cybericebox.com
  names:
    kind: LabEgressReport
    listKind: LabEgressReportList
    plural: labegressreports
    shortNames:
    - ler
    singular: labegressreport
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LabEgressReport is the hand-off of the per-minute egress summaries from the gateway pod of a group to the operator: the gateway writes
          the finished minutes to the status, the operator logs them and writes spec.ackedThrough, and the gateway then removes what is acknowledged.
          There is one per group namespace, named "gateway". It replaces the page the operator used to pull from the gateway pod.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LabEgressReportSpec is written by the operator only. It carries
              the acknowledgement that lets the gateway forget what has been read.
            properties:
              ackedThrough:
                description: |-
                  AckedThrough is the start of the newest minute the operator has logged: every minute up to and including it is in the connection
                  log, and the gateway removes it from the status. The operator moves it forward only.
                format: date-time
                type: string
            type: object
          status:
            description: LabEgressReportStatus is written by the gateway pod only.
            properties:
              bootID:
                description: BootID identifies the run of that pod.
                type: string
              droppedMinutes:
                description: DroppedMinutes counts the minutes the writer dropped
                  because a bound was reached before the operator took them.
                format: int64
                type: integer
              instance:
                description: Instance is the gateway pod that wrote the report last.
                type: string
              minutes:
                description: |-
                  Minutes are the minutes that the operator has not acknowledged, oldest first. A restarted gateway keeps the ones of its
                  predecessor.
                items:
                  description: |-
                    LabEgressMinute is one finished minute of the gateway. The limits are the same as the ones the writer keeps (internal/egressproxy
                    MaxReport*); a test compares them.
                  properties:
                    caps:
                      items:
                        description: LabEgressCap counts how often a lab sat at one
                          of its caps in a minute.
                        properties:
                          hits:
                            format: int64
                            type: integer
                          lab:
                            maxLength: 253
                            type: string
                          reason:
                            maxLength: 64
                            type: string
                        required:
                        - hits
                        - lab
                        - reason
                        type: object
                      maxItems: 500
                      type: array
                    denials:
                      items:
                        description: LabEgressDenial counts the refused connections
                          of a lab by reason in a minute.
                        properties:
                          count:
                            format: int64
                            type: integer
                          lab:
                            maxLength: 253
                            type: string
                          reason:
                            maxLength: 64
                            type: string
                        required:
                        - count
                        - lab
                        - reason
                        type: object
                      maxItems: 500
                      type: array
                    flows:
                      items:
                        description: |-
                          LabEgressFlow is one lab's traffic from one source address to one destination address and port in one minute. It exists only when
                          activity reports are on.
                        properties:
                          conns:
                            format: int64
                            type: integer
                          down:
                            format: int64
                            type: integer
                          dst:
                            maxLength: 45
                            type: string
                          firstMs:
                            format: int64
                            type: integer
                          lab:
                            maxLength: 253
                            type: string
                          lastMs:
                            format: int64
                            type: integer
                          port:
                            format: int32
                            type: integer
                          src:
                            maxLength: 45
                            type: string
                          up:
                            format: int64
                            type: integer
                        required:
                        - conns
                        - down
                        - dst
                        - firstMs
                        - lab
                        - lastMs
                        - port
                        - src
                        - up
                        type: object
                      maxItems: 200
                      type: array
                    rows:
                      items:
                        description: LabEgressRow is one lab's traffic to one host
                          name in one minute (no address of a person, no content).
                        properties:
                          conns:
                            format: int64
                            type: integer
                          denied:
                            format: int64
                            type: integer
                          down:
                            format: int64
                            type: integer
                          host:
                            maxLength: 253
                            type: string
                          lab:
                            maxLength: 253
                            type: string
                          up:
                            format: int64
                            type: integer
                        required:
                        - conns
                        - down
                        - host
                        - lab
                        - up
                        type: object
                      maxItems: 500
                      type: array
                    start:
                      format: date-time
                      type: string
                  required:
                  - start
                  type: object
                maxItems: 30
                type: array
              updatedAt:
                description: UpdatedAt is the time of the last write.
                format: date-time
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: the report of a group is named gateway
          rule: self.metadata.name == 'gateway'
    served: true
    storage: true
    subresources:
      status: {}
