  names:
    kind: ConsoleCable
    listKind: ConsoleCableList
    plural: consolecables
    singular: consolecable
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serial.device
      name: Serial
      type: string
    - jsonPath: .spec.console.device
      name: Console
      type: string
    - jsonPath: .status.lineUp
      name: Line
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConsoleCable is one console line of a Lab: made by the operator from Lab.spec.consoleCables and owned by the Lab. It is not a
          Connection: it never reaches Open vSwitch and has no VNI.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConsoleCableSpec is the desired state of a ConsoleCable.
            properties:
              console:
                description: PortRef names one port of one device of the same Lab.
                properties:
                  device:
                    description: Device is the name of a device of the lab (DeviceTemplate.name).
                    maxLength: 35
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  port:
                    description: Port is the name of a console port or a serial port
                      of that device.
                    maxLength: 9
                    pattern: ^(serial|console|aux)(0|[1-9][0-9]?)$
                    type: string
                required:
                - device
                - port
                type: object
              labRef:
                description: LabRef is the name of the parent Lab; both ends are devices
                  of it.
                type: string
              serial:
                description: PortRef names one port of one device of the same Lab.
                properties:
                  device:
                    description: Device is the name of a device of the lab (DeviceTemplate.name).
                    maxLength: 35
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  port:
                    description: Port is the name of a console port or a serial port
                      of that device.
                    maxLength: 9
                    pattern: ^(serial|console|aux)(0|[1-9][0-9]?)$
                    type: string
                required:
                - device
                - port
                type: object
            required:
            - console
            - labRef
            - serial
            type: object
            x-kubernetes-validations:
            - message: a console cable is immutable
              rule: self == oldSelf
            - message: the serial end names a serial port
              rule: self.serial.port.startsWith('serial')
            - message: the console end names a console port
              rule: '!self.console.port.startsWith(''serial'')'
            - message: the two ends of a console cable are on two different devices
              rule: self.serial.device != self.console.device
          status:
