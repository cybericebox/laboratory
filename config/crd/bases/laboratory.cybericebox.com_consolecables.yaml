                x-kubernetes-list-type: map
              console:
                description: ConsoleCableEndStatus is the state of one end of a line,
                  written by the node-agent that owns the line.
                properties:
                  attached:
                    description: 'Attached: the line owner holds a running attach
                      to the port keeper of this end.'
                    type: boolean
                  nodeName:
                    description: NodeName is the node the device of this end runs
                      on.
                    type: string
                type: object
              lineUp:
                description: 'LineUp: both ends are attached and the relay runs.'
                type: boolean
              serial:
                description: ConsoleCableEndStatus is the state of one end of a line,
                  written by the node-agent that owns the line.
                properties:
                  attached:
                    description: 'Attached: the line owner holds a running attach
                      to the port keeper of this end.'
                    type: boolean
                  nodeName:
                    description: NodeName is the node the device of this end runs
                      on.
