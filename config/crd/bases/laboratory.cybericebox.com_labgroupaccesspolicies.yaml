---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: labgroupaccesspolicies.laboratory.cybericebox.com
spec:
  group: laboratory.cybericebox.com
  names:
    kind: LabGroupAccessPolicy
    listKind: LabGroupAccessPolicyList
    plural: labgroupaccesspolicies
    shortNames:
    - lgap
    singular: labgroupaccesspolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LabGroupAccessPolicy is the namespaced firewall policy of one LabGroup. The
          agent owns a fixed object in the LabGroup namespace and replaces its Spec in
          one Kubernetes update, while the VPN process watches this resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LabGroupAccessPolicySpec is a complete replacement desired policy. Empty is
              intentional and means no VPN client can reach a laboratory.
            properties:
              rules:
                items:
                  description: |-
                    LabGroupAccessRule targets selected clients and laboratories in one group.
                    An empty ClientNames list means every LabGroupClient in this namespace.
                    An empty LabNames list means every Lab in this namespace.
                  properties:
                    action:
                      description: |-
                        LabGroupAccessAction is applied to every matching client/lab pair. Deny
                        rules always take precedence over allow rules; a pair matching no allow rule
                        is denied by default.
                      enum:
                      - allow
                      - deny
                      type: string
                    clientNames:
                      items:
                        type: string
                      type: array
                    labNames:
                      items:
                        type: string
                      type: array
                  required:
                  - action
                  type: object
                type: array
            type: object
          status:
            description: |-
              LabGroupAccessPolicyStatus is written only by the in-namespace VPN
              reconciler after it has applied the matching policy generation.
            properties:
              appliedAt:
                format: date-time
                type: string
              lastError:
                type: string
              observedGeneration:
                format: int64
                type: integer
              rules:
                items:
                  description: |-
                    LabGroupAccessPolicyRuleStatus is one effective client-to-lab firewall
                    relation. Counters are cumulative kernel counters; CounterReset marks a
                    replacement/restart so downstream summaries never infer negative traffic.
                  properties:
                    action:
                      description: |-
                        LabGroupAccessAction is applied to every matching client/lab pair. Deny
                        rules always take precedence over allow rules; a pair matching no allow rule
                        is denied by default.
                      enum:
                      - allow
                      - deny
                      type: string
                    bytes:
                      format: int64
                      type: integer
                    clientName:
                      type: string
                    counterReset:
                      type: boolean
                    labName:
                      type: string
                    packets:
                      format: int64
                      type: integer
                  required:
                  - action
                  - clientName
                  - labName
                  type: object
                type: array
              state:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
