---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: labgroups.laboratory.cybericebox.com
spec:
  group: laboratory.cybericebox.com
  names:
    kind: LabGroup
    listKind: LabGroupList
    plural: labgroups
    singular: labgroup
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LabGroup is the Schema for the labgroups API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LabGroupSpec defines the desired state of LabGroup.
            properties:
              admission:
                description: Admission serializes child creates/starts across agent
                  replicas.
                properties:
                  desiredState:
                    type: string
                  expectedLabUID:
                    type: string
                  groupUID:
                    type: string
                  labName:
                    type: string
                  operationId:
                    type: string
                  revision:
                    format: int64
                    type: integer
                  specHash:
                    type: string
                  token:
                    type: string
                required:
                - desiredState
                - groupUID
                - labName
                - token
                type: object
              gateway:
                description: Gateway holds the internet gateway pod's settings.
                properties:
                  size:
                    description: Size is the size of the gateway pod; absent = the
                      chart's default. Fixed once set.
                    properties:
                      cpuMillicores:
                        format: int64
                        minimum: 1
                        type: integer
                      memoryBytes:
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - cpuMillicores
                    - memoryBytes
                    type: object
                    x-kubernetes-validations:
                    - message: the size of a group's pod is fixed
                      rule: self == oldSelf
                type: object
              lifecycle:
                description: Lifecycle is independent of legacy suspension; absent
                  means Running.
                properties:
                  desiredState:
                    enum:
                    - Running
                    - Stopped
                    type: string
                  operationId:
                    maxLength: 128
                    minLength: 1
                    type: string
                  requireAllLabsStopped:
                    type: boolean
                  revision:
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - desiredState
                - operationId
                - requireAllLabsStopped
                - revision
                type: object
                x-kubernetes-validations:
                - message: group stop requires all labs stopped
                  rule: self.desiredState != 'Stopped' || self.requireAllLabsStopped
                - message: group lifecycle revision must increase for changed intent
                  rule: self.revision > oldSelf.revision || self == oldSelf
              suspended:
                type: boolean
              vpn:
                description: LabGroupVPNSpec holds VPN server configuration.
                properties:
                  disabled:
                    description: Disabled stops only the VPN server; internet gateway
                      and Labs remain running.
                    type: boolean
                  keypairSecretRef:
                    description: |-
                      KeypairSecretRef points to an existing WireGuard keypair Secret.
                      If omitted, operator generates a keypair and stores it in Secret vpn-server-keypair.
                    properties:
                      name:
                        description: name is unique within a namespace to reference
                          a secret resource.
                        type: string
                      namespace:
                        description: namespace defines the space within which the
                          secret name must be unique.
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  probeWhileSuspended:
                    description: |-
                      Deprecated: suspension now always keeps WireGuard and the internet
                      gateway running while stopping only task devices.
                    type: boolean
                  size:
                    description: Size is the size of the VPN pod; absent = the chart's
                      default. Fixed once set.
                    properties:
                      cpuMillicores:
                        format: int64
                        minimum: 1
                        type: integer
                      memoryBytes:
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - cpuMillicores
                    - memoryBytes
                    type: object
                    x-kubernetes-validations:
                    - message: the size of a group's pod is fixed
                      rule: self == oldSelf
                type: object
            type: object
            x-kubernetes-validations:
            - message: explicit group lifecycle intent cannot be removed
              rule: '!has(oldSelf.lifecycle) || has(self.lifecycle)'
          status:
            description: LabGroupStatus defines the observed state of LabGroup.
            properties:
              imageWarning:
                description: |-
                  ImageWarning names the VPN or gateway image that could not be pinned to a
                  digest when the group's pods were created with the image cache on; the pod
                  pulls it by tag. Empty when all were pinned (or the cache was off).
                type: string
              lifecycle:
                description: Reserved observation seam for later full group stop;
                  suspension is unchanged.
                properties:
                  accessFenceVPNBootId:
                    type: string
                  accessFenced:
                    description: AccessFenced is current-operation confirmation, never
                      RPC acceptance.
                    type: boolean
                  accessFencedAt:
                    format: date-time
                    type: string
                  error:
                    type: string
                  labUID:
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  observedState:
                    enum:
                    - Running
                    - Snapshotting
                    - Stopping
                    - Stopped
                    - StopFailed
                    - Starting
                    - Unknown
                    type: string
                  operationId:
                    maxLength: 128
                    minLength: 1
                    type: string
                  reason:
                    type: string
                  requestedAt:
                    format: date-time
                    type: string
                  revision:
                    format: int64
                    minimum: 1
                    type: integer
                  snapshotComplete:
                    type: boolean
                  stoppedAt:
                    format: date-time
                    type: string
                required:
                - labUID
                - observedGeneration
                - observedState
                - operationId
                - revision
                type: object
              namespace:
                type: string
              phase:
                description: Phase is the lifecycle phase of a resource.
                enum:
                - Pending
                - Queued
                - Provisioning
                - Ready
                - Suspended
                - Failed
                - Error
                type: string
              pods:
                description: |-
                  Pods is the scheduling state of the group's own pods ("vpn", "gateway").
                  Absent for a group that predates the scheduler: its pods are not queued.
                items:
                  description: NamedPodSchedule is the PodSchedule of a LabGroup pod
                    ("vpn" or "gateway").
                  properties:
                    dispatchedAt:
                      description: DispatchedAt is when the scheduler let the pod
                        start; the startup timeout counts from it.
                      format: date-time
                      type: string
                    failure:
                      description: Failure explains a Failed pod; the warning clears
                        when the pod becomes Ready.
                      properties:
                        at:
                          format: date-time
                          type: string
                        message:
                          description: Message is the last error the node reported
                            (for example the image pull error).
                          type: string
                        reason:
                          description: Reason is one of the Failure* constants.
                          type: string
                        restartCount:
                          format: int32
                          type: integer
                      type: object
                    name:
                      type: string
                    queuedAt:
                      description: QueuedAt is when the pod entered the queue.
                      format: date-time
                      type: string
                    startedAt:
                      description: StartedAt is when the pod was first seen Ready.
                      format: date-time
                      type: string
                    state:
                      description: PodScheduleState is where a pod is on its way from
                        the queue to Ready.
                      enum:
                      - Queued
                      - Starting
                      - Started
                      - Failed
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              resources:
                description: |-
                  RuntimeAllocation keeps held requests until identity-matching native absence
                  and attachment cleanup are confirmed. Missing observations mean Unknown.
                  Quota bytes are uncompressed accounting, not physically reclaimed storage.
                properties:
                  allocatedRequests:
                    description: ResourceAmounts separates configured, held and measured
                      compute amounts.
                    properties:
                      cpuMillicores:
                        format: int64
                        minimum: 0
                        type: integer
                      memoryBytes:
                        format: int64
                        minimum: 0
                        type: integer
                    required:
                    - cpuMillicores
                    - memoryBytes
                    type: object
                  configuredLimits:
                    description: ResourceAmounts separates configured, held and measured
                      compute amounts.
                    properties:
                      cpuMillicores:
                        format: int64
                        minimum: 0
                        type: integer
                      memoryBytes:
                        format: int64
                        minimum: 0
                        type: integer
                    required:
                    - cpuMillicores
                    - memoryBytes
                    type: object
                  configuredRequests:
                    description: ResourceAmounts separates configured, held and measured
                      compute amounts.
                    properties:
                      cpuMillicores:
                        format: int64
                        minimum: 0
                        type: integer
                      memoryBytes:
                        format: int64
                        minimum: 0
                        type: integer
                    required:
                    - cpuMillicores
                    - memoryBytes
                    type: object
                  observedAt:
                    format: date-time
                    type: string
                  operationId:
                    type: string
                  physicalStorageBytes:
                    format: int64
                    minimum: 0
                    type: integer
                  physicalStorageBytesAvailable:
                    type: boolean
                  releasedAt:
                    format: date-time
                    type: string
                  revision:
                    format: int64
                    type: integer
                  runtimeState:
                    enum:
                    - Allocated
                    - Releasing
                    - Released
                    - Unknown
                    type: string
                  snapshotQuotaBytes:
                    format: int64
                    minimum: 0
                    type: integer
                  storageState:
                    enum:
                    - None
                    - Retained
                    - DeleteRequested
                    - CleanupPending
                    - Deleted
                    - Unknown
                    type: string
                  usageAvailable:
                    type: boolean
                  used:
                    description: ResourceAmounts separates configured, held and measured
                      compute amounts.
                    properties:
                      cpuMillicores:
                        format: int64
                        minimum: 0
                        type: integer
                      memoryBytes:
                        format: int64
                        minimum: 0
                        type: integer
                    required:
                    - cpuMillicores
                    - memoryBytes
                    type: object
                required:
                - allocatedRequests
                - configuredLimits
                - configuredRequests
                - runtimeState
                - storageState
                type: object
              scheduling:
                description: Scheduling is the place of the group in the scheduler
                  queue.
                properties:
                  group:
                    description: Group is the deploy group of the object; empty for
                      an independent one.
                    type: string
                  length:
                    description: Length is the number of such objects when Position
                      was written.
                    format: int32
                    type: integer
                  message:
                    description: Message adds detail, for example "waiting for group
                      intro".
                    type: string
                  pending:
                    format: int32
                    type: integer
                  pods:
                    description: |-
                      Pods is the number of pods of the object and Pending how many of them are
                      not dispatched yet.
                    format: int32
                    type: integer
                  position:
                    description: |-
                      Position is the 1-based place among the objects that still have pods to
                      dispatch; 0 when all pods are dispatched.
                    format: int32
                    type: integer
                  reason:
                    description: Reason is why the next pod of the object is not dispatched
                      (Wait* constants).
                    type: string
                type: object
              serviceReports:
                description: ServiceReports is node-owned matching native observation.
                items:
                  description: |-
                    OwnedRuntimeReport is node-owned; identity is immutable controller inventory.
                    Independent timestamps never impose a cross-owner clock ordering.
                  properties:
                    attachmentsAbsentAt:
                      format: date-time
                      type: string
                    cgroupAbsentAt:
                      format: date-time
                      type: string
                    error:
                      type: string
                    identity:
                      description: |-
                        OwnedRuntimeIdentity is captured before stop. An absent API Pod cannot create
                        this inventory. NodeBootID is the kernel boot, not the node-agent process.
                      properties:
                        cgroupPaths:
                          items:
                            type: string
                          type: array
                        component:
                          type: string
                        containerIDs:
                          items:
                            type: string
                          type: array
                        deploymentUID:
                          type: string
                        epoch:
                          format: int32
                          type: integer
                        incarnation:
                          format: int32
                          type: integer
                        limits:
                          description: ResourceAmounts separates configured, held
                            and measured compute amounts.
                          properties:
                            cpuMillicores:
                              format: int64
                              minimum: 0
                              type: integer
                            memoryBytes:
                              format: int64
                              minimum: 0
                              type: integer
                          required:
                          - cpuMillicores
                          - memoryBytes
                          type: object
                        nodeBootID:
                          type: string
                        nodeName:
                          type: string
                        operationId:
                          type: string
                        ownerUID:
                          type: string
                        podUID:
                          type: string
                        portKeys:
                          items:
                            type: string
                          type: array
                        requests:
                          description: ResourceAmounts separates configured, held
                            and measured compute amounts.
                          properties:
                            cpuMillicores:
                              format: int64
                              minimum: 0
                              type: integer
                            memoryBytes:
                              format: int64
                              minimum: 0
                              type: integer
                          required:
                          - cpuMillicores
                          - memoryBytes
                          type: object
                        revision:
                          format: int64
                          type: integer
                      required:
                      - cgroupPaths
                      - containerIDs
                      - limits
                      - nodeBootID
                      - nodeName
                      - operationId
                      - ownerUID
                      - podUID
                      - portKeys
                      - requests
                      - revision
                      type: object
                    observedAt:
                      format: date-time
                      type: string
                    runtimeAbsentAt:
                      format: date-time
                      type: string
                    runtimeState:
                      type: string
                  required:
                  - identity
                  - runtimeState
                  type: object
                type: array
              serviceRuntime:
                description: ServiceRuntime is controller-owned durable pre-scale
                  inventory.
                items:
                  description: |-
                    OwnedRuntimeIdentity is captured before stop. An absent API Pod cannot create
                    this inventory. NodeBootID is the kernel boot, not the node-agent process.
                  properties:
                    cgroupPaths:
                      items:
                        type: string
                      type: array
                    component:
                      type: string
                    containerIDs:
                      items:
                        type: string
                      type: array
                    deploymentUID:
                      type: string
                    epoch:
                      format: int32
                      type: integer
                    incarnation:
                      format: int32
                      type: integer
                    limits:
                      description: ResourceAmounts separates configured, held and
                        measured compute amounts.
                      properties:
                        cpuMillicores:
                          format: int64
                          minimum: 0
                          type: integer
                        memoryBytes:
                          format: int64
                          minimum: 0
                          type: integer
                      required:
                      - cpuMillicores
                      - memoryBytes
                      type: object
                    nodeBootID:
                      type: string
                    nodeName:
                      type: string
                    operationId:
                      type: string
                    ownerUID:
                      type: string
                    podUID:
                      type: string
                    portKeys:
                      items:
                        type: string
                      type: array
                    requests:
                      description: ResourceAmounts separates configured, held and
                        measured compute amounts.
                      properties:
                        cpuMillicores:
                          format: int64
                          minimum: 0
                          type: integer
                        memoryBytes:
                          format: int64
                          minimum: 0
                          type: integer
                      required:
                      - cpuMillicores
                      - memoryBytes
                      type: object
                    revision:
                      format: int64
                      type: integer
                  required:
                  - cgroupPaths
                  - containerIDs
                  - limits
                  - nodeBootID
                  - nodeName
                  - operationId
                  - ownerUID
                  - podUID
                  - portKeys
                  - requests
                  - revision
                  type: object
                type: array
              suspended:
                type: boolean
              vpn:
                description: LabGroupVPNStatus exposes VPN server connection details.
                properties:
                  clientSubnet:
                    description: ClientSubnet is the group subnet containing the tunnel-only
                      test gateway.
                    type: string
                  endpoint:
                    description: Endpoint is the public UDP address of the VPN server
                      (host:port) advertised to clients.
                    type: string
                  publicKey:
                    description: PublicKey is the WireGuard public key used as routing
                      key for demux.
                    type: string
                  registered:
                    description: |-
                      Registered is true when the VPN deployment has at least one ready replica,
                      including while Lab devices are suspended.
                    type: boolean
                  secretRef:
                    description: SecretRef is "<namespace>/<name>" of the vpn-server-keypair
                      Secret.
                    type: string
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: LabGroup name must be at most 63 characters
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
