---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: labs.laboratory.cybericebox.com
spec:
  group: laboratory.cybericebox.com
  names:
    kind: Lab
    listKind: LabList
    plural: labs
    singular: lab
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Lab is the Schema for the labs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LabSpec defines the desired state of Lab.
            properties:
              connections:
                items:
                  description: ConnectionTemplate is an inline connection declaration
                    inside Lab.spec.connections[].
                  properties:
                    endpoints:
                      items:
                        description: EndpointSpec references a device interface in
                          a Connection.
                        properties:
                          device:
                            description: Device is the name of the Device CRD within
                              the same Lab.
                            type: string
                          interface:
                            description: |-
                              Interface is a declared interface on a container or a logical
                              GigabitEthernet0/1..GigabitEthernet0/48 port on a switch/hub.
                            type: string
                        required:
                        - device
                        type: object
                      maxItems: 2
                      minItems: 2
                      type: array
                  required:
                  - endpoints
                  type: object
                type: array
              devices:
                items:
                  description: DeviceTemplate is an inline device declaration inside
                    Lab.spec.devices[].
                  properties:
                    exposure:
                      description: ExposureSpec declares how a device is externally
                        reachable.
                      properties:
                        web:
                          description: WebExposure publishes a device port via an
                            L7 proxy.
                          properties:
                            port:
                              format: int32
                              type: integer
                            protocol:
                              default: http
                              description: Protocol is "http" or "https".
                              type: string
                          required:
                          - port
                          type: object
                      type: object
                    image:
                      type: string
                    interfaces:
                      items:
                        description: InterfaceSpec defines a network interface on
                          a device.
                        properties:
                          addr:
                            description: AddrSpec defines static or DHCP address configuration.
                            properties:
                              addressRef:
                                description: |-
                                  NetworkIPRef selects a host address from a lab-allocated VPN or Internet /24.
                                  The lab reconciler resolves it before creating a Device.
                                properties:
                                  host:
                                    format: int32
                                    maximum: 254
                                    minimum: 1
                                    type: integer
                                  network:
                                    enum:
                                    - vpn
                                    - internet
                                    type: string
                                required:
                                - host
                                - network
                                type: object
                              gateway:
                                type: string
                              gatewayRef:
                                description: |-
                                  NetworkIPRef selects a host address from a lab-allocated VPN or Internet /24.
                                  The lab reconciler resolves it before creating a Device.
                                properties:
                                  host:
                                    format: int32
                                    maximum: 254
                                    minimum: 1
                                    type: integer
                                  network:
                                    enum:
                                    - vpn
                                    - internet
                                    type: string
                                required:
                                - host
                                - network
                                type: object
                              ip:
                                type: string
                              routes:
                                items:
                                  description: Route is a static route entry.
                                  properties:
                                    dst:
                                      type: string
                                    dstRef:
                                      description: NetworkSubnetRef selects the full
                                        lab-allocated VPN or Internet /24.
                                      properties:
                                        network:
                                          enum:
                                          - vpn
                                          - internet
                                          type: string
                                      required:
                                      - network
                                      type: object
                                    via:
                                      type: string
                                    viaRef:
                                      description: |-
                                        NetworkIPRef selects a host address from a lab-allocated VPN or Internet /24.
                                        The lab reconciler resolves it before creating a Device.
                                      properties:
                                        host:
                                          format: int32
                                          maximum: 254
                                          minimum: 1
                                          type: integer
                                        network:
                                          enum:
                                          - vpn
                                          - internet
                                          type: string
                                      required:
                                      - host
                                      - network
                                      type: object
                                  type: object
                                type: array
                              type:
                                description: |-
                                  AddrType controls how an interface gets its address.
                                    - static:      fixed IP from spec; applied by the netconfig init-container.
                                    - dhcp:        the image runs its own DHCP client; the device pod is granted
                                      NET_ADMIN+NET_RAW so that client can lease and configure the interface.
                                    - dhcp-preset: the image has no DHCP client but still needs a dynamic
                                      address; the netconfig init-container leases one from the lab DHCP server
                                      and applies it. The device container needs no capabilities.
                                enum:
                                - static
                                - dhcp
                                - dhcp-preset
                                type: string
                            required:
                            - type
                            type: object
                          mac:
                            description: MAC is "random" or an explicit MAC address.
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    name:
                      description: |-
                        Name becomes part of the lab's web address (<name>-<code>.<domain>), so
                        it is a DNS label of at most 35 characters (names.MaxDeviceNameLen).
                      maxLength: 35
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    resources:
                      description: Resources sets the container resource requests/limits
                        for this device.
                      properties:
                        cpuLimit:
                          type: string
                        cpuRequest:
                          type: string
                        memoryLimit:
                          type: string
                        memoryRequest:
                          type: string
                      type: object
                    securityPreset:
                      description: |-
                        SecurityPreset names a capability profile for the device container. Only
                        the preset name is exposed here; the concrete Linux capabilities behind it
                        are an internal platform decision. Empty means "basic" (no extra caps).
                      enum:
                      - basic
                      - service
                      - net
                      - debug
                      type: string
                    type:
                      description: DeviceType distinguishes network device kinds.
                      enum:
                      - container
                      - unmanaged-switch
                      - hub
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              internet:
                description: LabNetworkSpec configures a network segment (VPN or internet)
                  attached to the lab.
                properties:
                  dhcpServer:
                    description: |-
                      DHCPServer enables the embedded DHCP server for a network segment.
                      Subnet and gateway are derived from the lab's allocated CIDR (Status.*.CIDR).
                    properties:
                      dns:
                        description: DNS is advertised only by the internet gateway's
                          DHCP server.
                        type: string
                      enabled:
                        type: boolean
                      ranges:
                        items:
                          description: |-
                            DHCPRange is an inclusive host-offset interval within the lab /24.
                            An enabled DHCP server must have at least one range.
                          properties:
                            end:
                              format: int32
                              maximum: 254
                              minimum: 2
                              type: integer
                            start:
                              format: int32
                              maximum: 254
                              minimum: 2
                              type: integer
                          required:
                          - end
                          - start
                          type: object
                        type: array
                    type: object
                  enabled:
                    type: boolean
                type: object
              launchClass:
                description: |-
                  LaunchClass groups labs of one type (for example an exercise version or
                  variant id) for launch pacing: labs of one class are admitted together.
                  Empty means the operator derives the class from the lab topology and images.
                type: string
              vpn:
                description: LabNetworkSpec configures a network segment (VPN or internet)
                  attached to the lab.
                properties:
                  dhcpServer:
                    description: |-
                      DHCPServer enables the embedded DHCP server for a network segment.
                      Subnet and gateway are derived from the lab's allocated CIDR (Status.*.CIDR).
                    properties:
                      dns:
                        description: DNS is advertised only by the internet gateway's
                          DHCP server.
                        type: string
                      enabled:
                        type: boolean
                      ranges:
                        items:
                          description: |-
                            DHCPRange is an inclusive host-offset interval within the lab /24.
                            An enabled DHCP server must have at least one range.
                          properties:
                            end:
                              format: int32
                              maximum: 254
                              minimum: 2
                              type: integer
                            start:
                              format: int32
                              maximum: 254
                              minimum: 2
                              type: integer
                          required:
                          - end
                          - start
                          type: object
                        type: array
                    type: object
                  enabled:
                    type: boolean
                type: object
            type: object
          status:
            description: LabStatus defines the observed state of Lab.
            properties:
              access:
                items:
                  description: AccessEntry describes a single externally reachable
                    endpoint.
                  properties:
                    device:
                      type: string
                    port:
                      format: int32
                      type: integer
                    protocol:
                      type: string
                    url:
                      type: string
                  required:
                  - device
                  - port
                  - protocol
                  - url
                  type: object
                type: array
              conditions:
                description: |-
                  Conditions surfaces reconciler progress/blocking reasons
                  (e.g. Ready=False reason=WaitingForInterface) for kubectl and clients.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connections:
                items:
                  description: ConnectionRef summarises a materialised Connection's
                    readiness.
                  properties:
                    name:
                      type: string
                    ready:
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
              devices:
                items:
                  description: DeviceRef summarises a materialised Device's readiness.
                  properties:
                    name:
                      type: string
                    ready:
                      type: boolean
                    state:
                      description: State summarises the snapshots of a device with
                        state persistence.
                      properties:
                        lastSnapshotAt:
                          format: date-time
                          type: string
                        quotaWarning:
                          description: QuotaWarning is set while snapshots are refused
                            or failing.
                          type: string
                        rescue:
                          description: Rescue is true while the device runs in rescue
                            mode.
                          type: boolean
                        restoredAt:
                          format: date-time
                          type: string
                        sizeBytes:
                          format: int64
                          type: integer
                      type: object
                  required:
                  - name
                  type: object
                type: array
              imageCache:
                description: |-
                  ImageCache records whether this lab pulls its images through the platform
                  image cache, decided once on the first reconcile like StatePersistence.
                type: boolean
              imageDigests:
                additionalProperties:
                  type: string
                description: |-
                  ImageDigests are the digests the image tags of the lab's container devices
                  (and the netconfig image) were pinned to when the lab was created with the
                  image cache on, keyed by the image as written in the spec.
                type: object
              imageWarning:
                description: |-
                  ImageWarning lists the images that could not be pinned and are pulled by
                  their tag; empty when all were.
                type: string
              internet:
                description: LabNetworkStatus reports the allocated CIDR for a network
                  segment.
                properties:
                  cidr:
                    type: string
                  ready:
                    type: boolean
                type: object
              launch:
                description: |-
                  Launch reports the launch pacing state: the resolved class, the admission
                  time and, while the lab is Queued, its place in the queue.
                properties:
                  admittedAt:
                    description: AdmittedAt is when the launcher admitted the lab
                      for provisioning.
                    format: date-time
                    type: string
                  class:
                    description: |-
                      Class is the resolved launch class: Spec.LaunchClass, or a hash of the lab
                      topology and images when that is empty.
                    type: string
                  length:
                    description: Length is the number of queued labs when Position
                      was written.
                    format: int32
                    type: integer
                  position:
                    description: |-
                      Position is the 1-based place in the queue; 0 when the lab is not queued.
                      It is refreshed at a limited rate, so it can lag behind by a few seconds.
                    format: int32
                    type: integer
                  reason:
                    description: Reason is why the queue is not admitting this lab
                      right now (LaunchReason*).
                    type: string
                type: object
              phase:
                description: Phase is the lifecycle phase of a resource.
                enum:
                - Pending
                - Queued
                - Provisioning
                - Ready
                - Suspended
                - Failed
                - Error
                type: string
              statePersistence:
                description: |-
                  StatePersistence records how this lab runs its devices, decided once on the
                  first reconcile: true = bare Pods with snapshot-backed state, false =
                  Deployments. It never changes afterwards, whatever the platform switch says.
                type: boolean
              vpn:
                description: LabNetworkStatus reports the allocated CIDR for a network
                  segment.
                properties:
                  cidr:
                    type: string
                  ready:
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
