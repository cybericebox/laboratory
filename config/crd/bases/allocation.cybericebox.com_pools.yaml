---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: pools.allocation.cybericebox.com
spec:
  group: allocation.cybericebox.com
  names:
    kind: Pool
    listKind: PoolList
    plural: pools
    singular: pool
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Pool is the Schema for the pools API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PoolSpec defines the immutable configuration of a Pool.
            properties:
              offset:
                default: 0
                description: 'Offset shifts allocated indices: real value = Offset
                  + bit_index.'
                type: integer
              size:
                description: Size is the total number of slots in this pool.
                minimum: 1
                type: integer
            required:
            - size
            type: object
          status:
            description: PoolStatus holds the mutable allocation state.
            properties:
              bitMap:
                description: BitMap is a base64-encoded bitset (one bit per slot,
                  1 = allocated).
                type: string
              cursor:
                description: Cursor is where a forward-only allocator hands out next
                  (see pkg/api/pool ForwardAllocator).
                type: integer
              free:
                description: Free is the count of unallocated slots; mirrored to label
                  pool.cybericebox.com/free.
                type: integer
              leases:
                additionalProperties:
                  properties:
                    generation:
                      format: int64
                      type: integer
                    ownerUID:
                      type: string
                  required:
                  - generation
                  - ownerUID
                  type: object
                description: Lease owners and bitmap change in the same resourceVersion
                  CAS.
                type: object
              nextLeaseGeneration:
                format: int64
                type: integer
              retired:
                additionalProperties:
                  description: |-
                    PoolRetired is a slot waiting out its quarantine. OwnerUID and Generation are the lease it had (empty for a slot that never
                    had one); RetiredAt starts the quarantine.
                  properties:
                    generation:
                      format: int64
                      type: integer
                    ownerUID:
                      type: string
                    retiredAt:
                      format: date-time
                      type: string
                  required:
                  - retiredAt
                  type: object
                description: |-
                  Retired are the slots whose owner is done with them: the bit stays set (the slot is not given out) until the quarantine has
                  passed, then the sweep clears the bits of many slots in one update. Keyed like Leases.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
