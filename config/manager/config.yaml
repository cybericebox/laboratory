apiVersion: v1
kind: ConfigMap
metadata:
  name: laboratory-config
  namespace: system
data:
  # REQUIRED: host:port advertised to WireGuard clients (demux public address).
  # Example: "vpn.example.com:51820" or "$NODE_IP:51820" for Kind.
  PUBLIC_VPN_ENDPOINT: ""

  # REQUIRED: cluster ingress base domain for device exposure URLs.
  # Example: "lab.example.com"
  BASE_DOMAIN: ""

  # This kustomize deploy applies no admission policies (the Helm chart does), so the operator is told not to require them.
  OPERATOR_REQUIRE_ADMISSION_POLICY: "false"

  # The one address space of the lab networks: /24 number 0 is the VPN clients, every other /24 goes to a gateway of a lab
  # (10.8.N.0/24, N >= 1). The whole network is what the WireGuard clients get as AllowedIPs.
  LAB_BASE_NETWORK: "10.8.0.0/9"

  # Comma-separated CIDR list of proxy source IPs (hostNetwork proxy, e.g. Kind).
  # Leave empty in standard clusters.
  PROXY_SOURCE_CIDRS: ""

  # REQUIRED: contact address shown to participants on the VPN probe page.
  # (no default: set it per deployment; the operator does not start with it empty)
  SUPPORT_EMAIL: ""

  # DNS server advertised to WireGuard clients via DHCP option (optional).

  # Container images for runtime-created pods (an exact version tag: the operator refuses latest and no tag).
  VPN_IMAGE: "ghcr.io/cybericebox/laboratory/vpn:0.1.0"
  GATEWAY_IMAGE: "ghcr.io/cybericebox/laboratory/gateway:0.1.0"

  # JSON-encoded nodeSelector and tolerations for all runtime lab pods.
  LAB_NODE_SELECTOR: "{}"
  LAB_TOLERATIONS: "[]"
