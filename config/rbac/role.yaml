---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - allocation.cybericebox.com
  resources:
  - pools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - allocation.cybericebox.com
  resources:
  - pools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - laboratory.cybericebox.com
  resources:
  - connections
  - devices
  - labgroupclients
  - labgroups
  - labs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - laboratory.cybericebox.com
  resources:
  - connections/finalizers
  - devices/finalizers
  - labgroupclients/finalizers
  - labgroups/finalizers
  - labs/finalizers
  verbs:
  - update
- apiGroups:
  - laboratory.cybericebox.com
  resources:
  - connections/status
  - devices/status
  - labgroupclients/status
  - labgroups/status
  - labs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
