# This rule is not used by the project laboratory itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over laboratory.cybericebox.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: laboratory
    app.kubernetes.io/managed-by: kustomize
  name: laboratory-unmanagedswitch-admin-role
rules:
- apiGroups:
  - laboratory.cybericebox.com
  resources:
  - unmanagedswitches
  verbs:
  - '*'
- apiGroups:
  - laboratory.cybericebox.com
  resources:
  - unmanagedswitches/status
  verbs:
  - get
