# The operator on its own (CRDs, RBAC, manager, metrics service): what the manager e2e suite deploys (mise run kustomize:deploy).
# The chart (charts/laboratory) is the installation; this is not part of it.
namespace: laboratory-system

# Prepended to the names of all resources; it matches the prefix of the namespace.
namePrefix: laboratory-

resources:
  - ../crd
  - ../rbac
  - ../manager
  - metrics_service.yaml

patches:
  # The metrics endpoint over HTTPS on :8443. More info: https://book.kubebuilder.io/reference/metrics
  - path: manager_metrics_patch.yaml
    target:
      kind: Deployment
