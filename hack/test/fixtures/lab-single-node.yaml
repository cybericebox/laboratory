# Namespace: labgroup-<UID> — filled by scenario scripts via LAB_NS env var
# Two container devices connected via one network — all on worker-0 (cordon worker-1 first)
apiVersion: laboratory.cybericebox.com/v1alpha1
kind: Lab
metadata:
  name: ctf-single
  namespace: ${LAB_NS}
spec:
  devices:
    - name: attacker
      type: container
      image: alpine:3.20
      interfaces:
        - name: eth1
          addr:
            type: dhcp
    - name: victim
      type: container
      image: alpine:3.20
      interfaces:
        - name: eth1
          addr:
            type: dhcp
  connections:
    - endpoints:
        - device: attacker
          interface: eth1
        - device: victim
          interface: eth1
