# Scenario 1: L2 direct — two containers, one network, static IPs
apiVersion: laboratory.cybericebox.com/v1alpha1
kind: Lab
metadata:
  name: ctf-test1
  namespace: ${LAB_NS}
spec:
  devices:
  - name: attacker
    type: container
    image: wbitt/network-multitool:latest
    interfaces:
    - name: eth1
      addr:
        type: static
        ip: 10.10.1.10/24
  - name: victim
    type: container
    image: wbitt/network-multitool:latest
    interfaces:
    - name: eth1
      addr:
        type: static
        ip: 10.10.1.20/24
  connections:
  - endpoints:
    - device: attacker
      interface: eth1
    - device: victim
      interface: eth1
