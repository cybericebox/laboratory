# One node, Kubernetes 1.35 or newer (the node image is chosen by run.sh). KEP-2535 (KubeletEnsureSecretPulledImages) is beta and on by
# default from 1.35; it is switched on here explicitly so the test does not depend on a default that can move.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        featureGates:
          KubeletEnsureSecretPulledImages: true
        imagePullCredentialsVerificationPolicy: __VERIFY_POLICY__
