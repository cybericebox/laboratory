vmType: vz
os: Linux
arch: aarch64
cpus: 6
memory: "10GiB"
disk: "80GiB"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

mounts:
  - location: "$HOME/Projects/My/CyberICEBox"
    mountPoint: "/projects/cybericebox"
    writable: true
  - location: "~"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive

      apt-get update -qq
      apt-get install -y openvswitch-switch openvswitch-common gettext-base

      modprobe openvswitch
      systemctl enable openvswitch-switch
      systemctl start openvswitch-switch

      # Docker
      curl -fsSL https://get.docker.com | sh
      usermod -aG docker lima

      # kubectl
      KUBECTL_VER=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
      curl -fsSLo /usr/local/bin/kubectl \
        "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/arm64/kubectl"
      chmod +x /usr/local/bin/kubectl

      # Kind
      curl -fsSLo /usr/local/bin/kind \
        "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-arm64"
      chmod +x /usr/local/bin/kind

      # Go
      curl -fsSLo /tmp/go.tar.gz \
        "https://go.dev/dl/go1.23.4.linux-arm64.tar.gz"
      tar -C /usr/local -xzf /tmp/go.tar.gz
      echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile.d/go.sh

      # Helm
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  - mode: user
    script: |
      #!/bin/bash
      mkdir -p ~/.kube

# Kubernetes API server — reachable from the Mac as 127.0.0.1:16443
# Services (443, 80, 51820) are forwarded directly to Mac localhost
portForwards:
  - guestPort: 6443
    hostPort: 16443
    proto: tcp
  - guestPort: 443
    hostPort: 443
    proto: tcp
  - guestPort: 80
    hostPort: 80
    proto: tcp
  - guestPort: 51820
    hostPort: 51820
    proto: udp

hostResolver:
  enabled: true
