# Chart values of the e2e tests on Kind (hack/kind/kind-config.yaml). The images are built and loaded by the tests; the
# operator image and the ending notice are set by them on the command line.
operator:
  publicVPNEndpoint: vpn.e2e.example.com:51820
  baseDomain: e2e.example.com
  supportEmail: support@e2e.example.com
  # Kind runs no Cilium: the operator would apply CiliumNetworkPolicy objects to every group namespace
  networkPolicy:
    enabled: false
  groupNetworkPolicy:
    enabled: false
registry:
  networkPolicy:
    enabled: false
nodeAgent:
  image:
    tag: e2e
  # the containerd of a Kind node
  criSocket: /run/containerd/containerd.sock
  hostPrep:
    # The Kind node's kernel does not offer these (a read-only /sys/module, no net.core.fb_tunnels_only_for_init_net).
    conntrackAccounting: false
    sysctls:
      net.core.fb_tunnels_only_for_init_net: null
vpn:
  image:
    tag: e2e
inetGateway:
  image:
    tag: e2e
devices:
  security:
    # Kind on the GitHub runner cannot start a device pod in a user namespace (runc: mounting sysfs at /sys: operation
    # not permitted); the reservation tests need running devices, not the user namespace.
    userNamespaces: false
# The gang test sizes devices from the node memory (45 % of a node); the default device cap (4Gi) would shrink them on a
# larger runner, and then three labs fit one node.
limits:
  device:
    maxMemory: "0"
# the lab nodes of the Kind config: both labelled, one tainted
labWorkloads:
  nodeSelector:
    cybericebox.io/lab: "true"
  tolerations:
    - key: cybericebox.io/lab
      operator: Equal
      value: "true"
      effect: NoSchedule
# the edge (Cilium gateway, cert-manager, proxy) is not part of the reservation tests
labScheduler:
  enabled: false
proxy:
  enabled: false
gateway:
  enabled: false
certManager:
  enabled: false
scheduler:
  prepull:
    # no registry to pull from ahead of time: the images are on the nodes already
    enabled: false
