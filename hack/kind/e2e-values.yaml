# Chart values of the e2e tests on Kind (hack/kind/kind-config.yaml). The images are built and loaded by the tests; the
# operator image and the ending notice are set by them on the command line.
operator:
  publicVPNEndpoint: vpn.e2e.example.com:51820
  baseDomain: e2e.example.com
  supportEmail: support@e2e.example.com
  # Kind runs no Cilium: the operator would apply CiliumNetworkPolicy objects to every group namespace
  networkPolicy:
    enabled: false
  groupNetworkPolicy:
    enabled: false
registry:
  networkPolicy:
    enabled: false
  gate:
    # The registry gate is reached through a node port of the control-plane node (where the lab-control pool runs on Kind); kind containers resolve each
    # other by name on their docker network. The cluster is named kind here (make cluster-up KIND_CLUSTER_NAME=kind, the CI step); the tests give
    # the address of the cluster they run on (test/utils GateAddress: KIND_CLUSTER), so a cluster of another name needs no edit of this file.
    address: kind-control-plane:30543
    service:
      nodePort: 30543
nodeAgent:
  image:
    tag: e2e
  # the containerd of a Kind node
  criSocket: /run/containerd/containerd.sock
  hostPrep:
    # The Kind node's kernel does not offer these (a read-only /sys/module, no net.core.fb_tunnels_only_for_init_net).
    conntrackAccounting: false
    sysctls:
      net.core.fb_tunnels_only_for_init_net: null
vpn:
  image:
    tag: e2e
inetGateway:
  image:
    tag: e2e
devices:
  security:
    # Kind on the GitHub runner cannot start a device pod in a user namespace (runc: mounting sysfs at /sys: operation
    # not permitted); the reservation tests need running devices, not the user namespace.
    userNamespaces: false
# The gang test sizes devices from the node memory (45 % of a node); the default device cap (4Gi) would shrink them on a
# larger runner, and then three labs fit one node.
limits:
  device:
    maxMemory: "0"
# the pools of the Kind cluster: the workers are the lab pool (one of them tainted), the control plane is the lab-control pool and its taint is tolerated
pools:
  lab:
    tolerations:
      - key: cybericebox.com/lab
        operator: Equal
        value: "true"
        effect: NoSchedule
  labControl:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
# the edge (cert-manager, proxy) is not part of the reservation tests
labScheduler:
  enabled: false
proxy:
  enabled: false
  # the WireGuard demultiplexer follows vpn.enabled, not proxy.enabled: Kind has no Cilium (its policy) and no LoadBalancer for the edge
  wg:
    enabled: false
  networkPolicy:
    enabled: false
certManager:
  enabled: false
scheduler:
  prepull:
    # no registry to pull from ahead of time: the images are on the nodes already
    enabled: false
