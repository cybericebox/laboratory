# Kind cluster of the e2e tests: one control plane and two lab workers (label cybericebox.com/lab of the recommended
# lab-node placement, see labWorkloads in the chart). One lab worker is tainted cybericebox.com/lab=true:NoSchedule, so the
# toleration path of the scheduler runs; the other is not, because the scaffold's own e2e test deploys the operator and
# cert-manager with no tolerations and they need a node to land on.
# The node image is pinned to Kubernetes 1.35 (the chart's minimum, KEP-2535 on by default): the CI runs the same cluster every time, not
# whatever the kind release defaults to. Change the three lines together.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      cybericebox.com/lab: "true"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: cybericebox.com/lab
              value: "true"
              effect: NoSchedule
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      cybericebox.com/lab: "true"
