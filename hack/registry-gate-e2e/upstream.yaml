# Two upstream registries for the E2E: "pub" answers anyone, "priv" wants Basic credentials (alice).
apiVersion: v1
kind: Namespace
metadata: {name: laboratory-system}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: upstream-pub, namespace: laboratory-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: upstream-pub}}
  template:
    metadata: {labels: {app: upstream-pub}}
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: upstream-pub, namespace: laboratory-system}
spec:
  selector: {app: upstream-pub}
  ports: [{port: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: upstream-priv, namespace: laboratory-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: upstream-priv}}
  template:
    metadata: {labels: {app: upstream-priv}}
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: upstream}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: auth, mountPath: /auth, readOnly: true}]
      volumes:
        - name: auth
          secret: {secretName: upstream-priv-htpasswd}
---
apiVersion: v1
kind: Service
metadata: {name: upstream-priv, namespace: laboratory-system}
spec:
  selector: {app: upstream-priv}
  ports: [{port: 5000}]
