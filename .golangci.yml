version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
    goconst:
      # a literal repeated this often in production code is a constant
      min-occurrences: 5
  exclusions:
    generated: lax
    rules:
      # Tests are table- and fixture-heavy: repeated literals, long lines, unchecked cleanup errors, helpers whose
      # argument is the same in every call, preallocation and duplicate shapes are normal there.
      - linters:
          - goconst
          - lll
          - dupl
          - errcheck
          - prealloc
          - unparam
          - gocyclo
        path: (_test\.go|^test/)
      # Test code: identical operands are the point of a comparison test, and the e2e helpers dot-import ginkgo.
      - linters:
          - staticcheck
        text: "SA4000|ST1001"
        path: (_test\.go|^test/)
      # Deprecated APIs whose replacement is a migration of its own, not a lint fix: the events API of
      # controller-runtime, Result.Requeue, the scheme.Builder helper of the api packages, ReverseProxy.Director,
      # and the API fields and gRPC members that are kept deliberately for older clients.
      - linters:
          - staticcheck
        text: "SA1019: .*(GetEventRecorderFor|Result\\)\\.Requeue|scheme\\.Builder|ReverseProxy\\)\\.Director|ProbeWhileSuspended|SecurityVersion)"
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
